/* Highbase · Field foundation — shared by Text Field, Text Area, Phone Field, Search, Select.

/* ==== Button.css ==== */
/* Highbase · Button (atom)
   Requires 03_Tokens/dist/tokens.css.
   API (data attributes):
     data-intent = primary | secondary | danger
     data-style  = filled | tonal | outlined | ghost
     data-size   = sm (32) | md (40) | lg (48)
     data-width  = hug (default) | fill | fixed
     data-loading, disabled, aria-pressed (pressed state for demo only)
   Content: <span class="hb-btn__icon"> + <span class="hb-btn__label"> in any order; icon-only = no label + aria-label.
*/

.hb-btn {
  /* per-intent×style slots — set below, consumed here */
  --btn-bg: transparent;
  --btn-bg-hover: transparent;
  --btn-bg-pressed: transparent;
  --btn-bg-disabled: transparent;
  --btn-text: currentColor;
  --btn-text-disabled: currentColor;
  --btn-border: transparent;
  --btn-border-disabled: transparent;
  --btn-border-w: 0px;

  /* size slots */
  --btn-h: var(--hb-component-button-height-md);
  --btn-px: var(--hb-component-button-padding-x);
  --btn-icon: 20px;
  --btn-fs: var(--hb-font-size-14);
  --btn-lh: var(--hb-font-line-height-latin-14);
  --btn-fw: var(--hb-font-weight-medium); /* R2: md/lg labels are the label-lg-strong role (SemiBold 14/20), sm is label-md-strong (12/16) — both (proposal) 24 Sep 2026, set per size below */

  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--hb-component-button-gap);
  box-sizing: border-box;
  height: var(--btn-h);
  min-width: var(--btn-h);
  padding-block: 0;
  padding-inline: var(--btn-px);
  border-radius: var(--hb-component-button-radius);
  border: var(--btn-border-w) solid var(--btn-border);
  background: var(--btn-bg);
  color: var(--btn-text);
  font-family: var(--hb-font-family-latin);
  font-size: var(--btn-fs);
  line-height: var(--btn-lh);
  font-weight: var(--btn-fw);
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
  text-decoration: none;
  transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease;
  position: relative;
}
[lang="ar"] .hb-btn, [dir="rtl"] .hb-btn { font-family: var(--hb-font-family-arabic); }

.hb-btn__icon { width: var(--btn-icon); height: var(--btn-icon); flex: 0 0 auto; display: inline-flex; }
.hb-btn__icon svg { width: 100%; height: 100%; }
.hb-btn__label { display: inline-block; }
.hb-btn:not(:has(.hb-btn__label)) { padding-inline: 0; width: var(--btn-h); }   /* icon-only → square */

.hb-btn[data-intent="secondary"][data-style="tonal"]    { --btn-bg: var(--hb-color-surface-container-low); --btn-bg-hover: var(--hb-color-surface-dim); --btn-bg-pressed: var(--hb-color-surface-container-high); --btn-bg-disabled: var(--hb-color-surface-container-low); --btn-text: var(--hb-color-on-surface); --btn-text-disabled: var(--hb-color-surface-container-highest); }

.hb-check:has(.hb-check__input:disabled), .hb-check[data-state="disabled"] { cursor: not-allowed; color: var(--hb-color-on-surface-disabled); }
.hb-check__label { padding-top: 2px; }
.hb-check__hint { display: block; color: var(--hb-color-on-surface-variant); font-size: var(--hb-font-size-12); line-height: var(--hb-font-line-height-latin-12); }
@media (prefers-reduced-motion: reduce) { .hb-check__box { transition: none; } }

/* ==== RadioButton.css ==== */
/* Highbase · Radio Button (atom) — Structure type 2 (standalone)
   <label class="hb-radio"><input type="radio" name="g" class="hb-radio__input"> <span class="hb-radio__circle"></span> <span class="hb-radio__label">Text</span></label> */
.hb-radio { display: inline-flex; align-items: flex-start; gap: var(--hb-space-8); cursor: pointer; font-family: var(--hb-font-family-latin); font-size: var(--hb-font-size-14); line-height: var(--hb-font-line-height-latin-14); color: var(--hb-color-on-surface); position: relative; }
[lang="ar"] .hb-radio, [dir="rtl"] .hb-radio { font-family: var(--hb-font-family-arabic); line-height: var(--hb-font-line-height-arabic-14); }
.hb-radio__input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; }
.hb-radio__circle { box-sizing: border-box; flex: 0 0 auto; width: var(--hb-component-selection-control); height: var(--hb-component-selection-control); margin: 2px; border: var(--hb-component-selection-border-width) solid var(--hb-color-outline); border-radius: 50%; background: var(--hb-color-surface); display: inline-grid; place-items: center; transition: border-color 120ms, box-shadow 120ms; }
.hb-radio__circle::after { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--hb-color-primary); transform: scale(0); transition: transform 120ms; }
.hb-radio__input:checked + .hb-radio__circle { border-color: var(--hb-color-primary); }
.hb-radio__input:checked + .hb-radio__circle::after { transform: scale(1); }
.hb-radio:hover .hb-radio__circle, .hb-radio[data-state="hover"] .hb-radio__circle { box-shadow: 0 0 0 8px var(--hb-color-primary-container-low); }
.hb-radio:hover .hb-radio__input:checked + .hb-radio__circle, .hb-radio[data-state="hover"] .hb-radio__input:checked + .hb-radio__circle { border-color: var(--hb-color-primary-hover); }
.hb-radio:hover .hb-radio__input:checked + .hb-radio__circle::after { background: var(--hb-color-primary-hover); }
.hb-radio__input:focus-visible + .hb-radio__circle, .hb-radio[data-state="focus"] .hb-radio__circle { outline: 2px solid var(--hb-color-inverse-primary); outline-offset: 2px; }
.hb-radio__input:disabled + .hb-radio__circle, .hb-radio[data-state="disabled"] .hb-radio__circle { border-color: var(--hb-color-outline-variant); box-shadow: none; }
.hb-radio__input:disabled + .hb-radio__circle::after, .hb-radio[data-state="disabled"] .hb-radio__circle::after { background: var(--hb-color-surface-container-high); }
.hb-radio:has(.hb-radio__input:disabled), .hb-radio[data-state="disabled"] { cursor: not-allowed; color: var(--hb-color-on-surface-disabled); }
.hb-radio__label { padding-top: 2px; }
.hb-radio__hint { display: block; color: var(--hb-color-on-surface-variant); font-size: var(--hb-font-size-12); line-height: var(--hb-font-line-height-latin-12); }
@media (prefers-reduced-motion: reduce) { .hb-radio__circle, .hb-radio__circle::after { transition: none; } }

/* ==== SearchField.css ==== */
/* Highbase · Search (molecule) — Structure type 2. (file) Search bar 44h, radius full, leading 24 icon.
   States added in the 13 Sep review (F3): default | hover | focus | typing | filled | disabled.
   data-style = default | compressed (icon-only, 44×44)
   data-state mirrors the Figma State axis so the spec and the code stay checkable against each other;
   the real :hover / :focus-within rules do the work in a live page. */
.hb-search { display: inline-flex; align-items: center; gap: var(--hb-space-6); box-sizing: border-box; width: 100%; min-height: var(--hb-component-field-height); padding-inline: var(--hb-space-12); background: var(--hb-color-surface-container-low); border: 0; border-radius: var(--hb-radius-full); font-family: var(--hb-font-family-latin); transition: background-color 120ms, box-shadow 120ms; }
[lang="ar"] .hb-search, [dir="rtl"] .hb-search { font-family: var(--hb-font-family-arabic); }

/* hover — the ground steps up one container level */
.hb-search:hover, .hb-search[data-state="hover"] { background: var(--hb-color-surface-container); }

/* focus and typing — white ground plus the focus ring.
   The ring is color/inverse-primary: F1 deleted component/button/focus-ring, and that semantic role is
   what it resolved to, so this is the existing focus-ring value rather than a new one. */
.hb-search:focus-within, .hb-search[data-state="focus"], .hb-search[data-state="typing"] {
  background: var(--hb-color-surface);
  box-shadow: 0 0 0 2px var(--hb-color-inverse-primary);
}
.hb-search:focus-within .hb-search__icon, .hb-search[data-state="focus"] .hb-search__icon, .hb-search[data-state="typing"] .hb-search__icon { color: var(--hb-color-on-surface); }

/* filled — has a value, not focused */
.hb-search[data-state="filled"] { background: var(--hb-color-surface-container-low); }
.hb-search[data-state="filled"] .hb-search__input, .hb-search[data-state="typing"] .hb-search__input { color: var(--hb-color-on-surface); }

/* disabled */
.hb-search[data-state="disabled"], .hb-search:has(.hb-search__input:disabled) { background: var(--hb-color-surface-container-low); cursor: not-allowed; }
.hb-search[data-state="disabled"] .hb-search__input, .hb-search[data-state="disabled"] .hb-search__icon { color: var(--hb-color-on-surface-disabled); }
.hb-search[data-state="disabled"]:hover { background: var(--hb-color-surface-container-low); }

.hb-search__icon { width: 24px; height: 24px; flex: 0 0 auto; color: var(--hb-color-on-surface-variant); display: inline-flex; }
.hb-search__icon svg { width: 100%; height: 100%; }
.hb-search__input { flex: 1 1 auto; min-width: 0; border: 0; padding: 0; background: none; outline: none; font: inherit; font-size: var(--hb-font-size-14); color: var(--hb-color-on-surface); }
.hb-search__input::placeholder { color: var(--hb-color-on-surface-disabled); }

/* the clear affordance exists only once there is a value */
.hb-search__clear { display: none; flex: 0 0 auto; }
.hb-search[data-state="typing"] .hb-search__clear, .hb-search[data-state="filled"] .hb-search__clear { display: inline-flex; }

.hb-search[data-style="compressed"] { width: var(--hb-component-field-height); padding-inline: 0; justify-content: center; }
.hb-search[data-style="compressed"] .hb-search__input, .hb-search[data-style="compressed"] .hb-search__clear { display: none; }

/* ==== TextField.css ==== */
/* Highbase · Text Field (molecule) — Structure type 2 (standalone; base = Field). Requires Field.css.
   <div class="hb-field hb-textfield" data-state="…"> label? · control(input + icons) · message? */
.hb-textfield .hb-field__control { padding-inline-end: var(--hb-space-8); }
/* (live) 24 Sep 2026: the sm 36 proposal is dropped — no such field ships. */
.hb-textfield .hb-field__clear { display: none; inline-size: var(--hb-space-16); block-size: var(--hb-space-16); padding: 0; border: 0; background: none; color: var(--hb-color-on-surface); cursor: pointer; }
.hb-textfield[data-state="typing"] .hb-field__clear { display: inline-flex; }
.hb-textfield .hb-field__clear:hover { color: var(--hb-color-error); }
.hb-textfield .hb-field__affix { color: var(--hb-color-on-surface-variant); font-size: var(--hb-font-size-14); white-space: nowrap; }

/* ==== Breadcrumb.css ==== */
/* Highbase · Breadcrumb (molecule) — Structure type 1. (live) Dot separator, muted current page — corrected from the product on 12 Sep. */
.hb-crumbs { display: flex; align-items: center; gap: var(--hb-space-4); flex-wrap: wrap; font-family: var(--hb-font-family-latin); font-size: var(--hb-font-size-14); line-height: var(--hb-font-line-height-latin-14); }
[lang="ar"] .hb-crumbs, [dir="rtl"] .hb-crumbs { font-family: var(--hb-font-family-arabic); }
.hb-crumbs__link { color: var(--hb-component-breadcrumb-link); text-decoration: none; /* (live) 24 Sep 2026: primary/950 */ padding: var(--hb-space-2) var(--hb-space-4); border-radius: var(--hb-radius-4); }
.hb-crumbs__link:hover { text-decoration: underline; }
.hb-crumbs__link:focus-visible { outline: 2px solid var(--hb-color-inverse-primary); outline-offset: 1px; }
.hb-crumbs__sep { display: inline-flex; align-items: center; justify-content: center; width: 16px; color: var(--hb-color-on-surface-disabled); flex: 0 0 auto; font-size: 16px; line-height: 1; }  /* (live) a dot, not a chevron */
.hb-crumbs__current { color: var(--hb-component-breadcrumb-current); /* (live) neutral/400 */ font-weight: var(--hb-font-weight-regular); padding: var(--hb-space-2) var(--hb-space-4); }

/* ==== AddToCart.css ==== */
/* Highbase · Add to Cart (molecule) — REBUILT 13 Sep from the live Highbase storefront.
   (live) The cart control is a state machine, not a button:
     data-state="add"            filled primary button, leading cart icon
     data-state="stepper"        quantity stepper — minus / value / plus        (qty > 1)
     data-state="stepper-single" the minus becomes a trash icon in the error colour (qty = 1)
     data-state="disabled"       the same button, disabled, for an unavailable product
   Every state fills the same slot at the same height, so a product card does not reflow when an
   item enters the cart. That is the whole point of the pattern. */
.hb-atc { display: flex; align-items: center; box-sizing: border-box; width: 100%; height: var(--hb-component-add-to-cart-height); }
.hb-atc > .hb-btn { flex: 1 1 auto; min-width: 0; height: 100%; }
.hb-atc[data-state="stepper"], .hb-atc[data-state="stepper-single"] { gap: var(--hb-space-4); padding: var(--hb-component-add-to-cart-padding); border: 1px solid var(--hb-color-outline); border-radius: var(--hb-component-add-to-cart-radius); background: var(--hb-color-surface); font-family: var(--hb-font-family-latin); }
[lang="ar"] .hb-atc, [dir="rtl"] .hb-atc { font-family: var(--hb-font-family-arabic); }
.hb-atc__step { flex: 0 0 auto; width: var(--hb-component-add-to-cart-step-size); height: var(--hb-component-add-to-cart-step-size); }
.hb-atc__value { flex: 1 1 auto; min-width: 0; text-align: center; font-size: var(--hb-font-size-16); line-height: var(--hb-font-line-height-latin-16); font-weight: var(--hb-font-weight-bold); font-variant-numeric: tabular-nums; border: 0; background: none; outline: none; color: var(--hb-color-on-surface); }

/* ==== Snackbar.css ==== */
/* Highbase · Snackbar (molecule) — Structure type 1. Requires _base/Alert.css. (file) 56 h, r12, p12/12, gap 16, 1 px border in the status base colour, up to two pill actions + close. */
/* (live) 24 Sep 2026: the product's toast — start corners only, a 6px status bar on the end edge instead of the border, padding 12 / 16 end, level-3 shadow, optional title 14 SemiBold/22 */
.hb-snackbar { min-height: var(--hb-component-snackbar-min-height); gap: var(--hb-space-16); padding-inline-end: var(--hb-component-snackbar-padding-x); border: 0; border-inline-end: var(--hb-component-snackbar-bar) solid var(--a-icon); border-radius: var(--hb-component-snackbar-radius); border-start-end-radius: 0; border-end-end-radius: 0; box-shadow: var(--hb-elevation-level-3); max-inline-size: var(--hb-component-snackbar-max-width); }
@media (min-width: 768px) { .hb-snackbar { max-inline-size: 800px; } }
.hb-snackbar .hb-alert__title { font-weight: var(--hb-font-weight-semibold); /* = label-lg-strong (proposal) */ line-height: var(--hb-component-snackbar-title-line-height); }
.hb-snackbar .hb-alert__text { font-weight: var(--hb-font-weight-medium); }
.hb-snackbar__group { display: flex; align-items: center; gap: var(--hb-space-6); flex: 1 1 auto; min-width: 0; }

/* ==== DialogHeader.css ==== */
/* Highbase · Dialog Header (molecule) — Structure type 4 (slots: back, title, counter, close).
   (file) Web/Tablet 56 h, p 8/20, 1 px bottom border, title 18 Bold, optional back button 40 and a Label/Counter pill on Primary/50; Mobile 48 h, p 8/16, 32 close.
   data-variant = main | nested | cancel-only | none ; data-size = default | compact */
.hb-dlg-header { display: flex; align-items: center; gap: var(--hb-space-12); box-sizing: border-box; min-height: var(--hb-component-dialog-header-height); padding: var(--hb-component-dialog-header-padding); /* (live) 24 Sep 2026: 16 all round */ background: var(--hb-color-surface); border-bottom: 1px solid var(--hb-color-surface-dim); font-family: var(--hb-font-family-latin); }
[lang="ar"] .hb-dlg-header, [dir="rtl"] .hb-dlg-header { font-family: var(--hb-font-family-arabic); }
.hb-dlg-header[data-size="compact"] { min-height: var(--hb-component-dialog-header-height-compact); }
.hb-dlg-header__title { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: var(--hb-space-12); font-size: var(--hb-component-dialog-header-title); line-height: var(--hb-font-line-height-latin-18); font-weight: var(--hb-font-weight-bold); color: var(--hb-component-dialog-header-title-color); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hb-dlg-header__counter { flex: 0 0 auto; display: inline-flex; align-items: center; height: 28px; padding-inline: var(--hb-space-12); border-radius: var(--hb-radius-full); background: var(--hb-color-primary-container-low); color: var(--hb-color-primary-hover); font-size: var(--hb-font-size-12); font-weight: var(--hb-font-weight-medium); }

/* (live) 24 Sep 2026: close 32 (28 compact) on a neutral/50 ground with a neutral/600 icon; a danger dialog colours the title error/base */
.hb-dlg-header .hb-icon-btn, .hb-dlg-header__close { --btn-h: var(--hb-component-dialog-close-size); background: var(--hb-component-dialog-close-bg); color: var(--hb-component-dialog-close-fg); }
.hb-dlg-header[data-size="compact"] .hb-icon-btn { --btn-h: var(--hb-component-icon-button-size-sm); }
.hb-dlg-header[data-intent="danger"] .hb-dlg-header__title { color: var(--hb-color-error); }

/* ==== DialogActions.css ==== */
/* Highbase · Dialog Actions (molecule) — Structure type 4 (slot: buttons).
   (file) Web/Tablet actions bar 84 h, p 20, gap 8, 1 px top border, buttons right-aligned in the order ternary → secondary → primary.
   Mobile footer: 16 padding, optional text line; actions stack vertically or sit in a row.
   data-direction = end | stack | row
   STACK, changed 13 Sep: the buttons fill the bar's width and the PRIMARY sits on top, secondary beneath it,
   ternary last. The markup is emitted in that same order — no column-reverse — so the reading order, the tab
   order and the visual order are the same thing. A destructive action takes the error role, never secondary. */
.hb-dlg-actions { display: flex; align-items: center; justify-content: flex-end; gap: var(--hb-component-dialog-actions-gap); box-sizing: border-box; min-height: var(--hb-component-dialog-actions-height); padding: var(--hb-component-dialog-actions-padding); background: var(--hb-color-surface); border-top: 1px solid var(--hb-color-surface-dim); font-family: var(--hb-font-family-latin); }
[lang="ar"] .hb-dlg-actions, [dir="rtl"] .hb-dlg-actions { font-family: var(--hb-font-family-arabic); }
.hb-dlg-actions[data-direction="stack"] { flex-direction: column; align-items: stretch; min-height: 0; gap: var(--hb-component-dialog-actions-stack-gap); padding: var(--hb-component-dialog-actions-stack-padding); }
.hb-dlg-actions[data-direction="row"] { justify-content: stretch; min-height: 0; padding: var(--hb-space-16); }
.hb-dlg-actions[data-direction="row"] > .hb-btn { flex: 1 1 0; }
.hb-dlg-actions__note { flex: 1 1 auto; font-size: var(--hb-font-size-12); color: var(--hb-color-on-surface-variant); }
.hb-dlg-actions[data-direction="stack"] .hb-dlg-actions__note { order: -1; text-align: center; }

/* ==== Header.css ==== */
/* Highbase · Header (organism) — REBUILT 13 Sep from the live Highbase storefront. Replaces Top App Bar.
   (live) Logo · Categories · Brands · Search · gift / cart / chat / bell with count badges ·
   language switch · account chip with a truncating branch line.
     data-view = marketplace | dashboard   (dashboard swaps Categories + Brands + Search for the Breadcrumb)
     data-size = expanded | compact
   The bar instances Logo, SearchField, IconButton, Badge, Avatar and Breadcrumb — it redraws none of them.
   Badge counts are content, never a variant.
   No absolutely-positioned layer: the count badge rides its icon button on a negative flex gap. */

.hb-header { box-sizing: border-box; display: flex; align-items: center; gap: var(--hb-component-header-gap); min-height: var(--hb-component-header-height); padding: var(--hb-component-header-padding-y) var(--hb-component-header-padding-x); background: var(--hb-color-surface); border-bottom: 1px solid var(--hb-color-outline-variant); font-family: var(--hb-font-family-latin); }
[lang="ar"] .hb-header, [dir="rtl"] .hb-header { font-family: var(--hb-font-family-arabic); }
.hb-header[data-size="compact"] { min-height: var(--hb-component-header-height-compact); padding-inline: var(--hb-component-header-padding-x-compact); gap: var(--hb-space-8); }

/* 2 · 3 · 6 — the nav, language and any other label-plus-icon trigger share one pill */
.hb-header__nav { display: flex; align-items: center; gap: var(--hb-component-header-gap-tight); flex: 0 0 auto; }
.hb-header__pill { display: inline-flex; align-items: center; gap: var(--hb-space-6); border: 0; padding: var(--hb-component-header-nav-padding-y) var(--hb-component-header-nav-padding-x); border-radius: var(--hb-component-header-nav-radius); background: none; color: var(--hb-color-on-surface); font: inherit; font-size: var(--hb-font-size-14); line-height: var(--hb-font-line-height-latin-14); font-weight: var(--hb-font-weight-medium); cursor: pointer; }
.hb-header__pill:hover { background: var(--hb-color-surface-container-low); }
.hb-header__pill[aria-expanded="true"] { background: var(--hb-color-primary-container-low); color: var(--hb-color-primary); }
.hb-header__pill svg { width: 20px; height: 20px; flex: 0 0 auto; color: var(--hb-color-on-surface-variant); }
.hb-header__pill svg[data-mirror] { width: 16px; height: 16px; }
[dir="rtl"] .hb-header__pill svg[data-mirror] { transform: scaleX(-1); }

/* 4 · Search takes the remaining width */
.hb-header__search { flex: 1 1 auto; min-width: 0; }
.hb-header__spacer { flex: 1 1 auto; }

/* 5 · action cluster — the badge rides the button on a negative gap, never absolutely */
.hb-header__actions { display: flex; align-items: center; gap: var(--hb-component-header-gap-tight); flex: 0 0 auto; }
.hb-header__action { display: inline-flex; align-items: flex-start; gap: var(--hb-component-header-badge-offset); }

/* 7 · account chip */
.hb-header__account { display: flex; align-items: center; gap: var(--hb-space-8); border: 0; padding: var(--hb-space-4) var(--hb-space-8); border-radius: var(--hb-component-header-nav-radius); background: none; font: inherit; cursor: pointer; text-align: start; }
.hb-header__account:hover { background: var(--hb-color-surface-container-low); }
.hb-header__account-lines { display: flex; flex-direction: column; gap: var(--hb-space-2); min-width: 0; }
.hb-header__account-name { font-size: var(--hb-font-size-14); line-height: var(--hb-font-line-height-latin-14); font-weight: var(--hb-font-weight-medium); color: var(--hb-color-on-surface); }
.hb-header__account-branch { max-width: var(--hb-component-header-account-line-width); font-size: var(--hb-font-size-12); line-height: var(--hb-font-line-height-latin-12); color: var(--hb-color-on-surface-variant); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* view switch */
.hb-header[data-view="dashboard"] .hb-header__nav,
.hb-header[data-view="dashboard"] .hb-header__search { display: none; }
.hb-header[data-view="marketplace"] .hb-header__breadcrumb { display: none; }

/* compact collapse — (proposal) not visible in the screenshots */
.hb-header[data-size="compact"] .hb-header__nav,
.hb-header[data-size="compact"] .hb-header__account-lines,
.hb-header[data-size="compact"] .hb-header__language { display: none; }
.hb-header[data-size="compact"] .hb-header__action[data-collapse] { display: none; }

/* slide-in panel, unchanged from the previous component */
.hb-header-panel { position: absolute; inset-block: 0; inset-inline-end: 0; width: var(--hb-component-header-panel-width); max-width: 100%; display: flex; flex-direction: column; background: var(--hb-color-surface); border-inline-start: 1px solid var(--hb-color-outline-variant); }
.hb-header-scrim { position: absolute; inset: 0; background: var(--hb-color-scrim); }

/* ==== Card.css ==== */
/* Highbase · Card (organism) — Structure type 4 (slot). (proposal) 24 Sep 2026
   The dashboard section card the product uses everywhere (Sections/Card.vue): white, 1 px neutral/100 border,
   radius 16, padding 16, gap 24. Not in the file — a proposal awaiting a decision.
   <section class="hb-card"><h2 class="hb-card__title">…</h2> …content… </section> */
.hb-card { box-sizing: border-box; display: flex; flex-direction: column; gap: var(--hb-component-card-gap); padding: var(--hb-component-card-padding); background: var(--hb-color-surface); border: 1px solid var(--hb-component-card-border); border-radius: var(--hb-component-card-radius); font-family: var(--hb-font-family-latin); }
[lang="ar"] .hb-card, [dir="rtl"] .hb-card { font-family: var(--hb-font-family-arabic); }
.hb-card__title { margin: 0; font-size: var(--hb-font-size-16); line-height: var(--hb-font-line-height-latin-16); font-weight: var(--hb-font-weight-bold); color: var(--hb-color-on-surface); }
[lang="ar"] .hb-card__title, [dir="rtl"] .hb-card__title { line-height: var(--hb-font-line-height-arabic-16); }

/* ==== ProductCard.css ==== */
/* Highbase · Product Card (organism) — REBUILT 13 Sep from the live Highbase storefront.
   (live) Media band carrying a pack-type Chip, a bookmark control and a wholesale Chip;
   title clamped to two lines; a tinted price row; an amber coupon row with a discount pill,
   the code and the post-coupon price; a "View N more coupons" link; a supplier line that can
   render as a skeleton; then the Add to Cart slot and Match My Price with its ribbon badge.
   Axes mirror the Figma variant set exactly:
     data-price    = regular | sale
     data-coupon   = none | single | multiple
     data-cart     = add | stepper | disabled        (drives the nested Add to Cart)
     data-saved    = false | true
     data-supplier = known | loading
   The ribbon over Match My Price is the only absolutely-positioned layer in the card, and is
   deliberate — it straddles the button's bottom border, which no token can express. */

.hb-pcard { box-sizing: border-box; display: flex; flex-direction: column; width: var(--hb-component-product-card-width); max-width: 100%; background: var(--hb-color-surface); border: 1px solid var(--hb-color-outline-variant); border-radius: var(--hb-component-product-card-radius); overflow: hidden; font-family: var(--hb-font-family-latin); }
[lang="ar"] .hb-pcard, [dir="rtl"] .hb-pcard { font-family: var(--hb-font-family-arabic); }

/* 1 · Media — the product image is the band's own background, so the band stays a plain
   flex column and the chips sit in normal flow rather than on top of it. */
.hb-pcard__media { display: flex; flex-direction: column; justify-content: space-between; aspect-ratio: var(--hb-component-product-card-media-aspect); padding: var(--hb-component-product-card-media-padding); background-color: var(--hb-color-surface-container-low); background-size: cover; background-position: center; }
.hb-pcard__media-top { display: flex; align-items: center; justify-content: space-between; }
.hb-pcard__media-bottom { display: flex; }

/* 3 · Title — two lines, then truncate */
.hb-pcard__body { display: flex; flex-direction: column; gap: var(--hb-component-product-card-gap); padding: var(--hb-component-product-card-padding-y) var(--hb-component-product-card-padding-x); flex: 1 1 auto; }
.hb-pcard__title { font-size: var(--hb-component-product-card-title-size); line-height: var(--hb-font-line-height-latin-16); font-weight: var(--hb-font-weight-semibold); color: var(--hb-color-on-surface-heading); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
[dir="rtl"] .hb-pcard__title, [lang="ar"] .hb-pcard__title { line-height: var(--hb-font-line-height-arabic-16); }

/* shared row shape — price and coupon */
.hb-pcard__row { display: flex; align-items: center; gap: var(--hb-space-8); padding: var(--hb-component-product-card-row-padding-y) var(--hb-component-product-card-row-padding-x); border-radius: var(--hb-component-product-card-row-radius); font-variant-numeric: tabular-nums; }
.hb-pcard__pill { display: inline-flex; align-items: center; padding: var(--hb-component-product-card-pill-padding-y) var(--hb-component-product-card-pill-padding-x); border-radius: var(--hb-component-product-card-pill-radius); font-size: var(--hb-font-size-10); line-height: var(--hb-font-line-height-latin-10); font-weight: var(--hb-font-weight-medium); white-space: nowrap; }

/* 4 · Price row */
.hb-pcard__price { justify-content: space-between; background: var(--hb-color-primary-container-low); }
.hb-pcard__price-label { font-size: var(--hb-font-size-12); line-height: var(--hb-font-line-height-latin-12); font-weight: var(--hb-font-weight-medium); color: var(--hb-color-on-primary-container-strong); }
.hb-pcard__price-value { display: flex; align-items: center; gap: var(--hb-space-6); }
.hb-pcard__amount { display: flex; align-items: center; gap: var(--hb-space-2); }
.hb-pcard__currency { font-size: var(--hb-font-size-12); line-height: var(--hb-font-line-height-latin-12); color: var(--hb-color-on-surface-variant); }
.hb-pcard__figure { font-size: var(--hb-font-size-16); line-height: var(--hb-font-line-height-latin-16); font-weight: var(--hb-font-weight-bold); color: var(--hb-color-on-surface); }

/* 5 · Sale — a dark percentage pill and the struck original. Hidden unless data-price="sale". */
.hb-pcard__sale-pill { background: var(--hb-color-inverse-surface); color: var(--hb-color-inverse-on-surface); }
.hb-pcard__was { font-size: var(--hb-font-size-12); line-height: var(--hb-font-line-height-latin-12); color: var(--hb-color-on-surface-muted); text-decoration: line-through; }
.hb-pcard:not([data-price="sale"]) .hb-pcard__sale-pill,
.hb-pcard:not([data-price="sale"]) .hb-pcard__was { display: none; }

/* 6 · Coupon row */
.hb-pcard__coupon { background: var(--hb-color-accent-yellow-container); color: var(--hb-color-on-accent-yellow); }
.hb-pcard__coupon-pill { background: var(--hb-color-error); color: var(--hb-color-on-error); }
.hb-pcard__coupon-code { display: flex; align-items: center; gap: var(--hb-space-4); font-size: var(--hb-font-size-12); line-height: var(--hb-font-line-height-latin-12); font-weight: var(--hb-font-weight-medium); }
.hb-pcard__coupon-code svg { width: 16px; height: 16px; flex: 0 0 auto; }
.hb-pcard__coupon-after { margin-inline-start: auto; font-size: var(--hb-font-size-14); line-height: var(--hb-font-line-height-latin-14); font-weight: var(--hb-font-weight-bold); }
.hb-pcard[data-coupon="none"] .hb-pcard__coupon { display: none; }

/* 7 · More coupons — only when more than one exists */
.hb-pcard__more { display: inline-flex; align-items: center; gap: var(--hb-space-2); border: 0; padding: 0; background: none; font: inherit; font-size: var(--hb-font-size-12); line-height: var(--hb-font-line-height-latin-12); font-weight: var(--hb-font-weight-medium); color: var(--hb-color-link); cursor: pointer; align-self: flex-start; }
.hb-pcard__more svg { width: 16px; height: 16px; }
.hb-pcard__more svg + svg { margin-inline-start: -9px; }
.hb-pcard:not([data-coupon="multiple"]) .hb-pcard__more { display: none; }

/* 8 · Supplier — the value is a skeleton bar while it loads, never an empty gap */
.hb-pcard__supplier { display: flex; align-items: center; gap: var(--hb-space-4); font-size: var(--hb-font-size-12); line-height: var(--hb-font-line-height-latin-12); color: var(--hb-color-on-surface-variant); min-width: 0; }
.hb-pcard__supplier svg { width: 16px; height: 16px; flex: 0 0 auto; }
.hb-pcard__supplier-name { font-weight: var(--hb-font-weight-medium); color: var(--hb-color-link); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hb-pcard__supplier-skeleton { width: var(--hb-component-product-card-skeleton-width); height: var(--hb-component-product-card-skeleton-height); border-radius: var(--hb-radius-4); background: var(--hb-color-surface-container-high); }
.hb-pcard[data-supplier="loading"] .hb-pcard__supplier-name { display: none; }
.hb-pcard:not([data-supplier="loading"]) .hb-pcard__supplier-skeleton { display: none; }

/* 9 / 10 · Actions */
.hb-pcard__actions { margin-top: auto; display: flex; flex-direction: column; gap: var(--hb-space-8); }
.hb-pcard__match { position: relative; display: flex; }
.hb-pcard__match > .hb-btn { flex: 1 1 auto; }
/* the ribbon's vertical centre sits on the button's bottom border — expressed as a half-height
   translate so the rule needs no pixel token and holds at any ribbon height */
.hb-pcard__ribbon { position: absolute; left: 50%; bottom: 0; transform: translate(-50%, 50%); padding: var(--hb-component-product-card-pill-padding-y) var(--hb-space-8); border-radius: var(--hb-radius-full); background: var(--hb-color-secondary-pressed); color: var(--hb-color-on-primary); font-size: var(--hb-font-size-10); line-height: var(--hb-font-line-height-latin-10); font-weight: var(--hb-font-weight-medium); white-space: nowrap; }

/* (live) 24 Sep 2026: the bookmark is a 36 icon button on neutral/50 with one 6px corner at the bottom-start; saved = primary/100 ground, primary/600 icon */
.hb-pcard__media .hb-icon-btn, .hb-pcard__bookmark { --btn-h: var(--hb-component-product-card-fav-size); background: var(--hb-color-surface-container-low); color: var(--hb-color-on-surface-heading); border-radius: 0 0 0 var(--hb-component-product-card-fav-radius); }
.hb-pcard[data-saved="true"] .hb-pcard__media .hb-icon-btn, .hb-pcard[data-saved="true"] .hb-pcard__bookmark { background: var(--hb-color-primary-container); color: var(--hb-color-primary); }

/* ==== BottomSheet.css ==== */
/* Highbase · Bottom Sheet (organism, compact) — Structure type 4 (slots: header, body, actions).
   (file) Mobile Bottom sheet 375 wide, radius 16 top, a 40 × 4 grabber on Neutrals/200, Mobile popup header 48, body 16 padding, footer, home indicator 21. */
.hb-sheet-layer { position: relative; display: flex; align-items: flex-end; justify-content: center; min-height: 420px; background: var(--hb-color-scrim); border-radius: var(--hb-radius-12); overflow: hidden; }
.hb-sheet { box-sizing: border-box; display: flex; flex-direction: column; width: 375px; max-width: 100%; max-height: 92%; background: var(--hb-color-surface); border-start-start-radius: var(--hb-component-sheet-radius); border-start-end-radius: var(--hb-component-sheet-radius); overflow: hidden; font-family: var(--hb-font-family-latin); }
[lang="ar"] .hb-sheet, [dir="rtl"] .hb-sheet { font-family: var(--hb-font-family-arabic); }
.hb-sheet__grabber { display: grid; place-items: center; padding-block: var(--hb-space-8); flex: 0 0 auto; cursor: grab; }
.hb-sheet__grabber i { display: block; width: var(--hb-component-sheet-grabber-width); height: var(--hb-component-sheet-grabber-height); border-radius: var(--hb-radius-full); background: var(--hb-color-surface-container-high); }
.hb-sheet__body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: var(--hb-component-sheet-body-padding-compact); display: flex; flex-direction: column; gap: var(--hb-space-16); font-size: var(--hb-font-size-14); color: var(--hb-color-on-surface); }
.hb-sheet__indicator { height: 21px; display: grid; place-items: center; flex: 0 0 auto; }
.hb-sheet__indicator i { display: block; width: 139px; height: 5px; border-radius: var(--hb-radius-full); background: var(--hb-color-neutral-950); }

/* ==== EmptyState.css ==== */
/* Highbase · Empty State (organism) — Structure type 4 (slots: illustration, title, text, actions).
   (file) four 512 x 512 illustrations only: Page Error, Page not found, Cart empty, Empty — unused by the product.
   The artwork now comes from 06_Illustrations; layout, type and actions remain proposals. */
.hb-empty { box-sizing: border-box; display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--hb-component-empty-state-gap); padding: var(--hb-space-40) var(--hb-space-24); font-family: var(--hb-font-family-latin); }
[lang="ar"] .hb-empty, [dir="rtl"] .hb-empty { font-family: var(--hb-font-family-arabic); }
.hb-empty__art { width: var(--hb-component-empty-state-illustration); max-width: 100%; aspect-ratio: 1; display: grid; place-items: center; color: var(--hb-color-neutral-300); }
.hb-empty__art svg { width: 100%; height: 100%; }
/* an illustration from 06_Illustrations fills the slot; the slot owns the size */
.hb-empty__art .hb-il { width: 100%; height: 100%; }
.hb-empty__title { font-size: var(--hb-font-size-20); line-height: var(--hb-font-line-height-latin-20); font-weight: var(--hb-font-weight-bold); color: var(--hb-color-on-surface); }
.hb-empty__text { max-width: var(--hb-component-empty-state-max-width); font-size: var(--hb-font-size-14); line-height: var(--hb-font-line-height-latin-14); color: var(--hb-color-on-surface-variant); }
[dir="rtl"] .hb-empty__title, [lang="ar"] .hb-empty__title { line-height: var(--hb-font-line-height-arabic-20); }
[dir="rtl"] .hb-empty__text, [lang="ar"] .hb-empty__text { line-height: var(--hb-font-line-height-arabic-14); }
.hb-empty__actions { display: flex; gap: var(--hb-space-8); flex-wrap: wrap; justify-content: center; margin-top: var(--hb-space-8); }
.hb-empty[data-size="compact"] { padding: var(--hb-space-24) var(--hb-space-16); }
.hb-empty[data-size="compact"] .hb-empty__art { width: 160px; }
/* inline variant for empty tables and lists */
.hb-empty[data-variant="inline"] { padding: var(--hb-space-32) var(--hb-space-16); }
.hb-empty[data-variant="inline"] .hb-empty__art { width: 120px; }
.hb-empty[data-variant="inline"] .hb-empty__title { font-size: var(--hb-font-size-16); }
/* (live) records variant — a bordered card with a small amber line. No illustration, no action. */
/* F6 note (13 Sep): the records variant keeps color/secondary for its icon and line. It is a deliberate amber
   status accent measured from the live dashboard - a single line inside a bordered amber box, not running copy -
   which F6 explicitly allows. Listed in FIGMA_FIXES_REPORT.md for a decision rather than changed silently. */
.hb-empty[data-variant="records"] { border: 1px solid var(--hb-color-surface-dim); border-radius: var(--hb-component-empty-records-radius); background: var(--hb-color-surface); min-height: var(--hb-component-empty-records-min-height); justify-content: center; flex-direction: row; gap: var(--hb-space-8); padding: var(--hb-space-32) var(--hb-space-16); }
.hb-empty[data-variant="records"] .hb-empty__art { width: var(--hb-component-empty-records-icon-size); aspect-ratio: 1; color: var(--hb-color-secondary); }
.hb-empty[data-variant="records"] .hb-empty__title { font-size: var(--hb-font-size-14); font-weight: var(--hb-font-weight-medium); color: var(--hb-color-secondary-hover); }
.hb-empty[data-variant="records"] .hb-empty__text, .hb-empty[data-variant="records"] .hb-empty__actions { display: none; }

.hb-i{width:1em;height:1em;display:inline-block;fill:currentColor;flex:0 0 auto}[dir="rtl"] [data-mirror]>.hb-i,[dir="rtl"] .hb-i[data-mirror]{transform:scaleX(-1)}
/* Highbase — subcategory pages prototype (side-panel revision).
   Every colour, space, radius and type value is a --hb-* token. Bare px appear only where the
   brief fixes a number the system has no token for (tile 112/92, gap 18, radius 14) or for page
   geometry (panel 250, frame 390×844); each is marked BRIEF or LAYOUT. Mobile is class-driven:
   .app.m is set by the Preview switch or by a viewport under 760px, so the phone frame and a real
   narrow window render the same rules. */

*,*::before,*::after{box-sizing:border-box}
html,body{height:auto}
body{margin:0;background:var(--hb-color-surface-container-low);color:var(--hb-color-on-surface);font-family:var(--hb-font-family-latin);font-size:var(--hb-font-size-14);line-height:var(--hb-font-line-height-latin-14)}
[dir="rtl"] body,[lang="ar"] body,[lang="ar"] .hb-pcard,[lang="ar"] .hb-card,[lang="ar"] .hb-sheet,[lang="ar"] .hb-empty,[lang="ar"] .hb-header{font-family:var(--hb-font-family-arabic);line-height:var(--hb-font-line-height-arabic-14)}
h1,h2,h3,p,ul,ol{margin:0}ul,ol{padding:0;list-style:none}button{font:inherit}a{color:inherit}
:focus-visible{outline:2px solid var(--hb-color-primary);outline-offset:2px}
.page__title:focus{outline:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* ---------- prototype chrome (not part of the proposal) ---------- */
.px-bar{position:sticky;top:0;z-index:80;display:flex;flex-wrap:wrap;gap:var(--hb-space-8) var(--hb-space-20);align-items:center;padding:var(--hb-space-8) var(--hb-space-16);background:var(--hb-color-surface-dark);color:var(--hb-color-on-surface-dark);font-family:var(--hb-font-family-latin);direction:ltr}
.px-title{font-weight:var(--hb-font-weight-bold);letter-spacing:.08em;text-transform:uppercase;font-size:var(--hb-font-size-12);color:var(--hb-color-accent-yellow)}
.px-bar b{font-size:var(--hb-font-size-12);letter-spacing:.06em;text-transform:uppercase;opacity:.7;margin-inline-end:var(--hb-space-4)}
.px-seg{display:flex;gap:var(--hb-space-4);align-items:center;flex-wrap:wrap}
.px-seg button,.px-link{border:1px solid color-mix(in srgb,var(--hb-color-on-surface-dark) 30%,transparent);background:transparent;color:var(--hb-color-on-surface-dark);border-radius:var(--hb-radius-full);padding:var(--hb-space-4) var(--hb-space-12);font-size:var(--hb-font-size-12);cursor:pointer;text-decoration:none;font-family:var(--hb-font-family-latin)}
.px-seg button[aria-pressed="true"]{background:var(--hb-color-on-surface-dark);color:var(--hb-color-surface-dark);font-weight:var(--hb-font-weight-semibold)}
.px-log{position:fixed;inset-inline-end:var(--hb-space-16);inset-block-end:var(--hb-space-16);z-index:90;width:min(360px,calc(100vw - 32px));max-height:40vh;overflow:auto;background:var(--hb-color-surface-dark);color:var(--hb-color-on-surface-dark);border-radius:var(--hb-radius-12);box-shadow:var(--hb-shadow-xl);font:var(--hb-font-size-12)/1.5 ui-monospace,Menlo,Consolas,monospace;direction:ltr;text-align:left}
.px-log summary{cursor:pointer;padding:var(--hb-space-8) var(--hb-space-12);font-family:var(--hb-font-family-latin);font-weight:var(--hb-font-weight-semibold)}
.px-log ol{padding:0 var(--hb-space-12) var(--hb-space-12);display:flex;flex-direction:column;gap:var(--hb-space-6)}
.px-log li{white-space:pre-wrap;word-break:break-word;border-top:1px solid color-mix(in srgb,var(--hb-color-on-surface-dark) 15%,transparent);padding-top:var(--hb-space-6)}
.px-log li b{color:var(--hb-color-accent-yellow)}

/* frame: desktop = full width; phone = 390×844 device shell (LAYOUT) */
.frame{background:var(--hb-color-surface);min-height:calc(100vh - 44px)}
.frame--phone{width:calc(390px + 16px);height:calc(844px + 16px);margin:var(--hb-space-24) auto var(--hb-space-48);border-radius:var(--hb-radius-32);border:8px solid var(--hb-color-surface-dark);box-shadow:var(--hb-shadow-2xl);overflow:hidden;display:flex;flex-direction:column;min-height:0}
.addr{display:flex;align-items:center;gap:var(--hb-space-12);padding:var(--hb-space-8) var(--hb-space-16);background:var(--hb-color-surface-container);color:var(--hb-color-on-surface-muted);font:var(--hb-font-size-12)/1.4 ui-monospace,Menlo,Consolas,monospace;direction:ltr;flex:0 0 auto}
.addr__dots{display:flex;gap:var(--hb-space-6)}.addr__dots i{width:10px;height:10px;border-radius:var(--hb-radius-full);background:var(--hb-color-outline)}
.addr__url{flex:1;background:var(--hb-color-surface);border-radius:var(--hb-radius-full);padding:var(--hb-space-4) var(--hb-space-12);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frame--phone .addr__dots{display:none}
.app{position:relative;display:flex;flex-direction:column;min-height:0}
.frame--phone .app{flex:1 1 auto;overflow:hidden}
.scroller{display:flex;flex-direction:column;min-height:0}
.frame--phone .scroller{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}

/* ---------- header + mega menu (Header organism) ---------- */
.hb-header{position:relative;z-index:40}
.hb-header__pill[aria-expanded="true"]{background:var(--hb-color-primary-container-low);color:var(--hb-color-primary-hover)}
.mega{position:absolute;inset-inline:0;top:100%;z-index:50;display:grid;grid-template-columns:268px 268px minmax(0,1fr);background:var(--hb-color-surface);border-block-end:1px solid var(--hb-color-outline-variant);box-shadow:var(--hb-shadow-xl);max-height:min(70vh,560px)}
.mega[hidden]{display:none}
.mega__col{overflow:auto;padding:var(--hb-space-12);display:flex;flex-direction:column;gap:var(--hb-space-2)}
.mega__col+.mega__col{border-inline-start:1px solid var(--hb-color-outline-variant)}
.mega__item{display:flex;align-items:center;gap:var(--hb-space-8);min-height:44px;padding:var(--hb-space-8) var(--hb-space-12);border-radius:var(--hb-radius-8);text-decoration:none;color:var(--hb-color-on-surface);font-weight:var(--hb-font-weight-medium)}
.mega__item:hover,.mega__item[data-open="true"]{background:var(--hb-color-surface-container-low)}
.mega__item[aria-current="page"]{color:var(--hb-color-primary-hover);background:var(--hb-color-primary-container-low)}
.mega__item>[data-mirror]{margin-inline-start:auto;color:var(--hb-color-on-surface-muted);display:inline-flex}
.mega__thumb{width:28px;height:28px;flex:0 0 auto;border-radius:var(--hb-radius-6);background:var(--hb-color-surface-container);display:grid;place-items:center;overflow:hidden}
.mega__thumb svg{width:100%;height:100%}
.mega__all{font-size:var(--hb-font-size-12);color:var(--hb-color-link);padding:var(--hb-space-8) var(--hb-space-12)}
.mega__back{display:none;align-items:center;gap:var(--hb-space-8);border:0;background:none;padding:var(--hb-space-8) var(--hb-space-12);color:var(--hb-color-link);cursor:pointer;text-align:start}
.scrim{position:absolute;inset:0;z-index:30;background:var(--hb-color-scrim)}
.scrim[hidden]{display:none}

/* ---------- body: side filter panel + main ---------- */
.body{width:100%;display:grid;grid-template-columns:250px minmax(0,1fr);gap:var(--hb-space-24);align-items:start;max-width:1400px;margin-inline:auto;padding:var(--hb-space-24) clamp(16px,3vw,40px) var(--hb-space-104)} /* LAYOUT: 250 panel per the proposal */
.page{min-width:0;display:flex;flex-direction:column;gap:var(--hb-space-20)}
.page__head{display:flex;flex-direction:column;gap:var(--hb-space-8)}
.page__title{display:flex;align-items:baseline;gap:var(--hb-space-12);flex-wrap:wrap;font-size:var(--hb-font-size-24);line-height:var(--hb-font-line-height-latin-24);font-weight:var(--hb-font-weight-bold);color:var(--hb-color-primary-hover)} /* (live) 24 Bold primary/700 */
[lang="ar"] .page__title{line-height:var(--hb-font-line-height-arabic-24)}
.page__count{font-size:var(--hb-font-size-14);line-height:var(--hb-font-line-height-latin-14);font-weight:var(--hb-font-weight-medium);color:var(--hb-color-on-surface-muted);font-variant-numeric:tabular-nums}
.back{display:none;align-items:center;gap:var(--hb-space-4);align-self:flex-start;color:var(--hb-component-breadcrumb-link);text-decoration:none;font-weight:var(--hb-font-weight-medium);padding:var(--hb-space-4) 0}
.back .hb-i{width:20px;height:20px}

/* filter panel (Card organism) */
.fpanel{position:sticky;top:var(--hb-space-16);gap:0;padding:var(--hb-space-8) var(--hb-space-16);max-height:calc(100vh - 32px);overflow:auto}
.fpanel__head{display:flex;align-items:center;justify-content:space-between;padding-block:var(--hb-space-8)}
.fpanel__head .hb-card__title{font-size:var(--hb-font-size-16)}
.fgroup{border-top:1px solid var(--hb-color-outline-variant)}
.fgroup--flat{padding-block:var(--hb-space-12)}
.fgroup summary{display:flex;align-items:center;justify-content:space-between;list-style:none;cursor:pointer;min-height:44px;font-weight:var(--hb-font-weight-semibold);color:var(--hb-color-on-surface-heading)}
.fgroup summary::-webkit-details-marker{display:none}
.fgroup summary [data-mirror]{display:inline-flex;transition:transform .15s;color:var(--hb-color-on-surface-muted)}
.fgroup[open] summary [data-mirror]{transform:rotate(180deg)}
.fgroup__body{display:flex;flex-direction:column;gap:var(--hb-space-4);padding-block:0 var(--hb-space-12)}
.fopt{min-height:36px;justify-content:flex-start}
.fopt .hb-check__label{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fopt__n{font-size:var(--hb-font-size-12);color:var(--hb-color-on-surface-muted);font-variant-numeric:tabular-nums}
.fopt--dim .hb-check__label{color:var(--hb-color-on-surface-muted)}
.ftgl{min-height:44px;gap:var(--hb-space-12)}
.ftgl .hb-switch__label{display:flex;flex-direction:column;gap:var(--hb-space-2)}

.mcard__media .pcard-art svg{width:56%;height:56%}
.mcard__save{position:absolute;inset-inline-start:var(--hb-space-8);top:var(--hb-space-8);z-index:1}
.hb-chip[data-tone="save"]{background:var(--hb-color-success-container);color:var(--hb-color-on-success-container);font-weight:var(--hb-font-weight-semibold)}
.hb-chip[data-tone="again"]{background:var(--hb-color-warning-light);color:var(--hb-color-warning-dark)}
.hb-chip[data-tone="best"]{background:var(--hb-color-accent-yellow-container);color:var(--hb-color-on-accent-yellow)}
.mcard__add{position:absolute;inset-inline-end:var(--hb-space-8);bottom:var(--hb-space-8);z-index:1;border-radius:var(--hb-radius-full);box-shadow:var(--hb-shadow-md)}
.mcard__add[data-style="outlined"]{background:var(--hb-color-surface)}
.mcard__step{position:absolute;inset-inline:var(--hb-space-8);bottom:var(--hb-space-8);z-index:1;width:auto;background:var(--hb-color-surface);box-shadow:var(--hb-shadow-md);height:36px}
.mcard__step .hb-atc__value{min-width:0}
.mcard__body{display:flex;flex-direction:column;gap:var(--hb-space-4);align-items:flex-start}
.mcard__tag{align-self:flex-start}
.mcard__name{font-size:var(--hb-font-size-14);line-height:var(--hb-font-line-height-latin-14);font-weight:var(--hb-font-weight-semibold);color:var(--hb-color-on-surface-heading);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;unicode-bidi:plaintext}
[lang="ar"] .mcard__name{line-height:var(--hb-font-line-height-arabic-14)}
.mcard__pack,.mcard__min{font-size:var(--hb-font-size-12);line-height:var(--hb-font-line-height-latin-12);color:var(--hb-color-on-surface-muted);unicode-bidi:plaintext}
.mcard__price{font-size:var(--hb-font-size-14);color:var(--hb-color-on-surface);font-variant-numeric:tabular-nums;unicode-bidi:plaintext}
.mcard__price b{font-size:var(--hb-font-size-16);font-weight:var(--hb-font-weight-bold)}
.mcard__price s{color:var(--hb-color-on-surface-muted);margin-inline-start:var(--hb-space-4)}
.ver-m .cartbar{bottom:56px}
.ver-m .mega{position:fixed;inset:0;top:0;max-height:none;border-radius:0;z-index:70;grid-template-columns:1fr}
.frame--phone .ver-m .mega{position:absolute}
.ver-m .scrim{z-index:65}

.mcard__add{width:40px;height:40px;min-width:0;padding:0}
.ver-m .mega{display:flex;flex-direction:column}
.ver-m .mega__head{flex:0 0 auto;grid-column:1/-1}
.ver-m .mega__col[data-active]{flex:1 1 auto;overflow:auto}
