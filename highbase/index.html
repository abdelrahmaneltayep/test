<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HIGHBASE — Auth Pattern Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ============================================================================
   styles/tokens.css — §3 Design tokens (sampled from production)
   ========================================================================= */
:root{
  /* brand */
  --hb-blue:      #0B5CA3;
  --hb-blue-ink:  #08497F;
  --hb-navy:      #0E2E4F;
  --hb-tint:      #F0F9FF;
  --hb-amber:     #F2B705;
  --hb-amber-bg:  #FFF9E6;
  --hb-red:       #C8102E;
  /* neutrals — cool-biased toward the brand blue */
  --hb-paper:     #FFFFFF;
  --hb-mist:      #F6F8FB;
  --hb-line:      #E3E9F0;
  --hb-ink:       #16222E;
  --hb-ink-soft:  #67788A;
  /* auth level semantics */
  --level-0:      #8496A8;
  --level-1:      #0B5CA3;
  --level-2:      #1E9E63;
  /* console rail */
  --con-bg:       #0B1620;
  --con-bg-2:     #101E2A;
  --con-line:     #1E3348;
  --con-ink:      #B9CBDA;
  --con-client:   #7DD3A0;
  --con-server:   #6FB3F0;
  --con-auto:     #F2B705;
  --con-error:    #FF7A7A;
  --radius-pill:  999px;
  --radius-input: 9px;
  --radius-card:  12px;
  --radius-box:   10px;
  --focus:        0 0 0 3px rgba(11,92,163,.13);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  font-size:13.5px; line-height:1.5; color:var(--hb-ink); background:var(--con-bg);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0;font-weight:800;color:var(--hb-navy);text-wrap:balance}
p{margin:0}
button{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--hb-blue);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:none;box-shadow:var(--focus);border-color:var(--hb-blue)}
.rail :focus-visible{box-shadow:0 0 0 3px rgba(111,179,240,.28)}

/* ============================================================================
   App shell — simulated browser (left) + console rail (right)   §10.5
   ========================================================================= */
.app{display:grid;grid-template-columns:minmax(0,1fr) 392px;height:100vh;overflow:hidden}
@media (max-width:1040px){ .app{grid-template-columns:1fr;grid-template-rows:1fr 46vh} }

.browser{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--con-bg-2);padding:12px;gap:10px}
.chrome{
  display:flex;align-items:center;gap:8px;background:#16283A;border:1px solid var(--con-line);
  border-radius:11px;padding:7px 9px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11.5px;flex-wrap:wrap;
}
.navbtn{
  width:26px;height:26px;flex:0 0 26px;border-radius:var(--radius-pill);border:1px solid var(--con-line);
  background:#0E1D2A;color:#9FB6C9;cursor:pointer;display:grid;place-items:center;font-size:12.5px;padding:0;
}
.navbtn:hover:not(:disabled){background:#1B3247;color:#fff}
.navbtn:disabled{opacity:.32;cursor:not-allowed}
.urlbar{
  flex:1 1 320px;min-width:180px;background:#0B1620;border:1px solid var(--con-line);border-radius:var(--radius-pill);
  padding:5px 12px;color:#8FA6BA;overflow-x:auto;white-space:nowrap;font-size:11.5px;
}
.urlbar .u-path{color:#E6EEF6}
.urlbar .u-key{color:var(--con-auto)}
.urlbar .u-val{color:var(--con-client)}
.urlbar .u-sep{color:#5A7A96}
.chip{
  border:1px solid var(--con-line);background:#0E1D2A;color:#9FB6C9;border-radius:var(--radius-pill);
  padding:4px 10px;cursor:pointer;font-family:inherit;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;font-weight:700;
}
.chip[aria-pressed="true"],.chip.on{background:var(--hb-blue);border-color:var(--hb-blue);color:#fff}
.chip:hover{color:#fff}

.stagewrap{flex:1;min-height:0;min-width:0;display:flex;justify-content:center;overflow:hidden}
.stage{
  position:relative;flex:1;min-width:0;background:var(--hb-paper);border-radius:var(--radius-card);
  overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.35);
}
/* the page scrolls, the stage does not — so the overlay stays centred and the
   inert background cannot be scrolled behind it */
#pagearea{height:100%;overflow-y:auto;overflow-x:hidden}
.stage.mobile{flex:0 0 390px;max-width:390px}
.stage[data-hard="1"]{animation:hardpaint .45s ease}
@keyframes hardpaint{from{opacity:.25}to{opacity:1}}

/* ============================================================================
   storefront/ — PromoBar, Header, Footer, pages
   ========================================================================= */
.hb-logo{display:inline-flex;flex-direction:column;line-height:1;text-decoration:none}
.hb-logo b{font-size:19px;font-weight:700;letter-spacing:.13em;color:var(--hb-blue)}
.hb-logo span{font-size:5.5px;letter-spacing:.42em;color:var(--hb-ink-soft);margin-top:4px;font-weight:600}
.hb-logo.lg b{font-size:23px}
a.hb-logo:hover{text-decoration:none}

.promobar{background:var(--hb-navy);color:#DCE8F3;font-size:11.5px;padding:7px 18px;display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap}
.promobar b{color:var(--hb-amber)}

.header{
  position:sticky;top:0;z-index:5;background:var(--hb-paper);border-bottom:1px solid var(--hb-line);
  padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
}
.header .search{
  flex:1 1 200px;min-width:120px;background:var(--hb-mist);border:1px solid var(--hb-line);border-radius:var(--radius-pill);
  padding:8px 14px;font-size:12.5px;color:var(--hb-ink-soft);
}
.header nav{display:flex;align-items:center;gap:8px;margin-inline-start:auto}
.hlink{background:none;border:none;padding:7px 10px;font-size:12.5px;font-weight:600;color:var(--hb-ink);cursor:pointer;border-radius:var(--radius-pill)}
.hlink:hover{background:var(--hb-mist)}
.cartbtn{position:relative}
.cartbtn .count{
  position:absolute;top:0;inset-inline-end:0;background:var(--hb-red);color:#fff;font-size:9.5px;font-weight:700;
  min-width:15px;height:15px;border-radius:var(--radius-pill);display:grid;place-items:center;padding:0 3px;
}
.levelpill{
  display:inline-flex;align-items:center;gap:5px;border-radius:var(--radius-pill);padding:4px 10px;
  font-size:10.5px;font-weight:700;letter-spacing:.04em;color:#fff;background:var(--level-0);
}
.levelpill[data-l="L1"]{background:var(--level-1)}
.levelpill[data-l="L2"]{background:var(--level-2)}

.page{padding:18px}
.crumbs{font-size:11.5px;color:var(--hb-ink-soft);margin-bottom:12px}
.hero{
  background:linear-gradient(135deg,var(--hb-tint),#fff);border:1px solid var(--hb-line);border-radius:14px;
  padding:22px;margin-bottom:18px;
}
.hero h1{font-size:23px;margin-bottom:6px}
.hero p{font-size:13.5px;color:var(--hb-ink-soft);max-width:52ch}
.sechead{display:flex;align-items:baseline;gap:10px;margin:18px 0 10px}
.sechead h2{font-size:17px}
.sechead span{font-size:11.5px;color:var(--hb-ink-soft)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:12px}
.card{border:1px solid var(--hb-line);border-radius:var(--radius-card);overflow:hidden;background:var(--hb-paper);display:flex;flex-direction:column}
.card .thumb{background:var(--hb-mist);height:104px;display:grid;place-items:center;font-size:40px;cursor:pointer;border:none;width:100%}
.card .body{padding:11px;display:flex;flex-direction:column;gap:6px;flex:1}
.card .sup{font-size:10.5px;color:var(--hb-ink-soft);font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.card .nm{font-size:12.5px;font-weight:700;color:var(--hb-navy);text-align:start;background:none;border:none;padding:0;cursor:pointer;line-height:1.35}
.card .nm:hover{color:var(--hb-blue)}
.card .meta{font-size:11.5px;color:var(--hb-ink-soft)}
.card .foot{margin-top:auto;display:flex;flex-direction:column;gap:7px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;border-radius:var(--radius-pill);padding:3px 8px}
.badge.coupon{background:var(--hb-amber-bg);color:#7A5B00;border:1px solid #F0DFA6}
.badge.eta{background:var(--hb-mist);color:var(--hb-ink-soft)}

/* PriceDisplay — the gate */
.price{font-size:19px;font-weight:800;color:var(--hb-navy);letter-spacing:-.01em}
.price small{font-size:11.5px;font-weight:700;color:var(--hb-ink-soft);margin-inline-start:4px}
.price.reveal{animation:reveal .45s cubic-bezier(.2,.8,.2,1)}
@keyframes reveal{from{opacity:0;transform:translateY(6px) scale(.97)}to{opacity:1;transform:none}}
.gate{
  width:100%;display:flex;align-items:center;justify-content:center;gap:7px;background:var(--hb-tint);
  border:1px dashed #BBD9F0;color:var(--hb-blue);font-weight:700;font-size:12.5px;border-radius:var(--radius-pill);
  padding:9px 12px;cursor:pointer;text-align:center;line-height:1.25;
}
.gate:hover{background:#E4F2FE;border-color:var(--hb-blue)}
.gate.sm{font-size:11.5px;padding:8px 10px}

.btn{
  border:1px solid transparent;border-radius:var(--radius-pill);padding:10px 18px;font-weight:700;font-size:13.5px;
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:background .15s,border-color .15s;
}
.btn.primary{background:var(--hb-blue);color:#fff}
.btn.primary:hover{background:var(--hb-blue-ink)}
.btn.ghost{background:var(--hb-paper);border-color:var(--hb-line);color:var(--hb-ink)}
.btn.ghost:hover{border-color:var(--hb-blue);color:var(--hb-blue)}
.btn.block{width:100%}
.btn.sm{padding:7px 13px;font-size:12.5px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn .spin{width:13px;height:13px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .7s linear infinite}
.btn.ghost .spin{border-color:rgba(11,92,163,.25);border-top-color:var(--hb-blue)}
@keyframes spin{to{transform:rotate(360deg)}}

.pdp{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px}
.stage.mobile .pdp{grid-template-columns:1fr}
.pdp .shot{background:var(--hb-mist);border:1px solid var(--hb-line);border-radius:14px;height:230px;display:grid;place-items:center;font-size:86px}
.pdp h1{font-size:23px;margin:10px 0 4px}
.pdp .sup{font-size:12.5px;color:var(--hb-ink-soft);font-weight:600}
.speclist{list-style:none;padding:0;margin:14px 0;display:grid;gap:8px}
.speclist li{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;border-bottom:1px dashed var(--hb-line);padding-bottom:7px}
.speclist li span:first-child{color:var(--hb-ink-soft)}
.speclist li span:last-child{font-weight:700}
.buybox{border:1px solid var(--hb-line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:11px;align-self:start;position:sticky;top:70px}
.infobox{background:var(--hb-tint);border:1px solid #D6EAFA;border-radius:var(--radius-box);padding:12px;font-size:12.5px;color:var(--hb-navy)}
.infobox.warn{background:var(--hb-amber-bg);border-color:#F0DFA6;color:#7A5B00}
.infobox.err{background:#FDECEF;border-color:#F3C7CF;color:var(--hb-red)}

.footer{background:var(--hb-navy);color:#B9CEE2;padding:22px 18px;margin-top:26px;display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.footer h4{color:#fff;font-size:12.5px;margin-bottom:8px;letter-spacing:.04em;text-transform:uppercase}
.footer .fl{display:block;background:none;border:none;padding:3px 0;color:#B9CEE2;font-size:12.5px;cursor:pointer;text-align:start}
.footer .fl:hover{color:#fff;text-decoration:underline}
.footer .hb-logo b{color:#fff}
.footer .hb-logo span{color:#7E9CB8}

.cartrow{display:flex;align-items:center;gap:12px;border:1px solid var(--hb-line);border-radius:var(--radius-box);padding:10px;margin-bottom:8px}
.cartrow .e{font-size:28px;width:44px;height:44px;background:var(--hb-mist);border-radius:9px;display:grid;place-items:center}
.cartrow .g{flex:1;min-width:0}
.cartrow .n{font-size:12.5px;font-weight:700;color:var(--hb-navy)}
.cartrow .m{font-size:11.5px;color:var(--hb-ink-soft)}
.empty{border:1px dashed var(--hb-line);border-radius:var(--radius-box);padding:26px;text-align:center;color:var(--hb-ink-soft);font-size:12.5px}

/* toasts */
.toasts{position:absolute;inset-inline:0;bottom:14px;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:60}
.toast{
  background:var(--hb-navy);color:#fff;border-radius:var(--radius-pill);padding:9px 16px;font-size:12.5px;font-weight:600;
  box-shadow:0 8px 24px rgba(14,46,79,.32);animation:toastin .3s cubic-bezier(.2,.8,.2,1);max-width:86%;
}
.toast.warn{background:#7A5B00}
.toast.err{background:var(--hb-red)}
@keyframes toastin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ============================================================================
   auth/ — AuthSurface: overlay | sheet | page      §5.3, §8
   ========================================================================= */
dialog.authdlg{
  position:absolute;inset:0;width:100%;height:100%;max-width:none;max-height:none;margin:0;padding:0;
  border:none;background:transparent;overflow:visible;z-index:50;
}
dialog.authdlg[data-native="1"]{position:fixed}
dialog.authdlg::backdrop{background:rgba(14,46,79,.42)}
dialog.authdlg:not([data-native="1"])::backdrop{background:transparent}
.scrim{position:absolute;inset:0;background:rgba(14,46,79,.42);border:none;padding:0;width:100%;cursor:pointer;animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}

.authpanel{
  position:absolute;background:var(--hb-paper);border-radius:14px;box-shadow:0 24px 64px rgba(14,46,79,.3);
  width:min(408px,calc(100% - 32px));left:50%;top:50%;transform:translate(-50%,-50%);
  max-height:calc(100% - 32px);overflow-y:auto;animation:pop .22s cubic-bezier(.2,.8,.2,1);
}
[dir="rtl"] .authpanel{left:auto;right:50%;transform:translate(50%,-50%)}
@keyframes pop{from{opacity:0;transform:translate(-50%,-46%) scale(.97)}}
.authdlg[data-pres="sheet"] .authpanel{
  width:100%;left:0;right:auto;top:auto;bottom:0;transform:none;border-radius:18px 18px 0 0;
  height:92%;max-height:92%;animation:slideup .26s cubic-bezier(.2,.8,.2,1);
}
[dir="rtl"] .authdlg[data-pres="sheet"] .authpanel{right:0}
@keyframes slideup{from{transform:translateY(14%)}}
.sheetgrip{width:38px;height:4px;border-radius:var(--radius-pill);background:var(--hb-line);margin:9px auto 0}

.authpage{min-height:100%;display:flex;flex-direction:column;align-items:center;background:var(--hb-mist);padding:20px 16px 40px}
.authpage .authcard{background:var(--hb-paper);border:1px solid var(--hb-line);border-radius:14px;width:min(430px,100%);margin-top:8px}
.authpage .authcard .authhead{padding-top:10px}
dialog.authdlg[data-native="1"] .scrim{background:transparent}
.backlink{
  align-self:flex-start;background:none;border:none;color:var(--hb-blue);font-weight:700;font-size:12.5px;
  cursor:pointer;padding:8px 4px;display:inline-flex;gap:6px;align-items:center;
}
.authhead{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 0;min-height:34px}
.iconbtn{
  width:30px;height:30px;border-radius:var(--radius-pill);border:1px solid var(--hb-line);background:var(--hb-paper);
  color:var(--hb-ink-soft);cursor:pointer;display:grid;place-items:center;font-size:14px;padding:0;
}
.iconbtn:hover{border-color:var(--hb-blue);color:var(--hb-blue)}
[dir="rtl"] .iconbtn.back{transform:scaleX(-1)}
.authbody{padding:6px 22px 22px}
.authhero{
  width:82px;height:82px;border-radius:var(--radius-box);background:var(--hb-mist);display:grid;place-items:center;
  font-size:42px;margin:6px auto 12px;border:1px solid var(--hb-line);
}
.authhero.logo{width:auto;height:auto;background:none;border:none;margin-bottom:14px}
#authTitle{font-size:19px;text-align:center;margin-bottom:4px}
.authsub{font-size:12.5px;color:var(--hb-ink-soft);text-align:center;margin-bottom:14px}

.tabs{display:flex;background:var(--hb-mist);border-radius:var(--radius-pill);padding:3px;margin-bottom:16px}
.tabs button{
  flex:1;border:none;background:none;border-radius:var(--radius-pill);padding:8px 6px;font-size:12.5px;font-weight:700;
  color:var(--hb-ink-soft);cursor:pointer;
}
.tabs button[aria-selected="true"]{background:var(--hb-paper);color:var(--hb-blue);box-shadow:0 1px 3px rgba(14,46,79,.12)}

.field{margin-bottom:12px}
.field>label,.lblrow{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--hb-ink);margin-bottom:5px}
.optchip{font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:var(--hb-mist);color:var(--hb-ink-soft);border-radius:var(--radius-pill);padding:2px 7px;border:1px solid var(--hb-line)}
input[type="tel"],input[type="text"],input[type="email"],input[type="password"],select{
  width:100%;border:1px solid var(--hb-line);border-radius:var(--radius-input);padding:11px 12px;font-size:15px;
  font-family:inherit;color:var(--hb-ink);background:var(--hb-paper);
}
input::placeholder{color:var(--hb-ink-soft);opacity:.75}
input:focus,select:focus{outline:none;border-color:var(--hb-blue);box-shadow:var(--focus)}
.phonewrap{display:flex;border:1px solid var(--hb-line);border-radius:var(--radius-input);overflow:hidden;background:var(--hb-paper)}
.phonewrap:focus-within{border-color:var(--hb-blue);box-shadow:var(--focus)}
.phonewrap .cc{
  background:var(--hb-mist);border-inline-end:1px solid var(--hb-line);padding:11px 12px;font-size:13.5px;font-weight:700;
  color:var(--hb-ink);display:flex;align-items:center;gap:6px;white-space:nowrap;
}
.phonewrap input{border:none;border-radius:0;box-shadow:none!important;letter-spacing:.04em}
.phonewrap input:focus{box-shadow:none}
.pwwrap{position:relative}
.pwwrap input{padding-inline-end:64px}
.pwtoggle{
  position:absolute;inset-inline-end:6px;top:50%;transform:translateY(-50%);background:none;border:none;
  color:var(--hb-blue);font-weight:700;font-size:11.5px;cursor:pointer;padding:6px 8px;border-radius:var(--radius-pill);
}
.fielderr{color:var(--hb-red);font-size:11.5px;font-weight:600;margin-top:5px;display:flex;gap:5px;align-items:flex-start}
.checkrow{display:flex;align-items:center;gap:8px;font-size:12.5px;margin:2px 0 12px}
.checkrow input{width:auto}
.linkbtn{background:none;border:none;color:var(--hb-blue);font-weight:700;font-size:12.5px;cursor:pointer;padding:4px 2px;text-decoration:underline}
.linkbtn.muted{color:var(--hb-ink-soft);font-weight:600}
.center{text-align:center}
.mt{margin-top:12px}

.rule{display:flex;align-items:center;gap:10px;color:var(--hb-ink-soft);font-size:10.5px;font-weight:700;letter-spacing:.1em;margin:16px 0}
.rule::before,.rule::after{content:"";height:1px;background:var(--hb-line);flex:1}
.supplierfork{
  width:100%;border:1px solid var(--hb-line);background:var(--hb-paper);border-radius:var(--radius-pill);padding:10px 14px;
  font-weight:700;font-size:12.5px;color:var(--hb-navy);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;
}
.supplierfork:hover{border-color:var(--hb-blue);color:var(--hb-blue)}
[dir="rtl"] .supplierfork .arw{transform:scaleX(-1)}
.valuelist{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:7px}
.valuelist li{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--hb-ink)}
.valuelist .tick{color:var(--level-2);font-weight:800}
.legal{font-size:10.5px;color:var(--hb-ink-soft);text-align:center;margin-top:14px;line-height:1.55}
.crosslink{font-size:12.5px;color:var(--hb-ink-soft);text-align:center;margin-top:12px}

/* OTP */
.otpwrap{display:flex;gap:8px;justify-content:center;margin:6px 0 12px;direction:ltr}
.otpwrap input{
  width:44px;height:52px;text-align:center;font-size:19px;font-weight:800;padding:0;border-radius:var(--radius-input);
}
.otpwrap.shake{animation:shake .38s}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-6px)}40%,60%{transform:translateX(6px)}}
.hintbox{
  border:1px dashed #BBD9F0;background:var(--hb-tint);border-radius:var(--radius-box);padding:9px 12px;font-size:11.5px;

.reassure span{display:block;font-size:11.5px;color:var(--hb-ink-soft);margin-top:4px;direction:rtl;text-align:start}
[dir="rtl"] .reassure span{direction:ltr}
.buyerbox{
  background:var(--hb-tint);border:1px solid #D6EAFA;border-radius:var(--radius-box);padding:14px;text-align:center;margin:14px 0;

.buyerbox .ic{font-size:24px}

.stepdots{display:flex;gap:5px;justify-content:center;margin-bottom:12px}
.stepdots i{width:16px;height:3px;border-radius:var(--radius-pill);background:var(--hb-line)}
.stepdots i.on{background:var(--hb-blue);width:24px}

   ========================================================================= */
.rail{
  background:var(--con-bg);border-inline-start:1px solid var(--con-line);display:flex;flex-direction:column;min-height:0;
  font-family:'JetBrains Mono',ui-monospace,monospace;color:var(--con-ink);font-size:11.5px;
}
.railhead{padding:11px 12px 0;border-bottom:1px solid var(--con-line)}
.railtitle{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}
.railtitle b{color:#fff;font-size:12.5px;letter-spacing:.08em}

.railtabs button{
  background:none;border:none;border-bottom:2px solid transparent;color:#7E9CB8;padding:6px 10px;cursor:pointer;

}

.railbody{flex:1;min-height:0;overflow-y:auto;padding:10px 12px 24px}

.state{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px;margin-bottom:10px}
.state div{display:flex;justify-content:space-between;gap:6px;border-bottom:1px dotted #1C3145;padding-bottom:3px;min-width:0}
.state k{color:#6E8BA5;font-size:10.5px}
.state v{color:#E6EEF6;font-weight:700;font-size:10.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.ev.auto{border-color:var(--con-auto)} .ev.error{border-color:var(--con-error)}
.ev .top{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.ev .nm{font-weight:700;color:#E6EEF6}
.ev.client .nm{color:var(--con-client)} .ev.server .nm{color:var(--con-server)}
.ev.auto .nm{color:var(--con-auto)} .ev.error .nm{color:var(--con-error)}
.ev .src{font-size:9.5px;letter-spacing:.08em;border:1px solid var(--con-line);border-radius:3px;padding:0 4px;color:#7E9CB8}

.ev .props{margin-top:4px;display:grid;gap:1px}

.ev .props k{color:#5F809A;min-width:92px}
.ev .props v{color:#AFC6D8;overflow-wrap:anywhere}

.fstep{margin-bottom:9px}

.fstep .lbl b{color:#E6EEF6;font-weight:700}
.fstep .lbl i{color:#7E9CB8;font-style:normal}

.drop{font-size:9.5px;color:#C98A8A;text-align:end;margin-top:2px}
.brk{margin-top:12px;border-top:1px solid var(--con-line);padding-top:9px}
.brk h5{margin:0 0 6px;color:#fff;font-size:10.5px;letter-spacing:.08em;font-weight:700}
.brkrow{display:flex;justify-content:space-between;gap:8px;font-size:10.5px;padding:2px 0;border-bottom:1px dotted #1C3145}
.brkrow span:last-child{color:#E6EEF6;font-weight:700}

.casegrp{margin-bottom:14px}

function baseProps(){
  const u = URL_NOW;
  return {
    trigger_source: u.trigger || S.lastTrigger || null,
    presentation:   u.authOpen ? resolvePresentation({ trigger:u.trigger, navigationType:NAV_TYPE, viewportWidth:viewportWidth() }) : LAST_PRESENTATION,
    mode:           u.mode || null,
    auth_method:    u.method || 'phone_otp',
    auth_level:     S.level,
    is_new_user:    S.isNewUser,
    locale:         S.locale,
    product_id:     u.product || null,
    intent_type:    pendingIntent ? pendingIntent.type : 'none',
    session_id:     S.sessionId
  };
}
function emit(name, props, source){
  const ev = {
    id: EVENTS.length + 1,
    name: name,
    source: source || 'client',
    ts: new Date(),
    props: Object.assign(baseProps(), props || {})
  };
  EVENTS.unshift(ev);
  const tag = '%c' + ev.source.toUpperCase() + '%c ' + name;
  const col = { client:'#1E9E63', server:'#0B5CA3', auto:'#B8860B', error:'#C8102E' }[ev.source];
  try { console.log(tag, 'background:' + col + ';color:#fff;padding:1px 4px;border-radius:3px', '', ev.props); } catch(e){}
  renderRail();
  return ev;
}
/* GA4 recommended events, emitted alongside our own (§10.2) */
const emitGa4 = (name, method) => emit(name, { method: method }, 'server');

/* ===========================================================================
   router/history.ts — an in-memory history stack driving the simulated chrome.
   push / replace / back / forward / reload, with navigationType tracking.
   ======================================================================== */
const HISTORY = { stack:['/'], index:0 };
const SCROLL = [0];                       // scroll offset per history entry
let NAV_TYPE = 'hard';                    // first paint is always 'hard' (§5.3)
let URL_NOW = null;                       // parsed current URL

function currentUrl(){ return HISTORY.stack[HISTORY.index]; }

function saveScroll(){ const n = $('#pagearea'); if (n) SCROLL[HISTORY.index] = n.scrollTop; }
function restoreScroll(){ const n = $('#pagearea'); if (n) n.scrollTop = SCROLL[HISTORY.index] || 0; }
function navigate(url, kind){
  saveScroll();
  const keep = SCROLL[HISTORY.index] || 0;
  if (kind === 'replace'){ HISTORY.stack[HISTORY.index] = url; }
  else {
    HISTORY.stack = HISTORY.stack.slice(0, HISTORY.index + 1); HISTORY.stack.push(url); HISTORY.index++;
    SCROLL.length = HISTORY.index; SCROLL.push(keep);   // an overlay opens without moving the page behind it
  }
  NAV_TYPE = 'soft';
  try { window.history[kind === 'replace' ? 'replaceState' : 'pushState']({}, '', '#' + url); } catch(e){}
  render();
}
function goBack(){ if (HISTORY.index > 0){ saveScroll(); HISTORY.index--; NAV_TYPE = 'soft'; render(); } }
function goForward(){ if (HISTORY.index < HISTORY.stack.length - 1){ saveScroll(); HISTORY.index++; NAV_TYPE = 'soft'; render(); } }
function reload(){ NAV_TYPE = 'hard'; render(); }

/* ===========================================================================
   router/useUrlState.ts — the URL is the single source of truth (§2, §5.1)
   ======================================================================== */
function parseUrl(url){
  const qi = url.indexOf('?');
  const path = qi === -1 ? url : url.slice(0, qi);
  const q = {};
  if (qi !== -1) url.slice(qi + 1).split('&').forEach(function(pair){
    if (!pair) return;
    const i = pair.indexOf('='); const k = i === -1 ? pair : pair.slice(0, i);
    q[decodeURIComponent(k)] = i === -1 ? '' : decodeURIComponent(pair.slice(i + 1));
  });
  const isRoute = (path === '/login' || path === '/register');
  const authParam = q.auth === 'signin' || q.auth === 'signup' ? q.auth : null;
  const mode = isRoute ? (path === '/login' ? 'signin' : 'signup') : authParam;
  const authOpen = !!mode;
  let step = q.step;
  if (['identify','otp','business','cr'].indexOf(step) === -1) step = 'identify';
  return {
    raw: url, path: path, query: q, isRoute: isRoute, authOpen: authOpen, mode: mode, step: step,
    trigger: TRIGGERS.indexOf(q.trigger) !== -1 ? q.trigger : (q.trigger ? 'deep_link' : null),
    product: q.product || null,
    method: q.method === 'email_password' ? 'email_password' : 'phone_otp',
    returnTo: safeReturnTo(q.return_to)
  };
}
function buildUrl(path, params){
  const parts = [];
  Object.keys(params).forEach(function(k){
    const v = params[k];
    if (v === null || v === undefined || v === '') return;
    parts.push(encodeURIComponent(k) + '=' + encodeURIComponent(v));
  });
  return parts.length ? path + '?' + parts.join('&') : path;
}
/* §7.3 rule 1 — validate return_to against an allowlist of same-origin paths */
const ALLOWED_PATHS = ['/','/checkout','/orders','/cart','/suppliers/apply'];
function safeReturnTo(v){
  if (!v) return null;
  if (v.charAt(0) !== '/' || v.charAt(1) === '/') return null;      // no scheme, no protocol-relative
  const path = v.split('?')[0];
  if (ALLOWED_PATHS.indexOf(path) !== -1) return v;
  if (/^\/product\/[a-z0-9_]+$/.test(path)) return v;
  return null;
}
/* strip every auth param — this is the "close" for the query-param form */
function urlWithoutAuth(url){
  const u = parseUrl(url);
  if (u.isRoute) return u.returnTo || '/';
  const q = {};
  Object.keys(u.query).forEach(function(k){
    if (['auth','trigger','step','product','method','return_to'].indexOf(k) === -1) q[k] = u.query[k];
  });
  return buildUrl(u.path, q);
}

/* §5.3 presentation resolution */
function resolvePresentation(a){
  if (a.trigger === 'checkout')   return 'page';
  if (a.navigationType === 'hard') return 'page';
  if (a.viewportWidth < 768)       return 'sheet';
  return 'overlay';
}

/* ===========================================================================
   auth/requireAuth.ts — THE only way to open the auth surface (§7.2)
   No component outside auth/ may render AuthSurface directly; see
   assertNoDirectSurfaceRender() at the bottom of this file.
   ======================================================================== */
/* Focus must return to the element that opened the surface. The storefront is
   re-rendered while the surface is open, so keeping the node is not enough —
   we keep a selector that identifies it after the re-render too. */
let invoker = null, invokerSel = null;
function invokerKeyOf(el){
  if (!el || !el.getAttribute) return null;
  if (el.id) return '#' + el.id;
  const act = el.getAttribute('data-act');
  if (!act) return null;
  let sel = '[data-act="' + act + '"]';
  ['id','trigger','to','placement','code','level','step'].forEach(function(k){
    const v = el.getAttribute('data-' + k);
    if (v !== null) sel += '[data-' + k + '="' + v + '"]';
  });
  return sel;
}

function requireAuth(args){
  const level   = args.level || 'L1';
  const trigger = args.trigger;
  if (TRIGGERS.indexOf(trigger) === -1) throw new Error('Unknown trigger: ' + trigger + ' — add it to TriggerSource, never build a new surface.');
  const mode    = args.mode || (S.level === 'L0' ? 'signup' : 'signin');
  const step    = args.step || 'identify';
  invoker       = args.invoker || document.activeElement;
  invokerSel    = invokerKeyOf(invoker);

  if (args.intent && args.intent.type !== 'none'){
    pendingIntent = Object.assign({}, args.intent, { __id: ++intentSeq });
  } else { pendingIntent = null; }

  S.lastTrigger = trigger;
  /* requireAuth IS the gate activation — emitting here (rather than at each
     call site) guarantees exactly one gate_click per opening, so funnel step 1
     can never exceed step 2. Headless entry points have no gate to click. */
  if (HEADLESS_TRIGGERS.indexOf(trigger) === -1){
    emit('auth:gate_click', { gate_kind:INTENT_GATE[args.intent ? args.intent.type : 'none'] || 'view_price',
                              product_id:args.intent && args.intent.productId ? args.intent.productId : null,
                              required_level:level });
  }
  resetForm(step);

  const here = currentUrl();
  const hereClean = urlWithoutAuth(here);

  if (args.useRoute || trigger === 'checkout' || trigger === 'email_link' || trigger === 'deep_link'){
    // canonical route form — return_to is explicit and allowlisted
    const path = mode === 'signin' ? '/login' : '/register';
    navigate(buildUrl(path, {
      trigger: trigger, step: step,
      product: args.intent && args.intent.productId ? args.intent.productId : null,
      return_to: safeReturnTo(hereClean)
    }), 'push');
  } else {
    // query-param form on the current route — return_to is implicit
    const u = parseUrl(hereClean);
    const q = Object.assign({}, u.query, {
      auth: mode, trigger: trigger, step: step,
      product: args.intent && args.intent.productId ? args.intent.productId : null
    });
    navigate(buildUrl(u.path, q), 'push');
  }
}

/* every gated element announces itself once per render (§10.2 auth:gate_view) */
let gateSeen = Object.create(null);
function gateView(kind, productId){
  const k = kind + ':' + (productId || '-');
  if (gateSeen[k]) return; gateSeen[k] = 1;
  emit('auth:gate_view', { gate_kind:kind, product_id:productId || null, required_level:ACTION_LEVELS[kind] || 'L1' });
}

                      apply_coupon:'apply_coupon', goto_checkout:'checkout', goto_orders:'order_history', none:'view_price' };

let dialogEl = null;
function ensureDialog(){
  if (dialogEl && dialogEl.isConnected) return dialogEl;
  dialogEl = document.createElement('dialog');
  dialogEl.id = 'authDialog';
  dialogEl.className = 'authdlg';
  dialogEl.setAttribute('role','dialog');
  dialogEl.setAttribute('aria-modal','true');
  dialogEl.setAttribute('aria-labelledby','authTitle');
  dialogEl.addEventListener('cancel', function(e){ e.preventDefault(); closeSurface('escape'); });
  dialogEl.addEventListener('keydown', trapTab);
  /* in native showModal() mode a click on ::backdrop targets the dialog itself */
  dialogEl.addEventListener('click', function(e){ if (e.target === dialogEl) closeSurface('scrim'); });
  $('#stage').appendChild(dialogEl);
  return dialogEl;
}
function closeDialog(){
  if (!dialogEl) return;
  try { if (dialogEl.open) dialogEl.close(); } catch(e){}
  if (dialogEl.parentNode) dialogEl.parentNode.removeChild(dialogEl);
  dialogEl = null;
  const pa = $('#pagearea'); if (pa) pa.removeAttribute('inert');
}
function trapTab(e){
  if (e.key !== 'Tab' || !dialogEl) return;
  const f = $$('a[href],button:not([disabled]),input:not([disabled]),select,textarea,[tabindex]:not([tabindex="-1"])', dialogEl)
    .filter(function(n){ return n.offsetParent !== null || n === document.activeElement; });
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
}

function setStep(step, kind){
  const u = URL_NOW;
  const q = Object.assign({}, u.query, { step: step });
  if (u.isRoute) navigate(buildUrl(u.path, q), kind || 'push');
  else navigate(buildUrl(u.path, q), kind || 'push');
}
function setParam(k, v, kind){
  const u = URL_NOW;
  let path = u.path;
  const q = Object.assign({}, u.query);
  if (k === 'mode'){
    if (u.isRoute) path = v === 'signin' ? '/login' : '/register';
    else q.auth = v;
  } else { q[k] = v; }
  navigate(buildUrl(path, q), kind || 'replace');
}

async function submitIdentify(){
  const u = URL_NOW;
  UI.error = null; UI.errorField = null;
  if (u.method === 'email_password'){
    if (!validEmail(F.email)) return showError('email', t('errEmail'), 'invalid_email');
    if (!F.password) return showError('password', t('errCreds'), 'invalid_password');
    emit('auth:identifier_submit', { identifier_type:'email' });
    UI.busy = true; paint();
    try {
      const r = await mockApi.signInWithEmail(F.email, F.password);
      S.email = F.email; S.isNewUser = u.mode === 'signup' ? true : r.isNewUser;
      UI.busy = false;
      if (u.mode === 'signup'){
        S.level = 'L1'; mergeCart();
        emit('auth:signup_success', { auth_method:'email_password' }, 'server'); emitGa4('sign_up','email_password');
        setStep('business','push');
      } else {
        S.level = S.level === 'L0' ? 'L1' : S.level; mergeCart();
        emit('auth:login_success', { auth_method:'email_password' }, 'server'); emitGa4('login','email_password');
        completeAuth();
      }
    } catch(err){
      if (err.code === 'network') return showError('password', t('errNet'), 'network');
      return showError('password', t('errCreds'), 'badcreds');
    }
    return;
  }
  if (!validPhone()) return showError('phone', t('errPhone'), 'invalid_phone');
  emit('auth:identifier_submit', { identifier_type:'phone' });
  UI.busy = true; paint();
  try {
    await mockApi.sendOtp(F.phone);
    S.phone = F.phone; UI.busy = false; UI.sends++;
    emit('auth:otp_send', { send_count:UI.sends }, 'server');   // never reveals whether the phone is known
    setStep('otp','push');
    startCooldown();
  } catch(err){ showError('phone', t('errNet'), 'network'); }
}

async function resendOtp(){
  if (UI.cooldown > 0 || UI.sends >= 3) return;
  try {
    await mockApi.sendOtp(F.phone);
    UI.sends++; UI.error = null; UI.errorField = null;
    emit('auth:otp_send', { send_count:UI.sends, resend:true }, 'server');
    startCooldown(); paint();
    announce(S.locale === 'ar' ? 'تم إرسال رمز جديد' : 'A new code has been sent');
  } catch(err){ showError('code', t('errNet'), 'network'); }
}

async function submitOtp(){
  const u = URL_NOW;
  const code = F.code.join('');
  if (code.length < 6) return showError('code', t('errCode'), 'incomplete');
  emit('auth:otp_submit', { code_length:code.length });
  UI.busy = true; UI.error = null; paint();
  let r;
  try { r = await mockApi.verifyOtp(F.phone, code); }
  catch(err){
    UI.busy = false;
    if (err.code === 'network'){ return showError('code', t('errNet'), 'network'); }
    if (err.code === 'expired'){
      F.code = ['','','','','',''];
      emit('auth:otp_fail', { reason:'expired' }, 'server');
      startCooldown();
      return showError('code', t('errExpired'), 'expired');
    }
    UI.otpFails++;
    UI.shake = true; setTimeout(function(){ UI.shake = false; }, 420);
    emit('auth:otp_fail', { reason:'mismatch', attempt:UI.otpFails }, 'server');
    if (UI.otpFails >= 3) UI.emailFallback = true;
    return showError('code', t('errCode'), 'mismatch');    // digits are kept
  }
  UI.busy = false;
  /* §4 — the account exists at L1 HERE, before the business-details screen */
  S.level = 'L1'; S.phone = F.phone; S.isNewUser = r.isNewUser;
  mergeCart();
  if (r.isNewUser){ emit('auth:signup_success', { auth_method:'phone_otp' }, 'server'); emitGa4('sign_up','phone_otp'); }
  else            { emit('auth:login_success',  { auth_method:'phone_otp' }, 'server'); emitGa4('login','phone_otp'); }
  if (u.mode === 'signup' && r.isNewUser) setStep('business','push');
  else completeAuth();
}

/* §7.3 return-to-intent */
function replayIntent(){
  const i = pendingIntent;
  if (!i) return { dest:null };
  const key = 'i' + i.__id;
  if (replayed[key]){ emit('auth:intent_replay', { intent_type:i.type, duplicate:true, applied:false }); return { dest:null }; }
  replayed[key] = true;
  let dest = null;
  try {
    if (i.type === 'add_to_cart')      addToCart(i.productId, i.qty || 1);
    else if (i.type === 'save_product'){ if (S.saved.indexOf(i.productId) === -1) S.saved.push(i.productId); }
    else if (i.type === 'apply_coupon'){ if (S.coupons.indexOf(i.code) === -1) S.coupons.push(i.code); }
    else if (i.type === 'goto_checkout') dest = '/checkout';
    else if (i.type === 'goto_orders')   dest = '/orders';
  } catch(err){
    toast(S.locale === 'ar' ? 'تعذّر إكمال الإجراء. حاول مرة أخرى.' : "We couldn't finish that. Try again.", 'err');
    emit('auth:error', { error_field:'intent', error_code:'replay_failed' }, 'error');
    return { dest:null };
  }
  return { dest:dest, replayed:i };
}
function completeAuth(){
  const u = URL_NOW;
  const r = replayIntent();
  const back = u.isRoute ? (u.returnTo || '/') : urlWithoutAuth(currentUrl());
  const dest = r.dest || back;
  const done = r.replayed;
  if (done) lastIntent = done;
  pendingIntent = null;
  navigate(dest, 'replace');                                     // Back never reopens a completed surface
  if (done) emit('auth:intent_replay', { intent_type:done.type, duplicate:false, applied:true, product_id:done.productId || null });
  restoreFocus();
  toast(t('toastWelcome'));
}
function closeSurface(reason, silent){
  const u = URL_NOW;
  if (!u.authOpen) return;
  if (!silent) emit('auth:dismiss', { reason:reason, step:u.step });
  pendingIntent = null;                                           // §8.5 — intent discarded
  const clean = u.isRoute ? (u.returnTo || '/') : urlWithoutAuth(currentUrl());
  if (HISTORY.index > 0 && HISTORY.stack[HISTORY.index - 1] === clean) goBack();
  else navigate(clean, 'replace');
  restoreFocus();
}
function restoreFocus(){
  const el = invoker, sel = invokerSel;
  invoker = null; invokerSel = null;
  setTimeout(function(){
    let target = el && el.isConnected ? el : null;
    if (!target && sel){ try { target = $('#stage').querySelector(sel); } catch(e){} }
    if (target) try { target.focus(); } catch(e){}
  }, 30);
}

function addToCart(id, qty){
  const line = S.cart.filter(function(c){ return c.productId === id; })[0];
  if (line) line.qty += qty; else S.cart.push({ productId:id, qty:qty });
}
/* §7.4 anonymous cart merge — union by product id, take the higher quantity */
function mergeCart(){
  if (!S.anonCart.length) return;
  const merged = S.cart.slice();
  S.anonCart.forEach(function(a){
    const ex = merged.filter(function(c){ return c.productId === a.productId; })[0];
    if (ex) ex.qty = Math.max(ex.qty, a.qty); else merged.push({ productId:a.productId, qty:a.qty });
  });
  const n = S.anonCart.length;                    // line items, as in "the 3 items in your cart"
  S.cart = merged; S.anonCart = [];
  emit('auth:cart_merge', { merged_items:n });
  toast(t('toastCart').replace('{n}', n));
}
function cartCount(){
  const a = S.level === 'L0' ? S.anonCart : [];
  return S.cart.concat(a).reduce(function(n, c){ return n + c.qty; }, 0);
}
function cartLines(){ return S.level === 'L0' ? S.anonCart : S.cart; }
function cartTotal(){ return cartLines().reduce(function(n, c){ const p = productById(c.productId); return n + (p ? p.priceBhd * c.qty : 0); }, 0); }

function toast(msg, kind){
  const wrap = $('#toasts'); if (!wrap) return;
  const n = document.createElement('div');
  n.className = 'toast' + (kind ? ' ' + kind : '');
  n.setAttribute('dir','auto');        // an EN sentence inside an RTL page keeps its own direction
  n.textContent = msg;
  wrap.appendChild(n);
  announce(msg);
  setTimeout(function(){ if (n.parentNode) n.parentNode.removeChild(n); }, 4200);
}
function announce(msg){ const l = $('#live'); if (l) l.textContent = msg; }

let CUR_PRES = 'none', prevAuthOpen = false, FLOW_PRES = null, surfaceSig = null;

function computePres(){
  const u = URL_NOW;
  if (!u.authOpen){ FLOW_PRES = null; return 'none'; }
  if (NAV_TYPE === 'hard' || !prevAuthOpen || !FLOW_PRES){
    FLOW_PRES = resolvePresentation({ trigger:u.trigger, navigationType:NAV_TYPE, viewportWidth:viewportWidth() });
  }
  return FLOW_PRES;                        // presentation sticks for the life of one flow
}
function render(){
  URL_NOW = parseUrl(currentUrl());
  CUR_PRES = computePres();
  if (URL_NOW.authOpen) LAST_PRESENTATION = CUR_PRES;
  gateSeen = Object.create(null);
  emit('page_view', {
    page_path: URL_NOW.path,
    page_location: 'https://highbase.bh' + URL_NOW.raw,
    navigation_type: NAV_TYPE,
    presentation: CUR_PRES
  }, 'auto');
  paint();
  if (URL_NOW.authOpen && (!prevAuthOpen || NAV_TYPE === 'hard')){
    emit('auth:open', { step:URL_NOW.step, url_form: URL_NOW.isRoute ? 'route' : 'query_param' });

}

    pa.innerHTML = storefrontHtml(u);

function syncFocus(root, u, pres){
  const sig = pres + '|' + u.mode + '|' + u.step + '|' + u.method + '|' + u.trigger + '|' + u.product + '|' + S.locale;
  const active = document.activeElement;

    const o = opens.filter(function(e){ return (e.props[prop] || '—') === k; }).length;

document.addEventListener('click', function(e){
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const a = el.getAttribute('data-act');
  const d = el.dataset;
  switch(a){
    case 'go':        navigate(d.to, 'push'); break;
    case 'hback':     goBack(); break;
    case 'hfwd':      goForward(); break;
    case 'hreload':   reload(); break;
    case 'railtab':   railTab = d.tab; renderRail(); break;
    case 'clearev':   EVENTS.length = 0; renderRail(); break;
    case 'case':      { const c = CASES.filter(function(x){ return x.k === d.case; })[0]; if (c) c.f(); break; }
    case 'locale':    toggleLocale(); break;
    case 'device':    toggleDevice(); break;
    case 'nativemodal': toggleNativeModal(); break;
    case 'auth':      requireAuth({ level:d.level || 'L1', trigger:d.trigger, step:d.step,
                        mode: d.mode || defaultMode(d.trigger), invoker:el,
                        intent: d.trigger === 'checkout' ? { type:'goto_checkout' } : (d.trigger === 'order_history' ? { type:'goto_orders' } : null) }); break;
    case 'pricegate': requireAuth({ level:'L1', trigger:d.placement === 'pdp' ? 'price_gate_pdp' : 'price_gate_card',
                        intent:{ type:'reveal_price', productId:d.id }, invoker:el }); break;
    case 'addcart':   if (hasLevel('L1')){ addToCart(d.id, 1); toast(S.locale === 'ar' ? 'أُضيف إلى الطلب' : 'Added to your order'); paint(); }
                      else { requireAuth({ level:'L1', trigger:'add_to_cart', intent:{ type:'add_to_cart', productId:d.id, qty:1 }, invoker:el }); } break;
    case 'save':      if (hasLevel('L1')){ const i = S.saved.indexOf(d.id); i === -1 ? S.saved.push(d.id) : S.saved.splice(i, 1); paint(); }
                      else { requireAuth({ level:'L1', trigger:'save_product', intent:{ type:'save_product', productId:d.id }, invoker:el }); } break;
    case 'coupon':    if (hasLevel('L1')){ if (S.coupons.indexOf(d.code) === -1) S.coupons.push(d.code); paint(); }
                      else { requireAuth({ level:'L1', trigger:'apply_coupon', intent:{ type:'apply_coupon', code:d.code, productId:d.id }, invoker:el }); } break;
    case 'orders':    if (hasLevel('L1')) navigate('/orders','push');
                      else { requireAuth({ level:'L1', trigger:'order_history', mode:'signin', intent:{ type:'goto_orders' }, invoker:el }); } break;
    case 'supplier':  emit('auth:supplier_fork', { from:URL_NOW.authOpen ? 'auth_surface' : 'storefront' });
                      if (URL_NOW.authOpen) closeSurface('supplier_fork', true);
                      navigate('/suppliers/apply','push'); break;
    case 'signout':   resetSession(); break;
    case 'placeorder': toast(S.locale === 'ar' ? 'تم استلام طلبك.' : 'Order placed.'); break;
    case 'close':     closeSurface(d.reason || 'close_button'); break;
    case 'back':      goBack(); break;
    case 'mode':      if (URL_NOW.mode !== d.mode){ emit('auth:tab_switch', { to:d.mode }); setParam('mode', d.mode, 'replace'); } break;
    case 'method':    emit('auth:method_select', { to:d.method });
                      UI.error = null; UI.errorField = null;
                      { const u = URL_NOW; const q = Object.assign({}, u.query, { method:d.method, step:'identify' });
                        navigate(buildUrl(u.path, q), 'replace'); } break;
    case 'showpw':    F.showPw = !F.showPw; paint(); break;
    case 'resend':    resendOtp(); break;
    case 'changephone': UI.error = null; UI.errorField = null; setStep('identify','push'); break;
    case 'skipbiz':   skipBusiness(); break;
    case 'skipcr':    skipCr(); break;
    case 'noop':      break;
  }
});
document.addEventListener('submit', function(e){
  const f = e.target.closest('[data-form]');
  if (!f) return;
  e.preventDefault();
  if (UI.busy) return;
  const kind = f.getAttribute('data-form');
  if (kind === 'identify') submitIdentify();
  else if (kind === 'otp') submitOtp();
  else if (kind === 'business') submitBusiness();
  else if (kind === 'cr') submitCr();
});
document.addEventListener('input', function(e){
  const n = e.target;
  if (n.dataset && n.dataset.bind){
    const k = n.dataset.bind;
    if (k === 'phone'){ F.phone = n.value.replace(/\D/g,'').slice(0,8); if (n.value !== F.phone && !/\s/.test(n.value)) n.value = F.phone; }
    else if (n.type === 'checkbox') F[k] = n.checked;
    else F[k] = n.value;
    return;
  }
  if (n.dataset && n.dataset.otp !== undefined){
    const i = +n.dataset.otp;
    const v = n.value.replace(/\D/g,'').slice(-1);
    n.value = v; F.code[i] = v;
    if (v && i < 5){ const nx = $('#otp' + (i + 2)); if (nx) nx.focus(); }
    if (F.code.join('').length === 6 && !UI.busy) submitOtp();      // auto-submit, Continue stays functional
  }
});
document.addEventListener('keydown', function(e){
  const n = e.target;
  if (n.dataset && n.dataset.otp !== undefined){
    const i = +n.dataset.otp;
    if (e.key === 'Backspace' && !n.value && i > 0){ const pv = $('#otp' + i); if (pv){ pv.focus(); pv.value = ''; F.code[i - 1] = ''; } }
    if (e.key === 'ArrowLeft'  && i > 0){ const pv = $('#otp' + i); if (pv) pv.focus(); }
    if (e.key === 'ArrowRight' && i < 5){ const nx = $('#otp' + (i + 2)); if (nx) nx.focus(); }
    return;
  }
  if (e.key === 'Escape' && URL_NOW && URL_NOW.authOpen && CUR_PRES !== 'page' && !S.nativeModal){
    e.preventDefault(); closeSurface('escape');
  }
});
/* WCAG 2.2 SC 3.3.8 — pasting a full code into any box must fill all six */
document.addEventListener('paste', function(e){
  const n = e.target;
  if (!n.dataset || n.dataset.otp === undefined) return;
  const txt = (e.clipboardData || window.clipboardData).getData('text') || '';
  const digits = txt.replace(/\D/g,'').slice(0,6);
  if (!digits) return;
  e.preventDefault();
  F.code = ['','','','','',''];
  digits.split('').forEach(function(c, i){ F.code[i] = c; const b = $('#otp' + (i + 1)); if (b) b.value = c; });
  emit('auth:otp_paste', { pasted_length:digits.length });
  const last = $('#otp' + Math.min(digits.length, 6)); if (last) last.focus();
  if (digits.length === 6) submitOtp();
});

/* ===========================================================================
   Contract self-test — stands in for the lint rule in §7.2 and checks the
   invariants the acceptance criteria depend on.
   ======================================================================== */
function selfTest(){
  const R = [];
  const ok = function(name, cond){ R.push({ test:name, pass:!!cond }); return !!cond; };

  ok('checkout always resolves to a page',
     resolvePresentation({ trigger:'checkout', navigationType:'soft', viewportWidth:1280 }) === 'page');
  ok('hard navigation always resolves to a page',
     resolvePresentation({ trigger:'price_gate_pdp', navigationType:'hard', viewportWidth:1280 }) === 'page');
  ok('narrow viewport resolves to a sheet',
     resolvePresentation({ trigger:'price_gate_pdp', navigationType:'soft', viewportWidth:390 }) === 'sheet');
  ok('otherwise an overlay',
     resolvePresentation({ trigger:'price_gate_pdp', navigationType:'soft', viewportWidth:1280 }) === 'overlay');

  ok('return_to rejects absolute URLs',        safeReturnTo('https://evil.example/x') === null);
  ok('return_to rejects protocol-relative',    safeReturnTo('//evil.example') === null);
  ok('return_to rejects unlisted paths',       safeReturnTo('/admin') === null);
  ok('return_to allows a product path',        safeReturnTo('/product/p_mou_pch') === '/product/p_mou_pch');

  ok('closing strips every auth param',
     urlWithoutAuth('/product/p_mou_pch?auth=signup&trigger=price_gate_pdp&step=identify&product=p_mou_pch') === '/product/p_mou_pch');
  ok('a hash fragment is never used for auth state', currentUrl().indexOf('#') === -1);

  ok('every trigger has EN and AR copy',
     TRIGGERS.every(function(k){ return TRIGGER_COPY[k] && TRIGGER_COPY[k].en && TRIGGER_COPY[k].ar; }));
  ok('an unknown trigger is rejected by requireAuth', (function(){
     try { requireAuth({ level:'L1', trigger:'newsletter_popup' }); return false; } catch(e){ return true; } })());

  const doc = [$('#stage'), $('#rail'), $('#chrome')].map(function(n){ return n ? n.innerHTML : ''; }).join(' ');
  ok('“I\'m not a Buyer” appears nowhere',   doc.indexOf("not a Buyer") === -1);
  ok('“Join & View Price” appears nowhere',  doc.indexOf('Join &amp; View Price') === -1 && doc.indexOf('Join & View Price') === -1);
  ok('“Login” is never used as a label',     doc.indexOf('>Login<') === -1);
  ok('no auth surface outside auth/ — guarded', (function(){
     const saved = AUTH_INTERNAL; AUTH_INTERNAL = false;
     let threw = false; try { ensureDialogGuarded(); } catch(e){ threw = true; }
     AUTH_INTERNAL = saved; return threw; })());
  ok('primary CTA is never disabled on first paint',
     $$('button[type="submit"]').every(function(b){ return !b.disabled; }));

  const pass = R.every(function(r){ return r.pass; });
  try { console.table(R); console.log('%cHIGHBASE contract self-test: ' + (pass ? 'PASS' : 'FAIL'),
    'background:' + (pass ? '#1E9E63' : '#C8102E') + ';color:#fff;padding:2px 6px;border-radius:3px'); } catch(e){}
  return pass;
}
function ensureDialogGuarded(){
  if (!AUTH_INTERNAL) throw new Error('AuthSurface may only be rendered from auth/ — call requireAuth() instead.');
  return ensureDialog();
}

   Boot
   ======================================================================== */
$('#stage').innerHTML = '<div id="pagearea"></div><div class="toasts" id="toasts"></div>';
window.addEventListener('popstate', function(){ /* the simulated chrome owns history */ });
window.HIGHBASE = { S:S, EVENTS:EVENTS, HISTORY:HISTORY, requireAuth:requireAuth, testHooks:testHooks,
                    mockApi:mockApi, selfTest:selfTest, PRODUCTS:PRODUCTS };
render();                      /* first paint is a hard navigation (§5.3) */
setTimeout(selfTest, 300);
})();
