<title>Where the Checkout Loses Orders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* ============================================================
   HIGHBASE checkout — heuristic evaluation, presented.
   A committed single-theme deck: dark navy frames, light slides.
   Every colour is painted explicitly so it holds on any host ground.
   ============================================================ */
:root{
  color-scheme:light;
  --navy:#0a2540; --navy-2:#16456f; --ice:#c7dcf0;
  --ink:#0f1c2b; --muted:#4a5b6e; --faint:#7c8da0;
  --paper:#ffffff; --mist:#f1f5f9; --line:#e3e9f0;
  --amber:#9c5c00; --amber-bg:#fdf3e3;
  --green:#15693d; --green-bg:#eaf5ef;
  --red:#a81e17;   --red-bg:#faeae9;
  --blue:#1470bd;  --blue-bg:#e9f2fb;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --sans:"Plus Jakarta Sans",ui-sans-serif,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:#1c2b3a;font-family:var(--sans);color:var(--ink);
  -webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums lining-nums}
:where(button,a,[tabindex]):focus-visible{outline:3px solid #6fb3ee;outline-offset:3px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Stage ---------- */
#viewport{min-height:100vh;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:56px 20px 76px}
#deck{transform-origin:top center}
.slide{
  width:1280px;height:720px;background:var(--paper);position:relative;
  padding:58px 64px 52px;display:none;flex-direction:column;overflow:hidden;
  box-shadow:0 18px 50px rgba(0,0,0,.42);border-radius:4px;
}
.slide.on{display:flex}
.slide.dark{background:var(--navy);color:#fff}

/* ---------- Type ---------- */
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.20em;text-transform:uppercase;color:var(--faint)}
.slide.dark .eyebrow{color:var(--ice)}
h1{font-family:var(--serif);font-size:62px;line-height:1.08;margin:0;font-weight:700;
  letter-spacing:-.015em;text-wrap:balance}
h2{font-family:var(--serif);font-size:44px;line-height:1.12;margin:0;font-weight:700;
  letter-spacing:-.012em;text-wrap:balance}
h3{font-family:var(--serif);font-size:26px;line-height:1.2;margin:0;font-weight:700}
.lede{font-size:20px;line-height:1.5;color:var(--muted);margin:14px 0 0;max-width:62ch}
.slide.dark .lede{color:var(--ice)}
.slide-head{margin-bottom:34px;flex:0 0 auto}

/* ---------- Cards ---------- */
.card{background:var(--mist);border-radius:14px;padding:26px 28px}
.cards{display:grid;gap:22px;flex:1;min-height:0}
.c4{grid-template-columns:repeat(4,1fr)}
.c3{grid-template-columns:repeat(3,1fr)}
.c2{grid-template-columns:repeat(2,1fr)}
.c22{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,1fr)}
.stat{font-family:var(--serif);font-size:62px;font-weight:700;line-height:1;
  letter-spacing:-.02em;color:var(--navy)}
.stat-cap{font-size:15px;line-height:1.45;color:var(--muted);margin-top:14px}
.card p{margin:0}
.card-body{font-size:16px;line-height:1.55;color:var(--muted);margin-top:12px}

/* ---------- Finding slide ---------- */
.f-top{display:flex;align-items:center;gap:18px;flex:0 0 auto}
.f-id{background:var(--navy);color:#fff;font-size:19px;font-weight:800;
  padding:9px 15px;border-radius:9px;letter-spacing:.02em}
.f-title{font-family:var(--serif);font-size:36px;font-weight:700;line-height:1.15;
  margin:0;flex:1;letter-spacing:-.01em}
.sev{font-size:15px;font-weight:700;padding:9px 17px;border-radius:9px;white-space:nowrap}
.sev4{background:var(--red-bg);color:var(--red)}
.sev3{background:var(--amber-bg);color:var(--amber)}
.sev2{background:var(--blue-bg);color:var(--blue)}
.f-heur{font-size:14px;color:var(--faint);margin:12px 0 0;padding-left:76px}
.f-cols{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:26px;flex:1;min-height:0}
.f-col{border-radius:14px;padding:22px 24px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.f-col.today{background:var(--amber-bg)}
.f-col.fixed{background:var(--green-bg)}
.f-lab{display:flex;align-items:center;gap:11px;font-size:13.5px;font-weight:700;
  letter-spacing:.13em;text-transform:uppercase}
.f-lab::before{content:"";width:11px;height:11px;border-radius:50%;background:currentColor;flex:0 0 11px}
.today .f-lab{color:var(--amber)} .fixed .f-lab{color:var(--green)}
.f-text{font-size:16px;line-height:1.48;margin:12px 0 0;color:var(--ink)}
.f-ev{font-size:12.5px;font-style:italic;line-height:1.38;margin:auto 0 0;padding-top:10px;color:var(--amber)}
.f-live{font-size:12.5px;font-weight:700;margin:auto 0 0;padding-top:10px;color:var(--green)}
.f-cost{background:var(--mist);border-radius:14px;padding:16px 28px;margin-top:18px;flex:0 0 auto}

/* Evidence: the same region of the same flow, before and after */
.f-labrow{display:flex;align-items:baseline;gap:12px}
.f-src{margin-left:auto;font-size:11.5px;font-weight:600;text-transform:none;
  letter-spacing:.01em;color:var(--muted)}
.f-shot{
  display:block;width:100%;aspect-ratio:2.74;object-fit:cover;object-position:top center;
  margin-top:10px;border-radius:9px;background:#fff;
  border:1px solid rgba(15,28,43,.14);
  box-shadow:0 2px 8px rgba(15,28,43,.10);
}
.f-cost .f-lab{color:var(--navy)}
.f-cost .cost-text{font-size:16px;line-height:1.45;margin:8px 0 0}

/* ---------- Chart: one measure, ten categories, one hue ---------- */
.chart{display:flex;flex-direction:column;gap:9px;flex:1;justify-content:center}
.row{display:grid;grid-template-columns:290px 1fr;align-items:center;gap:18px;min-height:30px;
  border-radius:8px;padding:3px 6px;margin:0 -6px}
.row:hover,.row:focus-visible{background:var(--mist)}
.row-lab{font-size:15px;color:var(--muted);text-align:right;line-height:1.25}
.row:hover .row-lab{color:var(--ink)}
.track{display:flex;align-items:center;gap:12px}
.bar{height:20px;border-radius:0 5px 5px 0;background:var(--navy-2);flex:0 0 auto}
.row.lead .bar{background:var(--navy)}
.row.lead .row-lab{color:var(--ink);font-weight:700}
.bar-val{font-size:16px;font-weight:700;color:var(--ink)}
.row-ids{font-size:13px;color:var(--faint);opacity:0;transition:opacity .12s;
  white-space:nowrap;overflow:hidden;min-width:0;flex:0 1 auto}
.row:hover .row-ids,.row:focus-visible .row-ids{opacity:1}

/* ---------- Misc slide parts ---------- */
.steps{display:flex;flex-direction:column;gap:26px;flex:1;justify-content:center}
.step{display:flex;gap:24px;align-items:flex-start}
.step-n{width:56px;height:56px;flex:0 0 56px;border-radius:50%;background:var(--navy);
  color:#fff;font-family:var(--serif);font-size:26px;font-weight:700;
  display:grid;place-items:center}
.legend-row{display:flex;align-items:center;gap:24px;margin-bottom:22px}
.legend-row .sev{min-width:186px;text-align:center;font-size:16px}
.legend-row span{font-size:19px;color:var(--muted)}
.wave-tag{display:inline-block;font-size:14px;font-weight:700;padding:7px 15px;border-radius:8px}
.wave-list{font-size:16px;line-height:1.55;color:var(--ink);margin:16px 0 0}
.wave-list li{margin-bottom:11px}
.wave-list li:last-child{margin-bottom:0}
.wave-note{font-size:14px;font-style:italic;color:var(--muted);margin:auto 0 0;padding-top:16px;line-height:1.45}
.link-box{background:var(--navy-2);border-radius:12px;padding:22px 26px;font-size:20px;
  font-weight:700;color:#fff;word-break:break-all}
.divider-n{font-family:var(--serif);font-size:120px;font-weight:700;color:var(--navy-2);
  line-height:1;margin-bottom:4px}
.foot{position:absolute;left:64px;right:64px;bottom:26px;display:flex;
  font-size:13px;color:var(--faint)}
.foot span:last-child{margin-left:auto}

/* ---------- Deck chrome ---------- */
#bar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:center;
  gap:14px;padding:12px 20px;background:rgba(10,37,64,.94);
  backdrop-filter:blur(8px);color:#fff}
#bar button{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);
  color:#fff;font:inherit;font-size:13px;font-weight:600;padding:7px 14px;
  border-radius:8px;cursor:pointer}
#bar button:hover:not(:disabled){background:rgba(255,255,255,.2)}
#bar button:disabled{opacity:.35;cursor:not-allowed}
#count{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;min-width:78px;text-align:center}
#title-now{font-size:13px;color:#a9c4de;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;flex:1;min-width:0}
#progress{position:fixed;left:0;top:0;height:3px;background:#2f8fd8;z-index:21;
  transition:width .18s ease}

/* ---------- Overview ---------- */
#grid{position:fixed;inset:0;z-index:30;background:#12212f;overflow:auto;
  padding:28px 28px 84px;display:none;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:18px}
#grid.on{display:grid}
.thumb{background:#fff;border-radius:6px;aspect-ratio:16/9;position:relative;
  overflow:hidden;cursor:pointer;border:2px solid transparent;padding:0}
.thumb:hover,.thumb:focus-visible{border-color:#2f8fd8}
.thumb.dark{background:var(--navy)}
.thumb-in{position:absolute;inset:0;padding:11px 13px;display:flex;flex-direction:column;
  gap:5px;text-align:left;pointer-events:none}
.thumb-n{font-size:10px;font-weight:700;color:var(--faint)}
.thumb.dark .thumb-n{color:var(--ice)}
.thumb-t{font-family:var(--serif);font-size:14px;font-weight:700;line-height:1.2;
  color:var(--ink);overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.thumb.dark .thumb-t{color:#fff}
.thumb-s{font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:5px;align-self:flex-start;margin-top:auto}

/* ---------- Phone: stack every slide and let it reflow ---------- */
@media (max-width:900px){
  #viewport{display:block;padding:14px 14px 78px}
  #deck{transform:none !important;width:100%}
  .slide{display:flex !important;width:100%;height:auto;min-height:0;
    padding:26px 22px 30px;margin-bottom:16px;border-radius:10px}
  h1{font-size:34px} h2{font-size:27px} h3{font-size:20px}
  .lede{font-size:16px}
  .cards{grid-template-columns:1fr !important;grid-template-rows:none !important}
  .f-cols{grid-template-columns:1fr;gap:14px}
  .f-title{font-size:23px}
  .f-text{font-size:15px}
  .f-cost .cost-text{font-size:15px}
  .f-labrow{flex-wrap:wrap}
  .f-src{margin-left:0;flex:0 0 100%}
  .f-heur{padding-left:0;margin-top:14px}
  .f-top{flex-wrap:wrap;gap:12px}
  .stat{font-size:44px}
  .f-ev,.f-live,.wave-note{margin-top:16px}
  .row{grid-template-columns:150px 1fr;gap:10px}
  .row-lab{font-size:12px}
  .row-ids{display:none}
  .divider-n{font-size:64px}
  .foot{position:static;margin-top:22px;padding:0}
  #count,#title-now{display:none}
  #grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
@media print{
  body{background:#fff}
  #bar,#progress,#grid{display:none !important}
  #viewport{padding:0;display:block}
  #deck{transform:none !important}
  .slide{display:flex !important;box-shadow:none;border-radius:0;
    break-after:page;page-break-after:always;margin:0}
}
</style>

<div id="progress" style="width:0"></div>
<div id="viewport"><div id="deck" role="region" aria-label="Presentation slides"></div></div>

<div id="grid" role="dialog" aria-label="All slides" aria-modal="true"></div>

<nav id="bar" aria-label="Slide navigation">
  <button type="button" id="prev" aria-label="Previous slide">← Prev</button>
  <span id="count" aria-live="polite"></span>
  <button type="button" id="next" aria-label="Next slide">Next →</button>
  <span id="title-now"></span>
  <button type="button" id="overview" aria-label="Show all slides">All slides</button>
</nav>

(function(){
"use strict";

var FINDINGS = [{"id":"C1","sec":"cart","sev":4,"h":["5 · Error prevention","9 · Recover from errors"],"title":"The cart sells stock that isn't there","today":"An item flagged “Only 1 item in stock” keeps a quantity of 7, and the line still totals BHD 7.000. Nothing reconciles the two.","ev":"Cart — Nadec Vanilla Flavored Milk 125ml.","fixed":"The line states the conflict, suppresses its total, and offers a one-tap “Reduce to 1” alongside a restock alert.","cost":"The shortfall surfaces after payment. Every occurrence becomes a refund, a substitution call, or a cancelled line.","before":"b_cart_stock","after":"a_cart_stock"},{"id":"C2","sec":"cart","sev":4,"h":["1 · Visibility of system status"],"title":"A BHD 10 delivery fee appears one page too late","today":"Order Summary shows Subtotal BHD 11.000 and Total BHD 11.000. The delivery fee — 91% of the basket value — only appears on the review page.","ev":"Cart summary vs. review page.","fixed":"Delivery, coupons and VAT are itemised in the cart. No figure changes between screens.","cost":"Unexpected shipping cost is the most-cited reason buyers abandon a basket. Here it nearly doubles the bill without warning.","before":"b_cart_summary","after":"a_cart_summary"},{"id":"C3","sec":"cart","sev":3,"h":["2 · Match the real world","6 · Recognition over recall"],"title":"The cart ignores supplier boundaries","today":"A flat product grid, though minimum order, delivery fee, coupons and dispatch all belong to a supplier. The review page then splits the order anyway.","ev":"Five items, no supplier boundary shown.","fixed":"Items sit in supplier groups carrying that supplier's terms, subtotal, delivery and readiness to order.","cost":"Buyers cannot predict what they will pay or when it arrives, so they call the team to find out.","before":"b_cart_flat","after":"a_cart_group"},{"id":"C4","sec":"cart","sev":3,"h":["8 · Aesthetic and minimalist design"],"title":"The same warning, repeated four times","today":"“Minimum order for this product supplier: BHD 10.000. Add BHD 6.000 more or other items to proceed.” is repeated verbatim on every card in the group.","ev":"Four identical blocks in one viewport.","fixed":"One progress bar per supplier: amount reached, target, the exact gap, and a link that closes it.","cost":"Repetition trains buyers to ignore the message, so the minimum blocks them at checkout instead of guiding them to a bigger basket.","before":"b_cart_moq","after":"a_cart_moq"},{"id":"C5","sec":"cart","sev":3,"h":["6 · Recognition over recall","7 · Flexibility and efficiency"],"title":"No price per piece","today":"“18pcs” sits beside “BHD 1.000” with no per-piece figure. Comparing pack sizes is manual arithmetic, on every line.","ev":"Nadec Long Life Low Fat UHT Milk 200ml 18pcs.","fixed":"Every line shows price per case, price per piece, and the total piece count.","cost":"Cost per unit is how trade buyers decide. Making them compute it sends them to a competitor's catalogue to compare.","before":"b_cart_units","after":"a_cart_units"},{"id":"C6","sec":"cart","sev":3,"h":["3 · User control and freedom"],"title":"One short supplier stalls the whole basket","today":"A supplier under its minimum blocks everything. The only routes out are buying more or deleting items.","ev":"Cart total falls from BHD 11.000 to BHD 4.000 as items are removed to get under way.","fixed":"Suppliers that are ready check out now. The rest stays in the cart, named beneath the button.","cost":"A blocked basket defers all of the revenue instead of banking the part that was already ready to ship.","before":"b_cart_moq","after":"a_cart_partial"},{"id":"C7","sec":"cart","sev":2,"h":["1 · Visibility of system status"],"today":"Deselecting items changes the header total silently. Nothing states which lines the order actually covers.","title":"Partial selection changes the total silently","ev":"“Select All” and per-card checkboxes.","fixed":"The summary counts the lines it covers, and each supplier group reads “Ready to order” or “Excluded from this order”.","cost":"Buyers place an order missing lines, then place a second one — doubling the handling for a single restock.","before":"b_cart_flat","after":"a_cart_chips"},{"id":"C8","sec":"cart","sev":2,"h":["7 · Flexibility and efficiency"],"title":"No way to reorder","today":"There is no reorder, no saved list and no SKU entry anywhere in the flow. Every order starts from browsing.","ev":"Observed across the full walkthrough.","fixed":"Quick-add by SKU, “Save as list”, and a recurring-basket prompt on the confirmation screen.","cost":"B2B demand is repetitive. Charging a full browse for every repeat order is where regular buyers quietly churn.","before":"b_cart_flat","after":"a_cart_toolbar"},{"id":"R1","sec":"review","sev":3,"h":["4 · Consistency and standards","1 · Visibility of system status"],"title":"“Seller Total” is not the total","today":"“Seller Total BHD 10.000” appears after three discounts with no order total beside it. It is unclear whether this is what will be charged.","ev":"Subtotal BHD 11.000, delivery BHD 10.000, three stacked discounts, then “Seller Total”.","fixed":"One summary with one hierarchy — items, delivery, discounts, VAT, Total — identical on all three screens.","cost":"The buyer cannot verify the bill before paying, so their finance team queries it afterwards.","before":"b_review_costs","after":"a_cart_summary"},{"id":"R2","sec":"review","sev":2,"h":["2 · Match the real world"],"title":"Discounts labelled with internal codes","today":"Discounts appear as “Mahmmod_Seller_code”, “jpre” and “10Dinar” — raw internal identifiers that carry no meaning for the buyer.","ev":"Review page, discount rows.","fixed":"Each discount names its source and its value: “Coupon ALMANAR2 — supplier coupon, −BHD 2.000”.","cost":"A discount the buyer cannot recognise earns no goodwill. The margin is given away invisibly.","before":"b_review_costs","after":"a_cart_coupon"},{"id":"R3","sec":"review","sev":2,"h":["7 · Flexibility and efficiency"],"title":"The coupon field comes after the decision","today":"Coupon entry is at the very bottom of the page, beneath the totals it would change.","ev":"Review page, below “Seller Total”.","fixed":"Coupon entry sits at the top of the summary, above the figures it changes.","cost":"Buyers leave the page to hunt for a code, or abandon believing none applies to them.","before":"b_review_costs","after":"a_cart_coupon"},{"id":"A1","sec":"addr","sev":4,"h":["1 · Visibility of system status"],"title":"No order summary at the moment of commitment","today":"The page carries no order summary and no total. The buyer presses “Place Order” with nothing on screen saying what is being bought, or for how much.","ev":"Full page: verification header, branch details, address, documents, button.","fixed":"A sticky summary with the full breakdown, present on every checkout screen and beside the button itself.","cost":"This is the riskiest moment in the flow. Buyers hesitate, navigate back to re-check, and lose the basket doing it.","before":"b_verify_top","after":"a_co_summary"},{"id":"A2","sec":"addr","sev":4,"h":["7 · Flexibility and efficiency","3 · User control and freedom"],"title":"Trade documents are demanded on every order","today":"CR number, commercial licence and personal ID are uploaded inside the order — on every purchase, including routine repeat ones.","ev":"Business Documents section, above “Place Order”.","fixed":"Verification moves to the account. Checkout shows a verified chip with CR, VAT and expiry. Unverified buyers still order — dispatch waits, not the order.","cost":"This taxes precisely the customers who buy most often. A document wall between a repeat buyer and a routine restock is the most expensive friction in the product.","before":"b_docs","after":"a_co_verify"},{"id":"A3","sec":"addr","sev":4,"h":["8 · Aesthetic and minimalist design","1 · Visibility of system status"],"title":"The uploaded ID takes over the page","today":"The uploaded ID renders full-bleed at its natural size, pushing “Place Order” thousands of pixels below the fold. A larger file pushes it further still.","ev":"Screenshot 1 — the image fills the viewport and continues past it.","fixed":"Attachments render as fixed-height rows: thumbnail, name, size, preview, remove. User content never sets page height.","cost":"The buy button becomes unreachable without a long scroll past the buyer's own ID photo.","before":"b_giant","after":"a_doc_row"},{"id":"A4","sec":"addr","sev":3,"h":["1 · Visibility of system status","4 · Consistency and standards"],"title":"No real progress indicator","today":"A panel labelled “Step / Address & Documents” sits above the fold; a separate “Step 2” chip sits further down. Neither says how many steps exist.","ev":"Two competing step markers on one page.","fixed":"One indicator with three counted steps: Cart → Delivery & purchase details → Payment.","cost":"Buyers who cannot see the end of a process assume it is longer than it is, and stop before reaching it.","before":"b_verify_top","after":"a_co_steps"},{"id":"A5","sec":"addr","sev":3,"h":["4 · Consistency and standards"],"title":"Settled values are styled as warnings","today":"Field values are set in orange on white — Bahrain, Manama, 18, 11111 — at a measured contrast of 2.03:1. Orange elsewhere in the interface means “warning”.","ev":"Screenshots 1 and 2, Delivery Address.","fixed":"Values in near-black at 17.2:1. Amber is reserved for genuine attention states; the palette is audited to 4.5:1 minimum.","cost":"Below the WCAG AA threshold for body text — an accessibility and procurement-compliance exposure, and buyers click values that are not links.","before":"b_verify_top","after":"a_co_addr"},{"id":"A6","sec":"addr","sev":3,"h":["1 · Visibility of system status"],"title":"“Place Order” carries no amount","today":"The commit button states no amount, and no amount is visible anywhere else on the page.","ev":"Screenshot 3, Business Documents footer.","fixed":"The button reads “Place order · BHD 11.000”.","cost":"The cheapest reassurance available in any checkout, currently unspent.","before":"b_docs","after":"a_co_cta"},{"id":"A7","sec":"addr","sev":3,"h":["1 · Visibility of system status","2 · Match the real world"],"title":"No delivery date or window","today":"No delivery date, time window or shipment count is offered or shown, even though the order will split by supplier.","ev":"Address confirmation, full page.","fixed":"Day and time-slot pickers per shipment, with capacity shown and the shipment count stated up front.","cost":"Businesses staff their goods-in bay. An unscheduled delivery fails, and a failed delivery is paid for twice.","before":"b_verify_top","after":"a_co_window"},{"id":"A8","sec":"addr","sev":3,"h":["2 · Match the real world"],"title":"None of the fields procurement runs on","today":"No purchase order number, no cost centre, no invoice recipient — the fields a buyer's finance team reconciles against.","ev":"Branch Details and Delivery Address sections.","fixed":"Optional PO number, cost centre and invoice email, stated as printed on the tax invoice.","cost":"Without them the buyer re-keys every order into their own system. That is the fastest way to lose a corporate account.","before":"b_verify_top","after":"a_co_purchase"},{"id":"A9","sec":"addr","sev":2,"h":["8 · Aesthetic and minimalist design","10 · Help and documentation"],"title":"An empty VAT panel","today":"“Have VAT certificate” is an unchecked box beside a large empty panel — roughly a third of the section is blank, with no explanation of what checking it does.","ev":"Screenshot 1, Business Documents.","fixed":"VAT status is part of the account verification line, stated as a value rather than an empty container.","cost":"Buyers skip it, and VAT-reclaim data never reaches the invoice that needs it.","before":"b_docs","after":"a_co_verify"},{"id":"A10","sec":"addr","sev":2,"h":["1 · Visibility of system status"],"title":"A map pin that confirms nothing","today":"The pin is required but never resolved back to anything. There is no confirmation of the address it corresponds to, and no way to tell a correct pin from a default one.","ev":"Select Address Location, address confirmation.","fixed":"The pin shows its saved coordinates, is labelled as what drivers actually use, and is adjustable in place.","cost":"Wrong pins mean wrong drops, and that cost lands on the delivery team rather than the buyer.","before":"b_pin","after":"a_co_addr"},{"id":"P1","sec":"pay","sev":4,"h":["7 · Flexibility and efficiency","10 · Help and documentation"],"title":"Payment has to be finished on another page","today":"“Click on Track Your Order to upload the transaction receipt” — the page that creates the payment task sends the buyer elsewhere to complete it.","ev":"Screenshot 4, beneath the bank details.","fixed":"The receipt dropzone sits directly under the bank details, with “I'll pay later” as the explicit alternative.","cost":"Every hop between a task and its completion loses people — and this hop sits between the order and the money.","before":"b_attach","after":"a_cf_drop"},{"id":"P2","sec":"pay","sev":3,"h":["1 · Visibility of system status","4 · Consistency and standards"],"title":"“Placed successfully” while still unpaid","today":"“Your order has been placed successfully” appears while payment is outstanding — two contradictory states on one screen.","ev":"Screenshot 4, page header vs. payment panel.","fixed":"“Order received”, with the outstanding payment as the most prominent card and the current stage marked on a status timeline.","cost":"Buyers believe they are done and never transfer. The order ages in the queue until somebody chases it by hand.","before":"b_pay","after":"a_cf_ref"},{"id":"P3","sec":"pay","sev":3,"h":["1 · Visibility of system status"],"title":"No payment deadline","today":"No deadline, no reservation window, and no stated consequence of not transferring the amount.","ev":"Screenshot 4, HIGHBASE Payment panel.","fixed":"A named expiry with a live countdown, and the stock-reservation rule stated in the first sentence.","cost":"A manual transfer with no deadline becomes “later”. Stock sits reserved against orders that will never pay.","before":"b_attach","after":"a_cf_countdown"},{"id":"P4","sec":"pay","sev":3,"h":["1 · Visibility of system status","10 · Help and documentation"],"title":"The page ends at the bank details","today":"No delivery date, no next steps, and no route to the supplier. The confirmation stops once the IBAN is on screen.","ev":"Screenshot 4, full page.","fixed":"A dated timeline through to invoicing, plus track, proforma download and message-supplier actions.","cost":"“When does my stock arrive?” becomes a support ticket on essentially every order.","before":"b_pay","after":"a_cf_timeline"},{"id":"P5","sec":"pay","sev":2,"h":["10 · Help and documentation"],"title":"No transfer reference given","today":"The transfer reference is never stated, so a buyer paying from their banking app has no instruction on how the payment will be matched to the order.","ev":"Screenshot 4, Bank Details.","fixed":"The reference is a copyable field of its own, with the matching rule stated directly beneath it.","cost":"Unmatched transfers are reconciled by hand, by finance, one payment at a time.","before":"b_pay","after":"a_cf_pay"}];

/* ---------- Render ---------- */
var deck = document.getElementById("deck"), gridEl = document.getElementById("grid");
var N = slides.length, cur = 0;

deck.innerHTML = slides.map(function(s,i){
  var head = s.title ? '<div class="slide-head"><h2>'+s.title+'</h2>'+
        (s.lede ? '<p class="lede">'+s.lede+'</p>' : '')+'</div>' : '';
  return '<section class="slide'+(s.dark?" dark":"")+'" id="s'+(i+1)+'" aria-hidden="true" '+
    'aria-label="Slide '+(i+1)+' of '+N+': '+esc(s.nav).replace(/"/g,"")+'">'+
    head + s.html +
    '<div class="foot"><span>'+(s.foot || "HIGHBASE checkout — heuristic evaluation")+'</span>'+
    '<span>'+(i+1)+'</span></div></section>';
}).join("");

gridEl.innerHTML = slides.map(function(s,i){
  var sev = (s.nav.match(/^([CRAP]\d+) /) || [])[1];
  var f = sev && FINDINGS.filter(function(x){ return x.id===sev; })[0];
  return '<button type="button" class="thumb'+(s.dark?" dark":"")+'" data-go="'+i+'">'+
    '<span class="thumb-in"><span class="thumb-n">'+(i+1)+'</span>'+
    '<span class="thumb-t">'+esc(s.title || s.nav)+'</span>'+
    (f ? '<span class="thumb-s sev'+f.sev+'">'+["","","Minor","Major","Catastrophic"][f.sev]+'</span>' : '')+
    '</span></button>';
}).join("");

var els = Array.prototype.slice.call(deck.children);

function fit(){
  if (window.innerWidth <= 900) { deck.style.transform = ""; return; }
  var k = Math.min(1, (window.innerWidth - 56) / 1280, (window.innerHeight - 140) / 720);
  deck.style.transform = "scale(" + k.toFixed(4) + ")";
  deck.style.height = (720 * k) + "px";
  deck.style.width  = "1280px";
}

function show(i, push){
  cur = Math.max(0, Math.min(N - 1, i));
  els.forEach(function(el,j){
    el.classList.toggle("on", j === cur);
    el.setAttribute("aria-hidden", String(j !== cur));
  });
  document.getElementById("count").textContent = (cur+1) + " / " + N;
  document.getElementById("title-now").textContent = slides[cur].nav;
  document.getElementById("prev").disabled = cur === 0;
  document.getElementById("next").disabled = cur === N - 1;
  document.getElementById("progress").style.width = ((cur+1)/N*100) + "%";
  if (push !== false) { try { history.replaceState(null,"","#"+(cur+1)); } catch(e){} }
  fit();
}

document.getElementById("prev").addEventListener("click", function(){ show(cur-1); });
document.getElementById("next").addEventListener("click", function(){ show(cur+1); });
document.getElementById("overview").addEventListener("click", function(){ gridEl.classList.toggle("on"); });
gridEl.addEventListener("click", function(e){
  var b = e.target.closest("[data-go]");
  if (b) { gridEl.classList.remove("on"); show(+b.dataset.go); }
});

document.addEventListener("keydown", function(e){
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  var k = e.key;
  if (k === "Escape") { gridEl.classList.remove("on"); return; }
  if (k === "o" || k === "O") { gridEl.classList.toggle("on"); return; }
  if (gridEl.classList.contains("on")) return;
  if (k === "ArrowRight" || k === "PageDown" || k === " ") { e.preventDefault(); show(cur+1); }
  else if (k === "ArrowLeft" || k === "PageUp") { e.preventDefault(); show(cur-1); }
  else if (k === "Home") { e.preventDefault(); show(0); }
  else if (k === "End")  { e.preventDefault(); show(N-1); }
});

window.addEventListener("resize", fit);
window.addEventListener("hashchange", function(){ show((parseInt(location.hash.slice(1),10)||1)-1, false); });
show((parseInt(location.hash.slice(1),10)||1)-1, false);
})();
