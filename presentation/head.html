  --hb-component-table-toolbar-padding: var(--hb-space-20);
  --hb-component-table-toolbar-gap: var(--hb-space-16);
  --hb-component-table-header-height: 56px;
  --hb-component-table-row-min-height: 64px;
  --hb-component-table-cell-padding-block: var(--hb-space-16);
  --hb-component-table-cell-padding-inline: var(--hb-space-20);
  --hb-component-table-row-border-style: dashed;
  --hb-component-table-status-radius: var(--hb-radius-8);
  --hb-component-table-status-height: 28px;
  --hb-component-table-thumb-size: 44px;
  --hb-component-table-avatar-size: 32px;
  --hb-component-table-footer-padding: var(--hb-space-20);
  --hb-component-table-footer-gap: var(--hb-space-24);
  --hb-component-page-header-title-size: var(--hb-font-size-24);
  --hb-component-page-header-gap: var(--hb-space-4);
  --hb-component-page-header-margin-bottom: var(--hb-space-24);
  --hb-component-stat-card-radius: var(--hb-radius-12);
  --hb-component-stat-card-padding: var(--hb-space-20);
  --hb-component-stat-card-gap: var(--hb-space-8);
  --hb-component-coupon-card-radius: var(--hb-radius-12);
  --hb-component-coupon-card-padding: var(--hb-space-12);
  --hb-component-coupon-card-icon-tile: 32px;
  --hb-component-empty-records-radius: var(--hb-radius-12);
  --hb-component-empty-records-min-height: 120px;
  --hb-component-empty-records-icon-size: 20px;
  --hb-component-breadcrumb-separator-glyph: ·;
  --hb-component-illustration-stroke-width: 3px;
  --hb-component-illustration-size-sm: 96px;
  --hb-component-illustration-size-md: 160px;
  --hb-component-illustration-size-lg: 240px;
}

/* Type roles — Latin */
.hb-display-lg { font-family: var(--hb-font-family-latin); font-size: var(--hb-font-size-48); font-weight: var(--hb-font-weight-semibold); line-height: var(--hb-font-line-height-latin-48); }
.hb-headline-lg { font-family: var(--hb-font-family-latin); font-size: var(--hb-font-size-32); font-weight: var(--hb-font-weight-bold); line-height: var(--hb-font-line-height-latin-32); }
.hb-headline-md { font-family: var(--hb-font-family-latin); font-size: var(--hb-font-size-24); font-weight: var(--hb-font-weight-bold); line-height: var(--hb-font-line-height-latin-24); }
.hb-headline-sm { font-family: var(--hb-font-family-latin); font-size: var(--hb-font-size-20); font-weight: var(--hb-font-weight-bold); line-height: var(--hb-font-line-height-latin-20); }
.hb-title-lg { font-family: var(--hb-font-family-latin); font-size: var(--hb-font-size-18); font-weight: var(--hb-font-weight-bold); line-height: var(--hb-font-line-height-latin-18); }
.hb-title-md { font-family: var(--hb-font-family-latin); font-size: var(--hb-font-size-16); font-weight: var(--hb-font-weight-bold); line-height: var(--hb-font-line-height-latin-16); }
.hb-title-sm { font-family: var(--hb-font-family-latin); font-size: var(--hb-font-size-14); font-weight: var(--hb-font-weight-bold); line-height: var(--hb-font-line-height-latin-14); }
.hb-body-lg { font-family: var(--hb-font-family-latin); font-size: var(--hb-font-size-16); font-weight: var(--hb-font-weight-regular); line-height: var(--hb-font-line-height-latin-16); }
.hb-body-md { font-family: var(--hb-font-family-latin); font-size: var(--hb-font-size-14); font-weight: var(--hb-font-weight-regular); line-height: var(--hb-font-line-height-latin-14); }
.hb-body-sm { font-family: var(--hb-font-family-latin); font-size: var(--hb-font-size-12); font-weight: var(--hb-font-weight-regular); line-height: var(--hb-font-line-height-latin-12); }
.hb-label-lg { font-family: var(--hb-font-family-latin); font-size: var(--hb-font-size-14); font-weight: var(--hb-font-weight-medium); line-height: var(--hb-font-line-height-latin-14); }
.hb-label-md { font-family: var(--hb-font-family-latin); font-size: var(--hb-font-size-12); font-weight: var(--hb-font-weight-medium); line-height: var(--hb-font-line-height-latin-12); }
.hb-label-sm { font-family: var(--hb-font-family-latin); font-size: var(--hb-font-size-10); font-weight: var(--hb-font-weight-medium); line-height: var(--hb-font-line-height-latin-10); }

/* Type roles — Arabic (any ancestor with lang="ar" or dir="rtl") */
[lang="ar"] .hb-display-lg, [dir="rtl"] .hb-display-lg { font-family: var(--hb-font-family-arabic); line-height: var(--hb-font-line-height-arabic-48); }
[lang="ar"] .hb-headline-lg, [dir="rtl"] .hb-headline-lg { font-family: var(--hb-font-family-arabic); line-height: var(--hb-font-line-height-arabic-32); }
[lang="ar"] .hb-headline-md, [dir="rtl"] .hb-headline-md { font-family: var(--hb-font-family-arabic); line-height: var(--hb-font-line-height-arabic-24); }
[lang="ar"] .hb-headline-sm, [dir="rtl"] .hb-headline-sm { font-family: var(--hb-font-family-arabic); line-height: var(--hb-font-line-height-arabic-20); }
[lang="ar"] .hb-title-lg, [dir="rtl"] .hb-title-lg { font-family: var(--hb-font-family-arabic); line-height: var(--hb-font-line-height-arabic-18); }
[lang="ar"] .hb-title-md, [dir="rtl"] .hb-title-md { font-family: var(--hb-font-family-arabic); line-height: var(--hb-font-line-height-arabic-16); }
[lang="ar"] .hb-title-sm, [dir="rtl"] .hb-title-sm { font-family: var(--hb-font-family-arabic); line-height: var(--hb-font-line-height-arabic-14); }
[lang="ar"] .hb-body-lg, [dir="rtl"] .hb-body-lg { font-family: var(--hb-font-family-arabic); line-height: var(--hb-font-line-height-arabic-16); }
[lang="ar"] .hb-body-md, [dir="rtl"] .hb-body-md { font-family: var(--hb-font-family-arabic); line-height: var(--hb-font-line-height-arabic-14); }
[lang="ar"] .hb-body-sm, [dir="rtl"] .hb-body-sm { font-family: var(--hb-font-family-arabic); line-height: var(--hb-font-line-height-arabic-12); }
[lang="ar"] .hb-label-lg, [dir="rtl"] .hb-label-lg { font-family: var(--hb-font-family-arabic); line-height: var(--hb-font-line-height-arabic-14); }
[lang="ar"] .hb-label-md, [dir="rtl"] .hb-label-md { font-family: var(--hb-font-family-arabic); line-height: var(--hb-font-line-height-arabic-12); }
[lang="ar"] .hb-label-sm, [dir="rtl"] .hb-label-sm { font-family: var(--hb-font-family-arabic); line-height: var(--hb-font-line-height-arabic-10); }

/* Window size classes */
@custom-media --compact (width < 744px);
@custom-media --medium (744px <= width < 1280px);
@custom-media --expanded (width >= 1280px);

/* ===========================================================================
   Deck layer. Every colour, size, radius and shadow below binds a --hb-* token.
   The only literals are the presentation stage itself (slide canvas, image
   aspect, scale maths) — the design system has no tokens for a slide deck, so
   those are named --deck-* and tagged (proposal) rather than scattered inline.
   =========================================================================== */
:root{
  color-scheme:light;
  /* (proposal) deck-only geometry — not part of the Highbase system */
  --deck-slide-w:1280px;
  --deck-slide-h:720px;
  --deck-shot-aspect:2.11;
  --deck-chart-label-w:288px;
  --deck-chart-label-w-compact:136px;
  --deck-chart-aside-w:320px;
  --deck-legend-chip-w:184px;
  --deck-thumb-min:232px;
  --deck-thumb-min-compact:140px;
  --deck-linkbox-max:820px;
  --deck-hairline:1px;
}

*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;
  background:var(--hb-color-surface-dark);
  color:var(--hb-color-on-surface);
  font-family:var(--hb-font-family-latin);
  -webkit-font-smoothing:antialiased;
}
[dir="rtl"] body,[lang="ar"] body{font-family:var(--hb-font-family-arabic)}
.num{font-variant-numeric:tabular-nums lining-nums}
:where(button,a,[tabindex]):focus-visible{
  outline:2px solid var(--hb-color-primary-300);
  outline-offset:2px;
  border-radius:var(--hb-radius-4);
}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Stage ---------- */
#viewport{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:var(--hb-space-56) var(--hb-space-20) var(--hb-space-76);
}
#deck{transform-origin:top center}
.slide{
  width:var(--deck-slide-w);height:var(--deck-slide-h);
  background:var(--hb-color-surface);
  padding:var(--hb-space-56) var(--hb-space-64) var(--hb-space-48);
  display:none;flex-direction:column;overflow:hidden;position:relative;
  border-radius:var(--hb-radius-8);
  box-shadow:var(--hb-elevation-level-2);
}
.slide.on{display:flex}
/* A dark slide sits on the same dark ground, and the system has exactly one
   shadow — too quiet to carry the edge here. surface-dark-container is the
   documented raised surface on that ground, so it draws the boundary. */
.slide[data-ground="dark"]{
  background:var(--hb-color-surface-dark);color:var(--hb-color-on-surface-dark);
  border:var(--deck-hairline) solid var(--hb-color-surface-dark-container);
}

/* ---------- Type — roles come from tokens.css; only colour is set here ---------- */
.eyebrow{color:var(--hb-color-on-surface-variant);text-transform:uppercase;letter-spacing:.08em}
[data-ground="dark"] .eyebrow{color:var(--hb-color-primary-200)}
h1,h2,h3{margin:0;color:var(--hb-color-on-surface);text-wrap:balance}
[data-ground="dark"] h1,[data-ground="dark"] h2,[data-ground="dark"] h3,
.card[data-tone="dark"] h1,.card[data-tone="dark"] h2,.card[data-tone="dark"] h3{color:var(--hb-color-on-surface-dark)}
.lede{margin:var(--hb-space-12) 0 0;color:var(--hb-color-on-surface-variant);max-width:64ch}
[data-ground="dark"] .lede{color:var(--hb-color-primary-200)}
.slide-head{margin-bottom:var(--hb-space-32);flex:0 0 auto}
.stack{margin:auto 0}

/* ---------- Surfaces ---------- */
.card{
  background:var(--hb-color-surface-container-low);
  border:var(--deck-hairline) solid var(--hb-color-outline-variant);
  border-radius:var(--hb-radius-16);
  padding:var(--hb-space-24);
}
.card[data-tone="dark"]{
  background:var(--hb-color-surface-dark);
  border-color:var(--hb-color-surface-dark-container);
  color:var(--hb-color-on-surface-dark);
}
.card[data-tone="dark"] .card-body{color:var(--hb-color-primary-200)}
.card[data-tone="success"]{background:var(--hb-color-success-container);border-color:var(--hb-color-success-outline)}
.cards{display:grid;gap:var(--hb-space-20);flex:1;min-height:0}
.c4{grid-template-columns:repeat(4,1fr)}
.c3{grid-template-columns:repeat(3,1fr)}
.c2{grid-template-columns:repeat(2,1fr)}
.c22{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,1fr)}
.card-body{margin:var(--hb-space-8) 0 0;color:var(--hb-color-on-surface-variant)}
.stat{color:var(--hb-color-primary-700);display:block}
.stat-cap{margin:var(--hb-space-12) 0 0;color:var(--hb-color-on-surface-variant)}

/* ---------- Chip — Highbase atom, tonal status usage.
   Status is always a tonal pill: {family}/container ground, on-{family}/container
   text. Never coloured text on white, never colour alone as the signal, so each
   pill carries its severity number and word. ---------- */
.hb-chip{
  display:inline-flex;align-items:center;gap:var(--hb-component-chip-gap);
  box-sizing:border-box;height:var(--hb-component-chip-height-md);
  padding-inline:var(--hb-component-chip-padding-x-md);
  border-radius:var(--hb-component-chip-radius);
  background:var(--hb-color-surface);color:var(--hb-color-on-surface-heading);
  font-family:var(--hb-font-family-latin);
  font-size:var(--hb-component-chip-font-size-md);line-height:1;
  font-weight:var(--hb-font-weight-medium);white-space:nowrap;
}
[lang="ar"] .hb-chip,[dir="rtl"] .hb-chip{font-family:var(--hb-font-family-arabic)}
.hb-chip[data-size="lg"]{
  height:var(--hb-component-chip-height-lg);
  padding-inline:var(--hb-component-chip-padding-x-lg);
  font-size:var(--hb-component-chip-font-size-lg);
}
.hb-chip[data-status="error"]{background:var(--hb-color-error-container);color:var(--hb-color-on-error-container)}
.hb-chip[data-status="warning"]{background:var(--hb-color-warning-container);color:var(--hb-color-on-warning-container)}
.hb-chip[data-status="info"]{background:var(--hb-color-info-container);color:var(--hb-color-on-info-container)}
.hb-chip[data-style="neutral"]{background:var(--hb-color-surface-container);color:var(--hb-color-on-surface-heading)}
.hb-chip[data-style="identifier"]{
  background:var(--hb-color-primary-700);color:var(--hb-color-on-primary);
  border-radius:var(--hb-radius-8);font-weight:var(--hb-font-weight-bold);
  font-size:var(--hb-font-size-14);
}

/* ---------- Button — Highbase atom markup API ---------- */
.hb-btn{
  display:inline-flex;align-items:center;justify-content:center;
  gap:var(--hb-component-button-gap);box-sizing:border-box;
  height:var(--hb-component-button-height-sm);
  padding-inline:var(--hb-space-12);
  border:0;border-radius:var(--hb-component-button-radius);
  background:var(--hb-color-primary-700);color:var(--hb-color-on-primary);
  font-family:var(--hb-font-family-latin);font-size:var(--hb-font-size-12);
  line-height:var(--hb-font-line-height-latin-12);
  font-weight:var(--hb-font-weight-medium);cursor:pointer;
  /* (proposal) motion is undefined in the system — placeholder only */
  transition:background-color 120ms,border-color 120ms;
}
[lang="ar"] .hb-btn,[dir="rtl"] .hb-btn{font-family:var(--hb-font-family-arabic)}
.hb-btn[data-size="md"]{height:var(--hb-component-button-height-md);padding-inline:var(--hb-component-button-padding-x);font-size:var(--hb-font-size-14)}
.hb-btn[data-style="ghost"]{background:transparent;color:var(--hb-color-on-surface-dark)}
.hb-btn[data-style="ghost"]:hover:not(:disabled){background:var(--hb-color-surface-dark-container)}
.hb-btn[data-style="outlined"]{
  background:transparent;color:var(--hb-color-on-surface-dark);
  border:var(--hb-component-button-outline-width) solid var(--hb-color-surface-dark-container);
}
.hb-btn[data-style="outlined"]:hover:not(:disabled){background:var(--hb-color-surface-dark-container)}
.hb-btn[aria-current="true"]{background:var(--hb-color-surface);color:var(--hb-color-on-surface)}
.hb-btn:disabled{opacity:.38;cursor:not-allowed}

/* ---------- Finding slide ---------- */
.f-top{display:flex;align-items:center;gap:var(--hb-space-16);flex:0 0 auto}
.f-title{flex:1;color:var(--hb-color-on-surface)}
.f-heur{margin:var(--hb-space-8) 0 0;color:var(--hb-color-on-surface-variant)}
.f-cols{display:grid;grid-template-columns:1fr 1fr;gap:var(--hb-space-20);
  margin-top:var(--hb-space-20);flex:1;min-height:0}
.f-col{
  border-radius:var(--hb-radius-16);padding:var(--hb-space-20);
  display:flex;flex-direction:column;min-height:0;overflow:hidden;
}
.f-col[data-state="today"]{background:var(--hb-color-warning-container)}
.f-col[data-state="changed"]{background:var(--hb-color-success-container)}
.f-labrow{display:flex;align-items:baseline;gap:var(--hb-space-12)}
.f-lab{margin:0;text-transform:uppercase;letter-spacing:.08em}
[data-state="today"] .f-lab{color:var(--hb-color-on-warning-container)}
[data-state="changed"] .f-lab{color:var(--hb-color-on-success-container)}
.f-src{margin-inline-start:auto;color:var(--hb-color-on-surface-variant)}
.f-shot{
  display:block;width:100%;aspect-ratio:var(--deck-shot-aspect);
  object-fit:cover;object-position:top center;
  margin-top:var(--hb-space-12);border-radius:var(--hb-radius-8);
  background:var(--hb-color-surface);
  border:var(--deck-hairline) solid var(--hb-color-outline-variant);
}
.f-text{margin:var(--hb-space-12) 0 0;color:var(--hb-color-on-surface)}
.f-note{margin:auto 0 0;padding-top:var(--hb-space-12)}
[data-state="today"] .f-note{color:var(--hb-color-on-warning-container)}
[data-state="changed"] .f-note{color:var(--hb-color-on-success-container)}
.f-cost{
  background:var(--hb-color-surface-container-low);
  border:var(--deck-hairline) solid var(--hb-color-outline-variant);
  border-radius:var(--hb-radius-16);
  padding:var(--hb-space-16) var(--hb-space-20);
  margin-top:var(--hb-space-20);flex:0 0 auto;
}
.f-cost .f-lab{color:var(--hb-color-on-surface-variant)}
.cost-text{margin:var(--hb-space-8) 0 0;color:var(--hb-color-on-surface)}

/* ---------- Chart: one measure, ten categories, so one hue from the primary ramp.
   Every bar is named and direct-labelled, so colour encodes nothing on its own. ---------- */
.chart{display:flex;flex-direction:column;gap:var(--hb-space-6);flex:1;justify-content:center}
.row{
  display:grid;grid-template-columns:var(--deck-chart-label-w) 1fr;align-items:center;
  gap:var(--hb-space-16);border-radius:var(--hb-radius-6);
  padding:var(--hb-space-2) var(--hb-space-6);
  margin-inline:calc(var(--hb-space-6) * -1);min-height:var(--hb-space-28);
}
.row:hover,.row:focus-visible{background:var(--hb-color-surface-container-low)}
.row-lab{text-align:end;color:var(--hb-color-on-surface-variant)}
.row:hover .row-lab{color:var(--hb-color-on-surface)}
.row.lead .row-lab{color:var(--hb-color-on-surface);font-weight:var(--hb-font-weight-bold)}
.track{display:flex;align-items:center;gap:var(--hb-space-12)}
.bar{
  height:var(--hb-space-20);border-radius:0 var(--hb-radius-4) var(--hb-radius-4) 0;
  background:var(--hb-color-primary);flex:0 0 auto;
}
[dir="rtl"] .bar{border-radius:var(--hb-radius-4) 0 0 var(--hb-radius-4)}
.row.lead .bar{background:var(--hb-color-primary-700)}
.bar-val{color:var(--hb-color-on-surface);font-weight:var(--hb-font-weight-bold)}
.row-ids{color:var(--hb-color-on-surface-variant);opacity:0;white-space:nowrap;
  overflow:hidden;min-width:0;flex:0 1 auto;transition:opacity 120ms}
.row:hover .row-ids,.row:focus-visible .row-ids{opacity:1}

/* ---------- Other slide parts ---------- */
.steps{display:flex;flex-direction:column;gap:var(--hb-space-24);flex:1;justify-content:center}
.step{display:flex;gap:var(--hb-space-20);align-items:flex-start}
.step-n{
  width:var(--hb-space-48);height:var(--hb-space-48);flex:0 0 var(--hb-space-48);
  border-radius:var(--hb-radius-full);background:var(--hb-color-primary-700);
  color:var(--hb-color-on-primary);display:grid;place-items:center;
}
.legend-row{display:flex;align-items:center;gap:var(--hb-space-20);margin-bottom:var(--hb-space-20)}
.legend-row .hb-chip{min-width:var(--deck-legend-chip-w);justify-content:center}
.legend-row span:last-child{color:var(--hb-color-on-surface-variant)}
.wave-list{margin:var(--hb-space-16) 0 0;padding-inline-start:var(--hb-space-20);color:var(--hb-color-on-surface)}
.wave-list li{margin-bottom:var(--hb-space-8)}
.wave-list li:last-child{margin-bottom:0}
.wave-note{margin:auto 0 0;padding-top:var(--hb-space-16);color:var(--hb-color-on-surface-variant)}
.link-box{
  display:block;background:var(--hb-color-surface-dark-container);
  border-radius:var(--hb-radius-12);padding:var(--hb-space-20) var(--hb-space-24);
  color:var(--hb-color-on-surface-dark);text-decoration:none;word-break:break-all;
}
.link-box:hover{background:var(--hb-color-primary-800)}
.divider-n{color:var(--hb-color-primary-300);margin-bottom:var(--hb-space-4);display:block}
.foot{
  position:absolute;inset-inline:var(--hb-space-64);bottom:var(--hb-space-24);
  display:flex;color:var(--hb-color-on-surface-variant);
}
[data-ground="dark"] .foot{color:var(--hb-color-primary-200)}
.foot span:last-child{margin-inline-start:auto}

/* ---------- Deck chrome (proposal) — a presentation shell is not a Highbase
   component, so this is built from tokens rather than from the library. ---------- */
#bar{
  position:fixed;inset-inline:0;bottom:0;z-index:20;
  display:flex;align-items:center;gap:var(--hb-space-12);
  padding:var(--hb-space-12) var(--hb-space-20);
  background:var(--hb-color-surface-dark);
  border-top:var(--deck-hairline) solid var(--hb-color-surface-dark-container);
  color:var(--hb-color-on-surface-dark);
}
#count{color:var(--hb-color-on-surface-dark);min-width:var(--hb-space-72);text-align:center}
#title-now{
  color:var(--hb-color-primary-200);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;flex:1;min-width:0;
}
#progress{
  position:fixed;inset-inline-start:0;top:0;height:var(--hb-space-4);
  background:var(--hb-color-primary-400);z-index:21;transition:width 180ms ease;
}

/* ---------- Overview ---------- */
#grid{
  position:fixed;inset:0;z-index:30;background:var(--hb-color-primary-950);
  overflow:auto;padding:var(--hb-space-24) var(--hb-space-24) var(--hb-space-76);
  display:none;grid-template-columns:repeat(auto-fill,minmax(var(--deck-thumb-min),1fr));gap:var(--hb-space-16);
}
#grid.on{display:grid}
.thumb{
  background:var(--hb-color-surface);border-radius:var(--hb-radius-6);
  aspect-ratio:16/9;position:relative;overflow:hidden;cursor:pointer;
