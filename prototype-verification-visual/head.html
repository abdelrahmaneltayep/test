<title>HIGHBASE Verification — 3 Visual Versions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700;800&family=Noto+Kufi+Arabic:wght@400;500;600;700&display=swap">
<style>
/*__DS_CSS__*/

/* ===========================================================================
   Prototype layer — page composition only.
   Every component above comes from the Highbase repo verbatim. Nothing here
   redefines a component; it places them. No raw hex, no physical left/right —
   logical properties throughout. Page geometry the system has no token for is
   named --proto-* and tagged (proposal).
   =========================================================================== */
:root{
  color-scheme:light;
  /* (proposal) page geometry — not part of the Highbase system */
  --proto-page-max:1320px;
  --proto-rail-w:344px;
  --proto-hairline:1px;
  --proto-bar-h:48px;        /* (proposal) the review bar's own height, so the Header can stick beneath it */
  --proto-footer-logo:43px;   /* (proposal) Logo README: "footer: lockup 43 (proposal — confirm)" */
  --proto-doc-thumb:64px;     /* (proposal) a document preview is a thumbnail, never a full-width image */
  --proto-qr:148px;           /* (proposal) the smallest size a phone camera reads reliably at arm's length */
}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;background:var(--hb-color-surface-container-low);
  color:var(--hb-color-on-surface);font-family:var(--hb-font-family-latin);
  -webkit-font-smoothing:antialiased;
}
[dir="rtl"] body,[lang="ar"] body{font-family:var(--hb-font-family-arabic)}
img{max-width:100%;display:block}
.num{font-variant-numeric:tabular-nums lining-nums}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:where(a,button,input,select,textarea,[tabindex]):focus-visible{
  outline:2px solid var(--hb-color-primary);outline-offset:2px;border-radius:var(--hb-radius-4);
}
hr.hb-divider{margin:0}
h1,h2,h3,h4,p{margin:0}

/* The Drawer layer is a full-viewport flex container. Hosting it in a <dialog>
   for the top layer and focus trap means neutralising the dialog's own box so
   the component's own sizing governs. */
dialog.hb-drawer-layer{
  max-width:none;max-height:none;width:100%;height:100%;
  margin:0;padding:0;border:0;background:var(--hb-color-scrim);
}
dialog.hb-drawer-layer::backdrop{background:transparent}
/* .hb-drawer-layer sets display:flex, which beats the UA rule that hides a
   closed <dialog> — without this the scrim covers the page permanently. */
dialog.hb-drawer-layer:not([open]){display:none}
/* The Confirmation Dialog is one question, two answers: it sits centred over the scrim. */
dialog.proto-confirm{margin:auto;padding:0;border:0;background:transparent;max-width:100%}
dialog.proto-confirm::backdrop{background:var(--hb-color-scrim)}
/* A native <select> draws its own arrow; the Field already supplies one. */
.hb-field__input:is(select){appearance:none;-webkit-appearance:none;background:none;border:0;
  flex:1 1 auto;min-width:0;font:inherit;color:inherit;outline:none}

/* ---------- Prototype chrome (proposal) — a review shell, not product UI ---------- */
.proto-bar{
  position:sticky;top:0;z-index:80;background:var(--hb-color-surface-dark);
  color:var(--hb-color-on-surface-dark);
  border-bottom:var(--proto-hairline) solid var(--hb-color-surface-dark-container);
}
.proto-bar__in{
  max-width:var(--proto-page-max);margin:0 auto;
  padding:var(--hb-space-8) var(--hb-space-20);
  display:flex;align-items:center;gap:var(--hb-space-16);flex-wrap:wrap;
}
.proto-brand{display:flex;align-items:center;gap:var(--hb-space-8)}
.proto-nav{display:flex;gap:var(--hb-space-4);flex-wrap:wrap}
.proto-bar .spacer{flex:1}
/* On the dark review bar the Button atom's own intent colours land at 2.27:1, so the
   chrome re-colours its own buttons against surface-dark. Prototype chrome only. (proposal) */
.proto-bar .hb-btn{background:transparent;color:var(--hb-color-on-surface-dark);border-color:var(--hb-color-on-surface-dark)}
.proto-bar .hb-btn:hover{background:var(--hb-color-surface-dark-container)}
.proto-nav .hb-btn[aria-current="true"]{background:var(--hb-color-on-surface-dark);color:var(--hb-color-surface-dark)}
.proto-bar .hb-btn[aria-pressed="true"]{background:var(--hb-color-on-surface-dark);color:var(--hb-color-surface-dark)}

/* ---------- Page shell ---------- */
.site{max-width:var(--proto-page-max);margin:0 auto;padding:0 var(--hb-space-20) var(--hb-space-72)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) var(--proto-rail-w);gap:var(--hb-space-24);align-items:start}
.stack{display:flex;flex-direction:column;gap:var(--hb-space-16)}
.panel{
  background:var(--hb-color-surface);border-radius:var(--hb-radius-12);
  border:var(--proto-hairline) solid var(--hb-color-outline-variant);
}
.panel__head{
  display:flex;align-items:center;gap:var(--hb-space-12);flex-wrap:wrap;
  padding:var(--hb-space-16) var(--hb-space-20);
  border-bottom:var(--proto-hairline) solid var(--hb-color-surface-dim);
}
.panel__head h2{flex:1;min-width:0}
.panel__body{padding:var(--hb-space-20)}
.panel__foot{
  display:flex;align-items:center;gap:var(--hb-space-12);flex-wrap:wrap;
  padding:var(--hb-space-12) var(--hb-space-20);
  border-top:var(--proto-hairline) solid var(--hb-color-surface-dim);
  background:var(--hb-color-surface-container-low);
  border-radius:0 0 var(--hb-radius-12) var(--hb-radius-12);
}
.row{display:flex;align-items:center;gap:var(--hb-space-12);flex-wrap:wrap}
.row-end{display:flex;align-items:center;gap:var(--hb-space-12);flex-wrap:wrap;justify-content:flex-end}
.muted{color:var(--hb-color-on-surface-variant)}
.strong{color:var(--hb-color-on-surface)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--hb-space-16)}
.rail{position:sticky;top:calc(var(--proto-bar-h) + var(--hb-space-104));display:flex;flex-direction:column;gap:var(--hb-space-16)}
.hb-btn.proto-block{width:100%;justify-content:center} /* (proposal) the Button has no full-width variant */

/* ---------- Stepper (proposal) — the system has no stepper; built from tokens ---------- */
.steps{display:flex;align-items:center;gap:var(--hb-space-8);flex-wrap:wrap;padding:var(--hb-space-16) 0 var(--hb-space-4)}
.step{display:flex;align-items:center;gap:var(--hb-space-8);color:var(--hb-color-on-surface-variant)}
.step__no{
  width:var(--hb-space-24);height:var(--hb-space-24);flex:0 0 var(--hb-space-24);
  border-radius:var(--hb-radius-full);display:grid;place-items:center;
  background:var(--hb-color-surface-container);color:var(--hb-color-on-surface-variant);
}
.step__no .hb-i{font-size:var(--hb-space-16)}
.step[data-state="done"]{color:var(--hb-color-success-dark)}
.step[data-state="done"] .step__no{background:var(--hb-color-success);color:var(--hb-color-on-success)}
.step[data-state="now"]{color:var(--hb-color-primary-700)}
.step[data-state="now"] .step__no{background:var(--hb-color-primary-700);color:var(--hb-color-on-primary)}
.step__bar{flex:1;min-width:var(--hb-space-20);height:var(--hb-space-2);border-radius:var(--hb-radius-full);background:var(--hb-color-surface-container)}
.step[data-state="done"] + .step__bar{background:var(--hb-color-success)}

/* ---------- Verification: saved details, inline edit, upload zones ---------- */
.saved{display:flex;flex-direction:column;gap:var(--hb-space-12)}
.saved__head{display:flex;align-items:center;gap:var(--hb-space-8);flex-wrap:wrap}
.saved__head .spacer,.panel__foot .spacer{flex:1}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--hb-space-12) var(--hb-space-24);margin:0}
.kv__row{display:flex;flex-direction:column;gap:var(--hb-space-2);min-width:0}
.kv__row dt{margin:0;color:var(--hb-color-on-surface-variant)}
.kv__row dd{margin:0;color:var(--hb-color-on-surface);overflow-wrap:anywhere}
.editform{display:flex;flex-direction:column;gap:var(--hb-space-16);padding:var(--hb-space-16);border-radius:var(--hb-radius-8);
  background:var(--hb-color-surface-container-low);border:var(--proto-hairline) solid var(--hb-color-outline-variant)}
.substeps{display:flex;gap:var(--hb-space-8);flex-wrap:wrap}
.substep{display:inline-flex;align-items:center;gap:var(--hb-space-8);padding:var(--hb-space-6) var(--hb-space-12) var(--hb-space-6) var(--hb-space-6);
  border-radius:var(--hb-radius-full);border:var(--proto-hairline) solid var(--hb-color-outline-variant);background:var(--hb-color-surface);
  color:var(--hb-color-on-surface-variant);text-decoration:none}
.substep[data-state="now"]{color:var(--hb-color-primary-700);border-color:var(--hb-color-primary-300)}
.substep[data-state="now"] .step__no{background:var(--hb-color-primary-700);color:var(--hb-color-on-primary)}
.upzone{display:flex;flex-direction:column;gap:var(--hb-space-8)}
.upzone__head{display:flex;align-items:center;gap:var(--hb-space-8);flex-wrap:wrap}
.upzone .hb-upload[data-state="ready"],.upzone .hb-upload[data-state="error"]{cursor:pointer;padding-block:var(--hb-space-24)}
.upzone .hb-upload__file{flex-wrap:wrap}
.upzone__bar{display:block;height:100%;width:0;background:var(--hb-color-primary);border-radius:inherit;
  /* (proposal) motion is undefined in the system — placeholder */
  animation:proto-fill 900ms ease-out forwards}
@keyframes proto-fill{to{width:100%}}
.map__act{position:absolute;inset-inline-end:var(--hb-space-8);top:var(--hb-space-8)}
.hb-phonefield[data-state="error"] .hb-field__control{border-color:var(--hb-color-error)}

/* ---------- Verification: deliver-to card ---------- */
.addr{display:grid;grid-template-columns:minmax(0,1fr) 176px;gap:var(--hb-space-16);align-items:start}
.addr__lines{display:flex;flex-direction:column;gap:var(--hb-space-4)}
.addr__meta{display:flex;gap:var(--hb-space-16);flex-wrap:wrap;margin-top:var(--hb-space-8)}
.addr__meta span{display:inline-flex;align-items:center;gap:var(--hb-space-6);color:var(--hb-color-on-surface-variant)}
.addr__meta .hb-i{font-size:var(--hb-space-16)}
.map{
  height:160px;border-radius:var(--hb-radius-8);
  border:var(--proto-hairline) solid var(--hb-color-outline-variant);
  background:var(--hb-color-primary-50);display:grid;place-items:center;position:relative;overflow:hidden;
}
.map .hb-i{font-size:var(--hb-space-28);color:var(--hb-color-primary-700)}
.map__label{
  position:absolute;inset-inline-start:var(--hb-space-8);bottom:var(--hb-space-8);
  background:var(--hb-color-surface);border:var(--proto-hairline) solid var(--hb-color-outline-variant);
  padding:var(--hb-space-2) var(--hb-space-8);border-radius:var(--hb-radius-full);
  color:var(--hb-color-on-surface-variant);
}

/* ---------- Verification: business documents — the List Item molecule carries each row ---------- */
.docs .hb-li{padding-inline:0}
.docs .hb-li:last-child{border-bottom:0}
.doc__prev{
  width:var(--hb-space-40);height:var(--hb-space-48);flex:0 0 var(--hb-space-40);
  border-radius:var(--hb-radius-6);border:var(--proto-hairline) solid var(--hb-color-outline-variant);
  background:var(--hb-color-surface-container-low);display:grid;place-items:center;overflow:hidden;
  color:var(--hb-color-on-surface-variant);
}
.doc__prev img{width:100%;height:100%;object-fit:cover}
.doc__meta{display:flex;align-items:center;gap:var(--hb-space-8);flex-wrap:wrap;color:var(--hb-color-on-surface-variant)}
.verified{
  display:flex;align-items:center;gap:var(--hb-space-12);flex-wrap:wrap;
  padding:var(--hb-space-12) var(--hb-space-16);border-radius:var(--hb-radius-8);
  background:var(--hb-color-success-container);color:var(--hb-color-on-success-container);
  border:var(--proto-hairline) solid var(--hb-color-success-outline);
}
.verified .hb-i{font-size:var(--hb-space-20);color:var(--hb-color-success-dark)}

/* ---------- Verification: payment method options ---------- */
.opt{
  display:flex;align-items:flex-start;gap:var(--hb-space-12);
  padding:var(--hb-space-16);border:var(--proto-hairline) solid var(--hb-color-outline-variant);
  border-radius:var(--hb-radius-12);margin-bottom:var(--hb-space-8);
  background:var(--hb-color-surface);cursor:pointer;
}
.opt:hover{border-color:var(--hb-color-primary-300)}
.opt:has(input:checked){border-color:var(--hb-color-primary);background:var(--hb-color-primary-50)}
.opt[data-disabled]{cursor:not-allowed}
.opt[data-disabled] .opt__title,.opt[data-disabled] .opt__desc{color:var(--hb-color-on-surface-variant)}
.opt__main{flex:1;min-width:0}
.opt__title{margin:0;display:flex;align-items:center;gap:var(--hb-space-8);flex-wrap:wrap}
.opt__desc{margin:var(--hb-space-2) 0 0;color:var(--hb-color-on-surface-variant)}
.opt__price{margin-inline-start:auto;white-space:nowrap}

/* ---------- Pre-flight checks (proposal) ---------- */
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--hb-space-8)}
.checks li{display:flex;align-items:center;gap:var(--hb-space-8);color:var(--hb-color-on-surface-variant)}
.checks .hb-i{font-size:var(--hb-space-16);color:var(--hb-color-success)}
.checks li[data-state="warn"] .hb-i{color:var(--hb-color-warning-dark)}

/* ---------- Summary rail ---------- */
.sum{display:flex;flex-direction:column;gap:var(--hb-space-8);margin:0}
.sum__row{display:flex;align-items:baseline;gap:var(--hb-space-12)}
.sum__row dt{margin:0;color:var(--hb-color-on-surface-variant)}
.sum__row dd{margin:0;margin-inline-start:auto;color:var(--hb-color-on-surface);font-weight:var(--hb-font-weight-semibold)}
.sum__row[data-save] dd{color:var(--hb-color-success-dark)}
.sum__total{display:flex;align-items:flex-start;gap:var(--hb-space-12);padding-top:var(--hb-space-4)}
.sum__total dt{margin:0;padding-top:var(--hb-space-4)}
.sum__total dd{margin:0;margin-inline-start:auto;text-align:end;display:flex;flex-direction:column;align-items:flex-end}
.lines{display:flex;flex-direction:column;gap:var(--hb-space-8)}
.line{display:flex;align-items:center;gap:var(--hb-space-12)}
.line__thumb{width:var(--hb-space-36);height:var(--hb-space-36);flex:0 0 var(--hb-space-36);border-radius:var(--hb-radius-6);
  border:var(--proto-hairline) solid var(--hb-color-outline-variant);display:grid;place-items:center;color:var(--hb-color-on-surface-variant)}
.line__name{flex:1;min-width:0}
.trust{display:flex;flex-direction:column;gap:var(--hb-space-8);margin-top:var(--hb-space-8)}
.trust div{display:flex;align-items:center;gap:var(--hb-space-8);color:var(--hb-color-on-surface-variant)}
.trust .hb-i{font-size:var(--hb-space-16);color:var(--hb-color-success)}

/* ---------- Order placed ---------- */
.hero-ok{text-align:center;padding:var(--hb-space-28) var(--hb-space-20) var(--hb-space-8)}
.hero-ok__mark{
  width:var(--hb-space-56);height:var(--hb-space-56);border-radius:var(--hb-radius-full);
  margin:0 auto var(--hb-space-12);background:var(--hb-color-success);
  color:var(--hb-color-on-success);display:grid;place-items:center;
}
.hero-ok__mark .hb-i{font-size:var(--hb-space-28)}
.order-ref{
  display:inline-flex;align-items:center;gap:var(--hb-space-8);margin-top:var(--hb-space-12);flex-wrap:wrap;justify-content:center;
  padding:var(--hb-space-8) var(--hb-space-12);border-radius:var(--hb-radius-full);
  border:var(--proto-hairline) solid var(--hb-color-outline-variant);background:var(--hb-color-surface);
}
.progress{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--hb-space-8);padding:var(--hb-space-16) var(--hb-space-20)}
.progress li{list-style:none;display:flex;flex-direction:column;gap:var(--hb-space-8);min-width:0}
.progress__bar{height:var(--hb-space-6);border-radius:var(--hb-radius-full);background:var(--hb-color-surface-container)}
.progress li[data-state="done"] .progress__bar{background:var(--hb-color-success)}
.progress li[data-state="now"] .progress__bar{background:var(--hb-color-warning)}
.progress h4{color:var(--hb-color-on-surface-variant)}
.progress li[data-state] h4{color:var(--hb-color-on-surface)}
.progress p{color:var(--hb-color-on-surface-variant)}
.pay-head{
  display:flex;align-items:center;gap:var(--hb-space-12);flex-wrap:wrap;
  padding:var(--hb-space-16) var(--hb-space-20);
  background:var(--hb-color-warning-container);
  border-bottom:var(--proto-hairline) solid var(--hb-color-warning-outline);
  border-radius:var(--hb-radius-12) var(--hb-radius-12) 0 0;
  color:var(--hb-color-on-warning-container);
}
.pay-head .hb-i{font-size:var(--hb-space-24);color:var(--hb-color-warning-dark)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--hb-space-12)}
.facts .hb-stat__value{white-space:nowrap}
.copyrow{
  display:flex;align-items:center;gap:var(--hb-space-12);
  padding:var(--hb-space-12);border:var(--proto-hairline) solid var(--hb-color-outline-variant);
  border-radius:var(--hb-radius-8);background:var(--hb-color-surface);
}
.copyrow dt{margin:0;flex:0 0 112px;color:var(--hb-color-on-surface-variant)}
.copyrow dd{margin:0;flex:1;min-width:0;word-break:break-all;font-weight:var(--hb-font-weight-semibold)}
.copyrows{display:flex;flex-direction:column;gap:var(--hb-space-8);margin:0}
.qr{
  border:var(--proto-hairline) dashed var(--hb-color-outline);
  border-radius:var(--hb-radius-12);padding:var(--hb-space-16);
  display:grid;place-items:center;gap:var(--hb-space-8);background:var(--hb-color-surface);text-align:center;
}
.qr__code{width:var(--proto-qr);height:var(--proto-qr);color:var(--hb-color-on-surface)}
.receipt-prev{
  width:var(--proto-doc-thumb);height:var(--proto-doc-thumb);flex:0 0 var(--proto-doc-thumb);border-radius:var(--hb-radius-8);
  border:var(--proto-hairline) solid var(--hb-color-outline-variant);overflow:hidden;
  display:grid;place-items:center;background:var(--hb-color-surface-container-low);color:var(--hb-color-on-surface-variant);
}
.receipt-prev img{width:100%;height:100%;object-fit:cover}
.hb-upload.is-over{background:var(--hb-color-primary-container-low);border-color:var(--hb-color-primary)}
.hb-upload__icon .hb-i{font-size:var(--hb-space-40)}
.share{display:flex;gap:var(--hb-space-8);flex-wrap:wrap}

/* ---------- Evaluation sheet ---------- */
.doc-page{max-width:960px;margin:0 auto}
.doc-page h1{margin:var(--hb-space-24) 0 var(--hb-space-8)}
.doc-page h2{margin:var(--hb-space-32) 0 var(--hb-space-12)}
.doc-page p{margin:0 0 var(--hb-space-12);color:var(--hb-color-on-surface-variant)}
.sev{display:inline-flex;align-items:center;justify-content:center;width:var(--hb-space-24);height:var(--hb-space-24);border-radius:var(--hb-radius-full);font-weight:var(--hb-font-weight-bold)}
.sev[data-sev="4"],.sev[data-sev="3"]{background:var(--hb-color-error-container);color:var(--hb-color-on-error-container)}
.sev[data-sev="2"]{background:var(--hb-color-warning-container);color:var(--hb-color-on-warning-container)}
.sev[data-sev="1"]{background:var(--hb-color-info-container);color:var(--hb-color-on-info-container)}
.legend{display:flex;gap:var(--hb-space-16);flex-wrap:wrap;margin:0 0 var(--hb-space-16)}
.legend span{display:inline-flex;align-items:center;gap:var(--hb-space-8)}


/* ---------- Version A · Steps (accordion) ---------- */
.acc{display:flex;flex-direction:column;gap:var(--hb-space-12)}
.acc__item{background:var(--hb-color-surface);border-radius:var(--hb-radius-12);border:var(--proto-hairline) solid var(--hb-color-outline-variant);overflow:hidden}
.acc__item[data-state="now"]{border-color:var(--hb-color-primary);box-shadow:var(--hb-elevation-level-2)}
.acc__head{display:flex;align-items:center;gap:var(--hb-space-12);width:100%;padding:var(--hb-space-16) var(--hb-space-20);border:0;background:none;text-align:start;font:inherit;color:inherit;cursor:pointer}
.acc__head:hover{background:var(--hb-color-surface-container-low)}
.acc__no{width:var(--hb-space-32);height:var(--hb-space-32);flex:0 0 var(--hb-space-32);border-radius:var(--hb-radius-full);display:grid;place-items:center;background:var(--hb-color-surface-container);color:var(--hb-color-on-surface-variant)}
.acc__item[data-state="done"] .acc__no{background:var(--hb-color-success);color:var(--hb-color-on-success)}
.acc__item[data-state="now"] .acc__no{background:var(--hb-color-primary-700);color:var(--hb-color-on-primary)}
.acc__no .hb-i{font-size:var(--hb-space-16)}
.acc__titles{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--hb-space-2)}
.acc__summary{color:var(--hb-color-on-surface-variant);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc__body{padding:0 var(--hb-space-20) var(--hb-space-20);border-top:var(--proto-hairline) solid var(--hb-color-surface-dim)}
.acc__body > :first-child{margin-top:var(--hb-space-16)}
.acc__foot{display:flex;justify-content:flex-end;gap:var(--hb-space-8);margin-top:var(--hb-space-16)}
.acc__chev{color:var(--hb-color-on-surface-variant);transition:transform 160ms} /* (proposal) motion placeholder */
.acc__item[data-state="now"] .acc__chev{transform:rotate(180deg)}

/* ---------- Version B · Confirm (compact cards that open on demand) ---------- */
