<meta charset="utf-8">
<script>document.documentElement.dir='rtl';document.documentElement.lang='ar';</script>
<title>خرائط مستودعات سلة 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{
  direction:rtl;
  color-scheme:light;
  --brand:#004956; --ink:#1f2a2e; --ink-2:#4b5a5f; --muted:#7a878b;
  --mint:#a8f0dc; --mint-2:#76e8cd; --mint-bg:#e6fbf4; --mint-bg2:#d2f6ea; --mint-line:#bdeedf;
  --orange:#f2663a; --line:#e6ebec; --page:#f4f6f6;
  --font:'PingARLT','IBM Plex Sans Arabic','PT Sans',system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.6}
h1,h2,p{margin:0} h1,h2{text-wrap:balance}
button{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:24px;padding-block:32px 80px}
.intro h1{font-size:26px;color:var(--brand)}
.intro p{color:var(--ink-2);max-width:70ch;margin-top:4px}
.jump{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.jump a{border:1px solid var(--line);background:#fff;border-radius:20px;padding:3px 11px;font-size:12px;text-decoration:none;color:var(--brand)}
.opt{margin-top:40px;scroll-margin-top:16px}
.opt-head{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:12px}
.opt-no{font-weight:700;color:var(--brand);background:var(--mint-bg2);border-radius:6px;padding:0 8px;font-size:13px}
.opt-head h2{font-size:17px}
.opt-head p{color:var(--muted);font-size:13px;flex-basis:100%}
.frame{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px}
.bn{position:relative;border-radius:18px;overflow:hidden;background:linear-gradient(115deg,var(--mint-bg2) 0%,var(--mint-bg) 45%,#f2fdf9 100%);border:1.5px solid var(--mint-line);
  display:grid;grid-template-columns:1fr 1.1fr;gap:24px;padding:30px 36px;align-items:center}
.bn.dark{background:radial-gradient(120% 140% at 20% 0%,#0b6a7a 0%,#004956 45%,#00323c 100%);border-color:#0b5f6c}
.bn.dark .h{color:#fff} .bn.dark .sub{color:#c7e4e8} .bn.dark .sub em{color:#ffb08f}
.bn-x{position:absolute;top:12px;inset-inline-end:12px;border:0;background:rgba(255,255,255,.75);border-radius:50%;width:28px;height:28px;cursor:pointer;display:grid;place-items:center;color:var(--ink-2);z-index:2}
.h{color:var(--brand);font-weight:700;font-size:clamp(22px,2.5vw,30px);line-height:1.35}
.sub{color:var(--ink-2);font-size:clamp(14px,1.25vw,16px);margin-top:10px;max-width:48ch}
.sub em{font-style:normal;color:var(--orange);font-weight:600}
.cta{display:inline-flex;align-items:center;gap:8px;border:0;background:var(--mint);color:var(--brand);font-weight:700;border-radius:12px;padding:12px 24px;cursor:pointer;font-size:15px;text-decoration:none;white-space:nowrap}
.cta:hover{background:var(--mint-2)}
.actions{margin-top:22px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.art{width:100%;max-width:600px;justify-self:center}
.art svg{width:100%;height:auto;display:block;overflow:visible}
.dl{display:flex;gap:12px;align-items:center;margin-top:12px;flex-wrap:wrap}
.copy{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 14px;cursor:pointer;color:var(--brand);font-weight:600}
.copy:hover{border-color:var(--mint-2)}
.fname{font-size:12px;color:var(--muted);direction:ltr}
@media (max-width:900px){.bn{grid-template-columns:1fr}}
@media (max-width:640px){.wrap{padding-inline:16px}.frame{padding:10px}.bn{padding:22px 18px}}
</style>

<div class="wrap">
  <header class="intro">
    <h1>خريطة مستودعات سلة: 10 خيارات بأسلوب 3D</h1>
    <p>أيقونات مجسّمة مرسومة كـ SVG (مستودع، صندوق، شاحنة، دبوس، عملات، ساعة، درع، جوال) فوق خريطة المملكة بعمق وظلال. تحت كل خيار زر لنسخ الرسم، وملفات SVG الجاهزة في مجلد <span dir="ltr">map-svg</span>.</p>
    <nav class="jump" id="jump" aria-label="انتقل إلى خيار"></nav>
  </header>
  <div id="list"></div>
</div>

<script>
/* ---------- geography (approximate) ---------- */
const K=20, LON0=34.3, LAT0=32.6;
const P=(lon,lat)=>[+((lon-LON0)*K).toFixed(1),+((LAT0-lat)*K).toFixed(1)];
const BORDER=[[34.95,29.36],[36.07,29.19],[36.5,29.5],[37.5,30.0],[38.0,30.5],[37.0,31.5],[39.0,32.0],[39.2,32.15],[40.4,31.9],[41.4,31.4],[42.1,31.1],[44.7,29.2],[46.5,29.1],[47.7,28.5],[48.4,28.55],
 [48.8,27.7],[49.3,27.1],[50.1,26.7],[50.2,26.2],[50.1,25.6],[50.6,25.0],[50.8,24.75],[51.6,24.25],[52.0,23.0],[55.0,22.7],[55.7,22.0],[55.0,20.0],[52.0,19.0],[49.1,18.6],[48.2,18.2],[47.0,17.0],[46.4,17.2],[45.2,17.4],[44.0,17.4],[43.4,17.5],[43.1,16.7],[42.8,16.4],
 [42.6,16.8],[42.2,17.8],[41.2,19.0],[40.5,20.2],[39.6,21.3],[39.1,22.0],[38.5,23.6],[37.5,24.6],[37.2,25.2],[36.5,26.0],[35.5,27.5],[34.8,28.1],[34.6,28.4]];
const PATH='M'+BORDER.map(p=>P(...p).join(' ')).join(' L')+' Z';
const VB='0 0 440 340';
const C={ // city: [lon,lat]
  ruh:{n:'الرياض',ll:[46.72,24.69]}, jed:{n:'جدة',ll:[39.17,21.54]}, mak:{n:'مكة المكرمة',ll:[39.83,21.42]}, med:{n:'المدينة المنورة',ll:[39.61,24.47]},
  dmm:{n:'الدمام',ll:[50.10,26.43]}, abh:{n:'أبها',ll:[42.5,18.22]}, tbk:{n:'تبوك',ll:[36.57,28.38]}, bur:{n:'بريدة',ll:[43.97,26.33]}, hail:{n:'حائل',ll:[41.69,27.52]}, jaz:{n:'جازان',ll:[42.55,16.89]}, hof:{n:'الأحساء',ll:[49.59,25.38]}, taif:{n:'الطائف',ll:[40.42,21.27]},
};
const xy=id=>P(...C[id].ll);
const WH=[ // warehouses
  {id:'ruh',name:'حي السليمانية',price:4,svc:['تخزين','تجهيز','تبريد','مرتجعات'],sla:'نفس اليوم داخل الرياض'},
  {id:'jed',name:'حي الأمير فواز',price:5,svc:['تخزين','تجهيز','قابل للكسر'],sla:'نفس اليوم داخل جدة'},
  {id:'dmm',name:'حي الفيصلية',price:6,svc:['تخزين','تجهيز','تبريد'],sla:'نفس اليوم داخل الدمام والخبر'},
  {id:'med',name:'حي النرجس',price:5,svc:['تخزين','تجهيز'],sla:'اليوم التالي'},
  {id:'abh',name:'حي المنسك',price:6,svc:['تخزين','تجهيز','مرتجعات'],sla:'اليوم التالي'},
];



/* ================= shared defs: gradients & filters ================= */
const DEFS=`
<linearGradient id="gTop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1fdf9"/><stop offset=".55" stop-color="#d4f6ea"/><stop offset="1" stop-color="#b7ecdb"/></linearGradient>
<linearGradient id="gTopDark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b7d8c"/><stop offset="1" stop-color="#0a5866"/></linearGradient>
<linearGradient id="gBrand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#157a8a"/><stop offset="1" stop-color="#003a45"/></linearGradient>
<linearGradient id="gOrange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffa379"/><stop offset="1" stop-color="#dc4a1f"/></linearGradient>
<linearGradient id="gMint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c9f8eb"/><stop offset="1" stop-color="#63d6b8"/></linearGradient>
<linearGradient id="gWallL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e2ebed"/></linearGradient>
<linearGradient id="gWallR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d3e1e4"/><stop offset="1" stop-color="#b3c7cc"/></linearGradient>
<linearGradient id="gBoxT" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbe8cc"/><stop offset="1" stop-color="#f0d1a3"/></linearGradient>
<linearGradient id="gBoxL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ebc48e"/><stop offset="1" stop-color="#dcae6e"/></linearGradient>
<linearGradient id="gBoxR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d4a262"/><stop offset="1" stop-color="#bb864a"/></linearGradient>
<radialGradient id="gShine" cx=".32" cy=".3" r=".7"><stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset=".4" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="gGlass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".92"/><stop offset="1" stop-color="#fff" stop-opacity=".62"/></linearGradient>
<linearGradient id="gArc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#63d6b8"/><stop offset="1" stop-color="#f2663a"/></linearGradient>
<filter id="blur8" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
<filter id="blur3" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
<filter id="sh" x="-20%" y="-40%" width="140%" height="180%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#004956" flood-opacity=".18"/></filter>`;
const FONT="IBM Plex Sans Arabic, PingARLT, sans-serif";
const svgWrap=(vb,inner)=>`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb}" role="img" aria-label="رسم مجسّم لخريطة مستودعات سلة" direction="ltr"><defs>${DEFS}</defs>${inner}</svg>`;
const f1=n=>+n.toFixed(1);
const pts=a=>a.map(p=>p.map(f1).join(',')).join(' ');
function T_(x,y,z=0){return [x,y-z]}
function txt(x,y,t,{size=12,w=700,color='#004956',anchor='middle'}={}){return `<text x="${f1(x)}" y="${f1(y)}" text-anchor="${anchor}" direction="rtl" font-family="${FONT}" font-size="${size}" font-weight="${w}" fill="${color}" style="unicode-bidi:embed">${t}</text>`;}
function chip(x,y,t,{color='#004956',size=11,bg='#fff'}={}){const w=t.length*size*.6+18;return `<g filter="url(#sh)"><rect x="${f1(x-w/2)}" y="${f1(y-12)}" width="${f1(w)}" height="23" rx="11.5" fill="${bg}"/></g>${txt(x,y+4,t,{size,color})}`;}
const shadow=(x,y,rx,ry,o=.18)=>`<ellipse cx="${f1(x)}" cy="${f1(y)}" rx="${f1(rx)}" ry="${f1(ry)}" fill="#003a45" opacity="${o}" filter="url(#blur3)"/>`;

/* ================= map slab (oblique 3D) ================= */
function slab({th=-12,sq=.56,s=1,ox=0,oy=0,thick=16,top='url(#gTop)',side=['#3fa88d','#9fe0cd'],edge='#fff'}={}){
  const r=th*Math.PI/180, a=Math.cos(r), b=sq*Math.sin(r), c=-Math.sin(r), d=sq*Math.cos(r);
  const T=(x,y)=>[a*x*s+c*y*s+ox, b*x*s+d*y*s+oy];
  const poly=BORDER.map(p=>T(...P(...p)));
  const xs=poly.map(p=>p[0]), ys=poly.map(p=>p[1]);
  const bb={x0:Math.min(...xs),x1:Math.max(...xs),y0:Math.min(...ys),y1:Math.max(...ys)};
  const mix=(t)=>{const h=v=>parseInt(v,16);const A=side[0],B=side[1];const ch=i=>Math.round(h(A.substr(1+2*i,2))*(1-t)+h(B.substr(1+2*i,2))*t).toString(16).padStart(2,'0');return '#'+ch(0)+ch(1)+ch(2);};
  let layers='';for(let k=thick;k>=1;k-=2){layers+=`<polygon points="${pts(poly.map(([x,y])=>[x,y+k]))}" fill="${mix(1-k/thick)}"/>`;}
  const svg=`${shadow((bb.x0+bb.x1)/2,bb.y1+thick+6,(bb.x1-bb.x0)*.42,14,.22)}${layers}<polygon points="${pts(poly)}" fill="${top}" stroke="${edge}" stroke-width="1.6" stroke-linejoin="round"/>`;
  return {svg,T,poly,bb,at:id=>T(...xy(id))};
}
const vbOf=(bb,[l,t,r,b])=>`${f1(bb.x0-l)} ${f1(bb.y0-t)} ${f1(bb.x1-bb.x0+l+r)} ${f1(bb.y1-bb.y0+t+b)}`;

/* ================= 3D icon library ================= */
// isometric prism: front-bottom corner at (x,y); w along right axis, d along left axis, h up
function prism(x,y,w,d,h,{t,l,r,stroke='none'}){
  const R=[.866,-.5], L=[-.866,-.5];
  const fb=[x,y], rb=[x+R[0]*w,y+R[1]*w], lb=[x+L[0]*d,y+L[1]*d];
  const f=[x,y-h], rr=[rb[0],rb[1]-h], ll=[lb[0],lb[1]-h], bk=[rr[0]+L[0]*d,rr[1]+L[1]*d];
  return {svg:`<polygon points="${pts([fb,lb,ll,f])}" fill="${l}" stroke="${stroke}"/><polygon points="${pts([fb,rb,rr,f])}" fill="${r}" stroke="${stroke}"/><polygon points="${pts([f,rr,bk,ll])}" fill="${t}" stroke="${stroke}"/>`,f,rr,ll,bk,fb,rb,lb};
}
function box3d(x,y,s=1){const p=prism(x,y,20*s,20*s,17*s,{t:'url(#gBoxT)',l:'url(#gBoxL)',r:'url(#gBoxR)'});
  const m=(A,B,k=.5)=>[A[0]+(B[0]-A[0])*k,A[1]+(B[1]-A[1])*k];
  return shadow(x,y+1,16*s,5*s,.16)+p.svg+`<line x1="${f1(m(p.f,p.ll)[0])}" y1="${f1(m(p.f,p.ll)[1])}" x2="${f1(m(p.rr,p.bk)[0])}" y2="${f1(m(p.rr,p.bk)[1])}" stroke="#fff5e6" stroke-width="${3*s}" opacity=".85"/>
   <line x1="${f1(m(p.f,p.ll)[0])}" y1="${f1(m(p.f,p.ll)[1])}" x2="${f1(m(p.fb,p.lb)[0])}" y2="${f1(m(p.fb,p.lb)[1])}" stroke="#f3dcb6" stroke-width="${3*s}" opacity=".8"/>`;}
function boxStack(x,y,s=1){return box3d(x,y,s)+box3d(x+19*s,y-11*s,s*.9)+box3d(x+6*s,y-17*s,s*.85);}
function warehouse3d(x,y,s=1,roof='url(#gBrand)'){
  const p=prism(x,y,40*s,26*s,20*s,{t:'#eef4f5',l:'url(#gWallL)',r:'url(#gWallR)'});
  const up=12*s, m1=[(p.f[0]+p.ll[0])/2,(p.f[1]+p.ll[1])/2-up], m2=[(p.rr[0]+p.bk[0])/2,(p.rr[1]+p.bk[1])/2-up];
  const door=[[x+.866*14*s,y-.5*14*s],[x+.866*30*s,y-.5*30*s],[x+.866*30*s,y-.5*30*s-13*s],[x+.866*14*s,y-.5*14*s-13*s]];
  let lines='';for(let k=1;k<5;k++){const yy=13*s*k/5;lines+=`<line x1="${f1(door[0][0])}" y1="${f1(door[0][1]-yy)}" x2="${f1(door[1][0])}" y2="${f1(door[1][1]-yy)}" stroke="#8fa9af" stroke-width="${.8*s}"/>`;}
  return shadow(x+8*s,y+2*s,36*s,9*s,.2)+
   `<polygon points="${pts([p.fb,p.lb,p.ll,p.f])}" fill="url(#gWallL)"/><polygon points="${pts([p.fb,p.rb,p.rr,p.f])}" fill="url(#gWallR)"/>
    <polygon points="${pts([p.f,p.ll,m1])}" fill="#f7fbfb"/><polygon points="${pts([p.ll,m1,m2,p.bk])}" fill="#0a5866"/>
    <polygon points="${pts([p.f,m1,m2,p.rr])}" fill="${roof}"/><line x1="${f1(m1[0])}" y1="${f1(m1[1])}" x2="${f1(m2[0])}" y2="${f1(m2[1])}" stroke="#fff" stroke-opacity=".5" stroke-width="${1.2*s}"/>
    <polygon points="${pts(door)}" fill="#c4d5d9"/>${lines}
    <polygon points="${pts([[x-.866*8*s,y-.5*8*s-7*s],[x-.866*18*s,y-.5*18*s-7*s],[x-.866*18*s,y-.5*18*s-13*s],[x-.866*8*s,y-.5*8*s-13*s]])}" fill="#a8f0dc"/>`;}
function truck3d(x,y,s=1){
  const cab=prism(x+.866*32*s,y-.5*32*s,11*s,15*s,12*s,{t:'#2a8d9c',l:'#0b6a7a',r:'#004956'});
  const cargo=prism(x,y,32*s,15*s,17*s,{t:'#f6fafa',l:'url(#gWallL)',r:'url(#gWallR)'});
  const w=(k)=>`<ellipse cx="${f1(x+.866*k*s)}" cy="${f1(y-.5*k*s+1*s)}" rx="${f1(3.6*s)}" ry="${f1(4.2*s)}" fill="#1f2a2e"/><ellipse cx="${f1(x+.866*k*s)}" cy="${f1(y-.5*k*s+1*s)}" rx="${f1(1.5*s)}" ry="${f1(1.8*s)}" fill="#9aa5a8"/>`;
  const win=prism(x+.866*37*s,y-.5*37*s-6*s,5*s,.1,4*s,{t:'none',l:'none',r:'#a8f0dc'});
  const label=`<g transform="matrix(.866 -.5 0 1 ${f1(x+.866*6*s)} ${f1(y-.5*6*s-6*s)})"><rect x="0" y="-4" width="${f1(20*s)}" height="${f1(4.5*s)}" fill="#76e8cd"/></g>
   <text transform="matrix(.866 -.5 0 1 ${f1(x+.866*16*s)} ${f1(y-.5*16*s-8*s)})" text-anchor="middle" font-family="${FONT}" font-size="${f1(8*s)}" font-weight="700" fill="#004956">سلة</text>`;
  return shadow(x+14*s,y+3*s,30*s,7*s,.2)+cab.svg+win.svg+cargo.svg+label+w(7)+w(25)+w(38);}
function pin3d(x,y,s=1,col='b'){const g=col==='o'?'url(#gOrange)':'url(#gBrand)';const hy=y-30*s,r=13*s;
  return shadow(x,y+1,10*s,3.4*s,.25)+`<path d="M${f1(x)} ${f1(y)} C${f1(x-4*s)} ${f1(y-9*s)} ${f1(x-r)} ${f1(hy+10*s)} ${f1(x-r)} ${f1(hy)} A${f1(r)} ${f1(r)} 0 1 1 ${f1(x+r)} ${f1(hy)} C${f1(x+r)} ${f1(hy+10*s)} ${f1(x+4*s)} ${f1(y-9*s)} ${f1(x)} ${f1(y)} Z" fill="${g}"/>
   <circle cx="${f1(x)}" cy="${f1(hy)}" r="${f1(r)}" fill="url(#gShine)"/><circle cx="${f1(x)}" cy="${f1(hy)}" r="${f1(5.2*s)}" fill="#fff"/>`;}
function coins3d(x,y,s=1,n=3){let o=shadow(x,y+5*s,18*s,5*s,.18);for(let i=0;i<n;i++){const yy=y-i*6*s;
  o+=`<path d="M${f1(x-16*s)} ${f1(yy)} v${f1(5*s)} a${f1(16*s)} ${f1(6*s)} 0 0 0 ${f1(32*s)} 0 v${f1(-5*s)}" fill="#2fa487"/><ellipse cx="${f1(x)}" cy="${f1(yy)}" rx="${f1(16*s)}" ry="${f1(6*s)}" fill="url(#gMint)" stroke="#fff" stroke-opacity=".6"/>`;}
  return o+txt(x,y-(n-1)*6*s+3.5*s,'ر.س',{size:8*s,color:'#004956'});}
function clock3d(x,y,s=1){const r=17*s;return shadow(x,y+r+4*s,14*s,4*s,.18)+`<circle cx="${f1(x+3.5*s)}" cy="${f1(y+2*s)}" r="${f1(r)}" fill="#0a5866"/><circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(r)}" fill="url(#gBrand)"/><circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(r-4*s)}" fill="#fff"/>
  <path d="M${f1(x)} ${f1(y)} V${f1(y-8*s)} M${f1(x)} ${f1(y)} L${f1(x+6*s)} ${f1(y+3*s)}" stroke="#f2663a" stroke-width="${f1(2.2*s)}" stroke-linecap="round"/><circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(1.8*s)}" fill="#004956"/><circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(r)}" fill="url(#gShine)"/>`;}
function shield3d(x,y,s=1){const d=(dx,dy)=>`M${f1(x+dx)} ${f1(y-18*s+dy)} L${f1(x+15*s+dx)} ${f1(y-12*s+dy)} V${f1(y+dy)} C${f1(x+15*s+dx)} ${f1(y+10*s+dy)} ${f1(x+7*s+dx)} ${f1(y+16*s+dy)} ${f1(x+dx)} ${f1(y+19*s+dy)} C${f1(x-7*s+dx)} ${f1(y+16*s+dy)} ${f1(x-15*s+dx)} ${f1(y+10*s+dy)} ${f1(x-15*s+dx)} ${f1(y+dy)} V${f1(y-12*s+dy)} Z`;
  return shadow(x,y+22*s,12*s,3.5*s,.18)+`<path d="${d(3.5*s,2.5*s)}" fill="#0a5866"/><path d="${d(0,0)}" fill="url(#gBrand)"/><path d="${d(0,0)}" fill="url(#gShine)"/><path d="M${f1(x-6*s)} ${f1(y)} l${f1(4.5*s)} ${f1(4.5*s)} l${f1(8*s)} ${f1(-9*s)}" stroke="#a8f0dc" stroke-width="${f1(3*s)}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;}
function pedestal(x,y,s=1){return shadow(x,y+10*s,30*s,7*s,.16)+`<path d="M${f1(x-28*s)} ${f1(y)} v${f1(7*s)} a${f1(28*s)} ${f1(9*s)} 0 0 0 ${f1(56*s)} 0 v${f1(-7*s)}" fill="#9fdcc9"/><ellipse cx="${f1(x)}" cy="${f1(y)}" rx="${f1(28*s)}" ry="${f1(9*s)}" fill="url(#gMint)"/><ellipse cx="${f1(x)}" cy="${f1(y)}" rx="${f1(28*s)}" ry="${f1(9*s)}" fill="url(#gShine)"/>`;}

  art(){const L=[['التوصيل','url(#gTop)',0],['التجهيز','#c3efe1',118],['التخزين','#9fdcc9',236]];let o='';let bb;const conn=[];

document.getElementById('jump').innerHTML=OPTS.map((o,i)=>`<a href="#d${i+1}">${i+1}</a>`).join('');
document.getElementById('list').innerHTML=OPTS.map((o,i)=>`<article class="opt" id="d${i+1}"><div class="opt-head"><span class="opt-no num">${i+1}</span><h2>${o.name}</h2><p>${o.when}</p></div>
  <div class="frame">${banner(o.h,SUB,o.art(),{dark:!!o.dark})}<div class="dl"><button class="copy" type="button" data-copy="${i}">نسخ كود SVG</button><span class="fname">map-svg/${o.file}.svg</span></div></div></article>`).join('');

function exportSvg(i){const el=document.querySelectorAll('.opt')[i].querySelector('.art svg').cloneNode(true);
  const vb=el.getAttribute('viewBox').split(' ').map(Number);el.setAttribute('width',Math.round(vb[2]*2));el.setAttribute('height',Math.round(vb[3]*2));
  return '<?xml version="1.0" encoding="UTF-8"?>\n'+el.outerHTML;}
window.exportSvg=exportSvg; window.SVG_FILES=OPTS.map(o=>o.file);
document.addEventListener('click',e=>{
  const cp=e.target.closest('[data-copy]');
  if(cp){const done=ok=>{cp.textContent=ok?'تم النسخ':'تعذّر النسخ';setTimeout(()=>cp.textContent='نسخ كود SVG',1600);};
    try{navigator.clipboard.writeText(exportSvg(+cp.dataset.copy)).then(()=>done(true),()=>done(false));}catch(err){done(false);}}
  const x=e.target.closest('.bn-x'); if(x){const b=x.closest('.bn');b.style.opacity='.35';setTimeout(()=>b.style.opacity='',900);}
  const a=e.target.closest('a'); if(a&&a.getAttribute('href')==='#') e.preventDefault();
});
