    return sign + whole + '.' + frac + (o.currency ? ' BHD' : '')

   * branch, pulled from the Subscription Plan module, and it can step at a volume
   * threshold. So a rate is a function of (plan, units sold before this order), not a
   * constant — and the statement records which rate priced each line, because "3% today"
   * is not an answer to "why was this order charged what it was".

    const tiers = p.tiers.slice().sort((a, b) => b.fromUnits - a.fromUnits)

  const order = (id) => ORDERS.find((o) => o.id === id)
  const ordersFor = (sellerId) => ORDERS.filter((o) => o.sellerId === sellerId).slice().sort(byDate)
  const ordersForBuyer = (buyerId) => ORDERS.filter((o) => o.buyerId === buyerId).slice().sort(byDate)
  const byDate = (a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : a.id < b.id ? -1 : 1)

  // ── Per-line arithmetic (BRD §7.3) ───────────────────────────────────────
  /**
   * A line resolved into money. `base` is the pre-VAT amount — the figure commission is
   * charged on, whichever way the price was entered.
   */
  function lineAmounts(l) {
    const gross = l.price * l.qty
    const rate = l.vatRate === undefined ? VAT_RATE : l.vatRate
    const base = l.vatInclusive ? round3(gross / (1 + rate)) : gross
    const vat = l.vatInclusive ? gross - base : round3(gross * rate)
    const discount = (l.discount && l.discount.amount) || 0
    const funder = (l.discount && l.discount.funder) || null
    return {
      gross, base, vat, rate,
      total: base + vat,                       // list price the buyer would pay undiscounted
      discount, funder,
      buyerPays: base + vat - discount,        // what the buyer actually hands over
      counts: l.status === 'fulfilled',        // rejected and cancelled lines carry no commission
    }
  }

  /**
   * The commission base for an order.
   *
   * Neither kind of discount reduces it. The BRD says an HB-funded coupon is absorbed by
   * HB, and that a seller-funded discount reduces "the seller's own receivable rather
   * than HB's commission base" — so in both cases commission is charged on the pre-VAT
   * base before any discount. Rejected and cancelled lines are excluded entirely (§7.7).
   */
  function commissionBase(o) {
    return sum(o.lines.map(lineAmounts).filter((a) => a.counts).map((a) => a.base))
  }

  /** Everything derived for one order. The single place any statement figure comes from. */
  function orderStatement(o) {
    const amounts = o.lines.map(lineAmounts)
    const live = amounts.filter((a) => a.counts)
    const dropped = amounts.filter((a) => !a.counts)

    const rate = rateFor(planForOrder(o), o.unitsBefore || 0)
    const base = sum(live.map((a) => a.base))
    const vat = sum(live.map((a) => a.vat))
    const orderTotal = sum(live.map((a) => a.total))
    const hbDiscount = sum(live.filter((a) => a.funder === 'hb').map((a) => a.discount))
    const sellerDiscount = sum(live.filter((a) => a.funder === 'seller').map((a) => a.discount))
    const buyerPays = sum(live.map((a) => a.buyerPays))
    const commission = round3(base * rate)

    // Shipping, returns and penalties. The BRD (§8) records that these have no column yet
    // and asks where they live; this module gives them one rather than folding them into
    // fixed fees, where they would stop being explicable to the seller.
    const deduction = (o.shipping || 0) + (o.penalty || 0) + (o.returnFee || 0)

    const cod = o.paymentMethod === 'cod'

    /*
     * The two directions, kept apart on purpose.
     *
     *   HB Payment — HB holds the buyer's cash, so the seller's receivable is what is
     *                left after commission and deductions. HB funded coupons are added
     *                back: the buyer paid less, and HB, not the seller, covers the gap.
     *   COD        — the courier already handed the seller everything. Nothing is
     *                receivable; what exists is a debt running the other way.
     */
    const sellerReceivable = cod ? 0 : buyerPays + hbDiscount - commission - deduction
    const hbReceivable = cod ? commission + deduction - hbDiscount : 0

    return {
      id: o.id, date: o.date, sellerId: o.sellerId, branchId: o.branchId, buyerId: o.buyerId,
      paymentMethod: o.paymentMethod, note: o.note || null,
      lines: o.lines.map((l, i) => Object.assign({}, l, amounts[i])),
      droppedCount: dropped.length,
      droppedValue: sum(dropped.map((a) => a.total)),
      rate, base, vat, orderTotal, buyerPays,
      hbDiscount, sellerDiscount, commission, deduction,
      sellerReceivable, hbReceivable,
      // "Net Payables" is one of the five definitions the BRD leaves open (§12). Stated
      // here as one signed number — positive HB owes the seller, negative the seller owes
      // HB — and labelled as a proposal wherever it is displayed.
      netPayable: sellerReceivable - hbReceivable,
    }
  }

  // ── Smart offsetting (BRD §7.8) ──────────────────────────────────────────
  /**
   * The seller's ledger, in order, with the running balance the BRD asks for (§7.2).
   *
   * The netting is the point. A COD order books a debt; the next prepaid order pays this
   * order's commission *and* whatever debt has accumulated, before anything is released.
   * A payout is never negative — if the debt is larger than the order, the remainder
   * stays outstanding and is carried to the next one.
   */
  function ledger(sellerId, opts) {
    const k = opts || {}
    const rows = []
    let balance = 0        // signed: positive HB owes the seller
    let outstanding = 0    // backdated COD debt still to be recovered

    for (const o of ordersFor(sellerId)) {
      const st = orderStatement(o)
      let offset = 0
      let payout = 0

      if (o.paymentMethod === 'hb_payment') {
        offset = Math.min(outstanding, st.sellerReceivable)
        payout = st.sellerReceivable - offset
        outstanding -= offset
      } else {
        outstanding += st.hbReceivable
      }

      balance += st.netPayable
      rows.push(Object.assign({}, st, {
        offset,                 // prior debt cleared by this order
        payout,                 // what Finance would transfer for this order
        outstandingAfter: outstanding,
        balance,
      }))
    }
    return { sellerId, rows, balance, outstanding, cadence: seller(sellerId).cadence }
  }

  /** Reporting periods (BRD §7.1). `order` is the ungrouped, per-order view. */
  function periodKey(dateStr, period) {
    const d = new Date(dateStr + 'T00:00:00Z')
    if (period === 'yearly') return String(d.getUTCFullYear())
    if (period === 'monthly') return dateStr.slice(0, 7)
    if (period === 'weekly') {
      const t = new Date(d)
      t.setUTCDate(t.getUTCDate() - ((t.getUTCDay() + 6) % 7)) // ISO week, Monday start
      return t.toISOString().slice(0, 10)
    }
    return dateStr
  }

  /** Group ledger rows into a period, summing the columns that are summable. */
  function group(rows, period) {
    if (period === 'order') return rows.map((r) => Object.assign({ key: r.id, rows: [r] }, r))
    const out = []
    for (const r of rows) {
      const key = periodKey(r.date, period)
      let g = out.find((x) => x.key === key)
      if (!g) {
        g = { key, rows: [], orderTotal: 0, base: 0, vat: 0, commission: 0, deduction: 0,
              hbDiscount: 0, sellerDiscount: 0, sellerReceivable: 0, hbReceivable: 0,
              netPayable: 0, offset: 0, payout: 0 }
        out.push(g)
      }
      g.rows.push(r)
      for (const f of ['orderTotal', 'base', 'vat', 'commission', 'deduction', 'hbDiscount',
                       'sellerDiscount', 'sellerReceivable', 'hbReceivable', 'netPayable',
                       'offset', 'payout']) g[f] += r[f]
      g.balance = r.balance                    // closing balance of the period
      g.outstandingAfter = r.outstandingAfter
    }
    return out
  }

  // ── Settlement cycle (BRD §7.9) ──────────────────────────────────────────
  const CADENCES = {
    weekly: { id: 'weekly', label: 'Weekly', days: 7 },
    five_day: { id: 'five_day', label: 'Every 5 days', days: 5 },
  }

  /**
   * What Finance has to do this cycle for one seller — and nothing more than that.
   *
   * This module has no gateway and executes nothing (BRD §4, §11), so a cycle is a
   * report: pay this much, collect this much. `sellerDue` only exists when a seller's
   * debt outlives every prepaid order available to net it against.
   */
  function cycle(sellerId) {
    const l = ledger(sellerId)
    const s = seller(sellerId)
    const fee = plan(s.planId).fixedFeePerCycle
    const payDue = sum(l.rows.map((r) => r.payout))
    const netPay = Math.max(payDue - fee, 0)
    return {
      sellerId, cadence: CADENCES[s.cadence],
      fixedFee: fee,
      hbPaymentDue: netPay,                    // HB pays the seller
      feeUnrecovered: Math.max(fee - payDue, 0),
      sellerDue: l.outstanding,                // the seller remits to HB
      recovered: sum(l.rows.map((r) => r.offset)),
      balance: l.balance,
      rows: l.rows,
    }
  }

  const cycleAll = () => SELLERS.map((s) => cycle(s.id))

  // ── Buyer statement (BRD §7.2, §9) ───────────────────────────────────────
  /**
   * Not cumulative, and carrying no commission — both are structural, not cosmetic.
   *
   * The returned rows are built from a separate function rather than by filtering the
   * seller's, so there is no code path on which a commission figure can reach a buyer
   * screen by being forgotten in an object.
   */
  function buyerStatement(buyerId, period) {
    const rows = ordersForBuyer(buyerId).map((o) => {
      const st = orderStatement(o)
      return {
        id: st.id, date: st.date, sellerId: st.sellerId,
        sellerName: seller(st.sellerId).name,
        paymentMethod: st.paymentMethod,
        base: st.base, vat: st.vat, orderTotal: st.orderTotal,
        discount: st.hbDiscount + st.sellerDiscount,
        paid: st.buyerPays,
        droppedCount: st.droppedCount, droppedValue: st.droppedValue,
        lines: st.lines.map((l) => ({
          sku: l.sku, name: l.name, qty: l.qty, status: l.status, reason: l.reason || null,
          base: l.base, vat: l.vat, total: l.total, discount: l.discount, buyerPays: l.buyerPays,
        })),
      }
    })
    const p = period || 'order'
    if (p === 'order') return { buyerId, period: p, rows, total: sum(rows.map((r) => r.paid)) }
    const groups = []
    for (const r of rows) {
      const key = periodKey(r.date, p)
      let g = groups.find((x) => x.key === key)
      if (!g) { g = { key, rows: [], base: 0, vat: 0, orderTotal: 0, discount: 0, paid: 0 }; groups.push(g) }
      g.rows.push(r)
      for (const f of ['base', 'vat', 'orderTotal', 'discount', 'paid']) g[f] += r[f]
    }
    return { buyerId, period: p, rows, groups, total: sum(rows.map((r) => r.paid)) }
  }

        if (pp.length !== hp.length) continue
        const local = {}
        let hit = true

        { label: 'HB receivable', value: (r) => HBS.money(r.hbReceivable) },
        { label: 'HB commission', value: (r) => HBS.money(r.commission) },
        { label: 'HB deduction', value: (r) => HBS.money(r.deduction) },
        { label: 'Net payables', value: (r) => HBS.money(r.netPayable) },
        { label: 'Balance', value: (r) => HBS.money(r.balance) },
      ]

      return el('div', { class: 'hs-stack' }, [
        U.note('Cumulative by design',
          'The BRD names this as the structural difference from the buyer statement (§7.2): a balance carried forward order over order, like an account ledger.'),
        figures,
        l.outstanding > 0
          ? U.banner('warn', S.seller.debtHeading + ': ' + HBS.money(l.outstanding, { currency: true }) + '. ',
              U.notifyEarly() ? S.seller.notifyOn : S.seller.notifyOff)
          : U.banner('good', S.seller.noDebt + '. ', S.seller.noDebtNote),
        U.card({
          title: S.seller.statement,
          note: S.seller.cumulative,
          flush: true,
          actions: U.exportButtons(sellerId + '-statement-' + period + '.csv', csvCols, grouped),
          body: U.table({
            wide: period === 'order',
            columns,
            rows: grouped,
            rowKey: (r) => r.id || null,
            rowLabel: (r) => (r.id ? S.fill(S.common.openOrder, { id: r.id }) : null),
            onRowClick: (r) => r.id && U.openOrder(r.id, { role: 'seller' }),
          }),
          foot: el('span', { class: 'hs-sub' },
            'Every figure is derived from the order lines. Columns marked ? carry a definition the BRD has not settled.'),
        }),
      ])
    }

    // ── Dues: the backdated COD debt, and how it clears ────────────────────
    function dues() {
      const l = HBS.ledger(sellerId)
      const debts = l.rows.filter((r) => r.hbReceivable > 0)
      const clears = l.rows.filter((r) => r.offset > 0)

      const notifySwitch = el('span', { class: 'hs-seg', role: 'group', 'aria-label': S.seller.notifyLabel },
        [['early', 'At the COD order'], ['settlement', 'At settlement']].map(([v, label]) =>
          el('button', {
            type: 'button', 'aria-pressed': String(U.notifyEarly() === (v === 'early')),
            onclick: () => U.setParam('notify', v),
          }, label)))

      return el('div', { class: 'hs-stack' }, [
        U.note('An open question, built both ways',
          'The BRD asks whether a seller is told when a backdated debt is created, or only sees it at settlement (§12). The switch below shows each reading.'),
        el('div', { class: 'hs-figures' }, [
          U.figure({ tone: 'due', label: S.figures.dues, value: l.outstanding, note: S.figures.duesNote }),
          U.figure({ tone: 'hold', label: S.figures.recovered, value: HBS.sum(l.rows.map((r) => r.offset)), note: S.figures.recoveredNote }),
        ]),
        U.card({
          title: 'When you see it',
          note: S.seller.notifyOpen,
          body: el('div', { style: { display: 'flex', gap: '12px', alignItems: 'center', flexWrap: 'wrap' } }, [
            el('span', { class: 'hs-filter-label' }, S.seller.notifyLabel), notifySwitch,
            el('span', { class: 'hs-sub', style: { margin: '0' } }, U.notifyEarly() ? S.seller.notifyOn : S.seller.notifyOff),
          ]),
        }),
        U.card({
          title: S.seller.debtHeading,
          flush: debts.length > 0,
          body: debts.length === 0
            ? U.empty(S.seller.noDebt, S.seller.noDebtNote)
            : U.table({
                compact: true,
                columns: [
                  { label: S.columns.orderDate, cell: (r) => r.date },
                  { label: S.common.order, cell: (r) => el('strong', {}, r.id) },
                  { label: S.columns.orderTotal, num: true, cell: (r) => U.money(r.orderTotal) },
                  { label: S.columns.commission, num: true, cell: (r) => U.money(r.commission) },
                  { label: S.columns.deduction, draft: 'deduction', num: true, cell: (r) => U.money(r.deduction) },
                  { label: S.columns.hbReceivable, draft: 'hbReceivable', num: true, cell: (r) => el('strong', {}, U.money(r.hbReceivable, { tone: 'neg' })) },
                ],
                rows: debts,
                rowKey: (r) => r.id,
                rowLabel: (r) => S.fill(S.common.openOrder, { id: r.id }),
                onRowClick: (r) => U.openOrder(r.id, { role: 'seller' }),
              }),
        }),
        U.card({
          title: S.seller.nettingTitle,
          note: S.seller.nettingNote,
          body: clears.length === 0
            ? U.empty('Nothing netted yet', 'A prepaid order has not arrived to clear this debt against.')
            : el('div', { class: 'hs-stack' }, clears.map((r) => U.calc([
                { label: 'Order ' + r.id + ' — ' + S.calc.receivable, value: r.sellerReceivable, plain: true },
                { label: S.calc.offsetLine, value: -r.offset, tone: 'neg' },
                { label: S.calc.payoutLine, value: r.payout, rule: true, tone: r.payout > 0 ? 'pos' : null },
              ], r.payout === 0
                ? 'The debt was larger than this order could cover. The payout floors at 0.000 and ' +
                  HBS.money(r.outstandingAfter, { currency: true }) + ' stays outstanding.'
                : null))),
        }),
      ])
    }

    // ── The plan that prices the orders ────────────────────────────────────
    function planView() {
      const l = HBS.ledger(sellerId)
      const rates = {}
      for (const r of l.rows) rates[r.rate] = (rates[r.rate] || 0) + 1

      return el('div', { class: 'hs-stack' }, [
        U.note('Pulled from the Subscription Plan module',
          'The BRD is explicit that commission is per seller and per branch, and can step at a volume threshold (§7.5). It is not a platform-wide constant.'),
        U.card({
          title: p.name,
          note: p.note,
          body: el('dl', { class: 'hs-kv' }, [
            el('dt', {}, 'Plan'), el('dd', {}, p.name),
            el('dt', {}, 'Fixed fee per cycle'), el('dd', {}, U.money(p.fixedFeePerCycle, { currency: true })),
            el('dt', {}, 'Settlement cadence'), el('dd', {}, HBS.CADENCES[s.cadence].label),
            el('dt', {}, 'VAT number'), el('dd', {}, s.vatNumber),
          ]),
        }),
        U.card({
          title: 'Rate tiers',
          note: 'The rate that applies to an order depends on how many units had already shipped when it was placed.',
          flush: true,
          body: U.table({
            compact: true,
            columns: [
              { label: 'From units shipped', num: true, cell: (t) => String(t.fromUnits) },
              { label: S.columns.rate, num: true, cell: (t) => HBS.pct(t.rate) },
              { label: 'Orders priced at this rate', num: true, cell: (t) => String(rates[t.rate] || 0) },
            ],
            rows: p.tiers,
          }),
        }),
        s.branches && s.branches.length > 1 ? U.card({
          title: 'Branches',
          note: 'A branch can carry its own agreement, and then it prices its own orders.',
          flush: true,
          body: U.table({
            compact: true,
            columns: [
              { label: 'Branch', cell: (b) => b.name },
              { label: 'Plan', cell: (b) => HBS.plan(b.planId).name },
              { label: 'Base rate', num: true, cell: (b) => HBS.pct(HBS.plan(b.planId).tiers[0].rate) },
            ],
            rows: s.branches,
          }),
        }) : null,
      ])
    }
  }

  // Registered as a named app so one bundled page can start whichever surface the URL
  // asks for; the multi-file build has no HBS_SINGLE and still starts itself.
  root.HBSApps = root.HBSApps || {}
  root.HBSApps.seller = start
  if (!root.HBS_SINGLE) {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start)
    else start()
  }
})(typeof globalThis !== 'undefined' ? globalThis : this)

</script>
<script>
;(function (root) {
  'use strict'

  /**
   * HB Admin surface.
   *
   * Carries all three levels the BRD names (§7.2): the list of seller statements, a
   * seller's statement, and a buyer's. It adds two screens the BRD implies but does not
   * list — the cycle report Finance actually works from, and the register of definitions
   * still open — because a stakeholder review needs to see where the numbers stop being
   * agreed.
   */

  const HBS = root.HBS
  const S = root.HBSStrings
  const U = root.HBSUI
  const el = U.el

  function start() {
    const nav = [{
      label: 'Statements',
      items: [
        { href: U.href('/sellers'), label: S.admin.sellers, icon: '≡' },
        { href: U.href('/buyers'), label: S.admin.buyers, icon: '◇' },
      ],
    }, {
      label: 'Finance',
      items: [{ href: U.href('/cycle'), label: S.admin.cycle, icon: '↗' }],
    }, {
      label: 'Review',
      items: [{ href: U.href('/questions'), label: S.admin.questions, icon: '?' }],
    }]

    U.router({
      '/sellers': { title: S.admin.sellers, sub: S.admin.sellersSub, nav: '/sellers', view: sellerList },
      '/sellers/:id': { title: 'Seller statement', sub: '', nav: '/sellers', view: (p) => sellerStatement(p.id) },
      '/buyers': { title: S.admin.buyers, sub: S.admin.buyersSub, nav: '/buyers', view: buyerList },
      '/buyers/:id': { title: 'Buyer statement', sub: '', nav: '/buyers', view: (p) => buyerStatement(p.id) },
      '/cycle': { title: S.admin.cycle, sub: S.admin.cycleSub, nav: '/cycle', view: cycleView },
      '/questions': { title: S.admin.questions, sub: S.admin.questionsSub, nav: '/questions', view: questions },
    }, {
      home: '/sellers',
      render(route, params) {
        U.clear(document.body)
        const r = route || { title: S.common.notFound, sub: '', nav: null, view: () => U.empty(S.common.notFound, S.common.notFoundNote) }
        let subtitle = r.sub
        if (params.id && HBS.seller(params.id)) subtitle = HBS.seller(params.id).name
        if (params.id && HBS.buyer(params.id)) subtitle = HBS.buyer(params.id).name
        const content = U.shell({
          role: 'admin',
          personaRole: 'HB Admin', personaName: 'Finance & Ops',
          title: r.title, subtitle: subtitle,
          nav: nav.map((g) => ({ label: g.label, items: g.items.map((i) => Object.assign({}, i, { current: i.href === '#' + r.nav })) })),
          controls: [el('span', { class: 'hs-filter-label' }, S.common.period), U.periodSwitch()],
        })
        content.appendChild(r.view(params))
      },
    })

    // ── Level 1 · list of seller statements ───────────────────────────────
    function sellerList() {
      const rows = HBS.SELLERS.map((s) => {
        const l = HBS.ledger(s.id)
        const c = HBS.cycle(s.id)
        return {
          id: s.id, name: s.name, orders: l.rows.length,
          cadence: HBS.CADENCES[s.cadence].label,
          plan: HBS.plan(s.planId).name,
          balance: l.balance, outstanding: l.outstanding,
          paymentDue: c.hbPaymentDue, sellerDue: c.sellerDue, recovered: c.recovered,
        }
      })
      const totals = {
        paymentDue: HBS.sum(rows.map((r) => r.paymentDue)),
        sellerDue: HBS.sum(rows.map((r) => r.sellerDue)),
        recovered: HBS.sum(rows.map((r) => r.recovered)),
      }
      const csvCols = [
        { label: 'Seller', value: (r) => r.name },
        { label: 'Orders', value: (r) => r.orders },
        { label: 'Plan', value: (r) => r.plan },
        { label: 'Cadence', value: (r) => r.cadence },
        { label: 'Balance', value: (r) => HBS.money(r.balance) },
        { label: 'HB payment due', value: (r) => HBS.money(r.paymentDue) },
        { label: 'Seller due', value: (r) => HBS.money(r.sellerDue) },
      ]

      return el('div', { class: 'hs-stack' }, [
        el('div', { class: 'hs-figures' }, [
          U.figure({ tone: 'pay', label: S.figures.paymentDue, value: totals.paymentDue, note: 'Across every seller, this cycle.' }),
          U.figure({ tone: 'due', label: S.figures.sellerDue, value: totals.sellerDue, note: 'Backdated COD commission netting could not clear.' }),
          U.figure({ tone: 'hold', label: S.figures.recovered, value: totals.recovered, note: S.figures.recoveredNote }),
        ]),
        U.card({
          title: S.admin.sellers, note: S.admin.sellersSub, flush: true,
          actions: U.exportButtons('seller-statements.csv', csvCols, rows),
          body: U.table({
            columns: [
              { label: S.common.seller, cell: (r) => el('strong', {}, r.name) },
              { label: 'Plan', cell: (r) => U.pill(r.plan, 'navy') },
              { label: 'Cadence', cell: (r) => r.cadence },
              { label: S.common.order, num: true, cell: (r) => String(r.orders) },
              { label: S.columns.balance, draft: 'balance', num: true, cell: (r) => U.money(r.balance, { tone: 'auto', signed: true }) },
              { label: S.columns.paymentDue, draft: 'paymentDue', num: true, cell: (r) => U.money(r.paymentDue, { tone: r.paymentDue ? 'pos' : null }) },
              { label: S.columns.sellerDue, draft: 'sellerDue', num: true, cell: (r) => U.money(r.sellerDue, { tone: r.sellerDue ? 'neg' : null }) },
            ],
            rows,
            rowKey: (r) => r.id,
            rowLabel: (r) => 'Open ' + r.name,
            onRowClick: (r) => { location.hash = '/sellers/' + r.id },
          }),
        }),
      ])
    }

    // ── Level 2 · a seller's statement ────────────────────────────────────
    function sellerStatement(id) {
      const s = HBS.seller(id)
      if (!s) return U.empty(S.common.notFound, S.common.notFoundNote)
      const l = HBS.ledger(id)
      const c = HBS.cycle(id)
      const period = U.period()
      const grouped = HBS.group(l.rows, period)

      const csvCols = [
        { label: 'Order date', value: (r) => r.date || r.key },
        { label: 'Order', value: (r) => r.id || '' },
        { label: 'Method', value: (r) => (r.paymentMethod ? S.method[r.paymentMethod] : '') },
        { label: 'Order total', value: (r) => HBS.money(r.orderTotal) },
        { label: 'Seller receivable', value: (r) => HBS.money(r.sellerReceivable) },
        { label: 'HB receivable', value: (r) => HBS.money(r.hbReceivable) },
        { label: 'HB commission', value: (r) => HBS.money(r.commission) },
        { label: 'HB deduction', value: (r) => HBS.money(r.deduction) },
        { label: 'Net payables', value: (r) => HBS.money(r.netPayable) },
        { label: 'Netted', value: (r) => HBS.money(r.offset) },
        { label: 'Payout', value: (r) => HBS.money(r.payout) },
        { label: 'Balance', value: (r) => HBS.money(r.balance) },
      ]

      const columns = period === 'order' ? [
        { label: S.columns.orderDate, cell: (r) => r.date },
        { label: S.common.order, cell: (r) => el('strong', {}, r.id) },
        { label: S.columns.method, cell: (r) => U.methodPill(r.paymentMethod) },
        { label: S.columns.rate, num: true, cell: (r) => HBS.pct(r.rate) },
        { label: S.columns.orderTotal, num: true, cell: (r) => U.money(r.orderTotal) },
        { label: S.columns.sellerReceivable, num: true, cell: (r) => U.money(r.sellerReceivable) },
        { label: S.columns.hbReceivable, draft: 'hbReceivable', num: true, cell: (r) => U.money(r.hbReceivable, { tone: r.hbReceivable ? 'neg' : null }) },
        { label: S.columns.commission, num: true, cell: (r) => U.money(r.commission) },
        { label: S.columns.deduction, draft: 'deduction', num: true, cell: (r) => U.money(r.deduction) },
        { label: S.columns.netPayable, draft: 'netPayable', num: true, cell: (r) => U.money(r.netPayable, { tone: 'auto', signed: true }) },
        { label: S.columns.offset, num: true, cell: (r) => U.money(r.offset) },
        { label: S.columns.payout, num: true, cell: (r) => U.money(r.payout, { tone: r.payout ? 'pos' : null }) },
        { label: S.columns.balance, draft: 'balance', num: true, cell: (r) => el('strong', {}, U.money(r.balance, { tone: 'auto' })) },
      ] : [
        { label: S.common.periods[period], cell: (g) => el('strong', {}, g.key) },
        { label: S.common.order, num: true, cell: (g) => String(g.rows.length) },
        { label: S.columns.orderTotal, num: true, cell: (g) => U.money(g.orderTotal) },
        { label: S.columns.sellerReceivable, num: true, cell: (g) => U.money(g.sellerReceivable) },
        { label: S.columns.hbReceivable, draft: 'hbReceivable', num: true, cell: (g) => U.money(g.hbReceivable) },
        { label: S.columns.commission, num: true, cell: (g) => U.money(g.commission) },
        { label: S.columns.netPayable, draft: 'netPayable', num: true, cell: (g) => U.money(g.netPayable, { tone: 'auto', signed: true }) },
        { label: S.columns.offset, num: true, cell: (g) => U.money(g.offset) },
        { label: S.columns.payout, num: true, cell: (g) => U.money(g.payout) },
        { label: S.columns.balance, draft: 'balance', num: true, cell: (g) => el('strong', {}, U.money(g.balance, { tone: 'auto' })) },
      ]

      return el('div', { class: 'hs-stack' }, [
        el('a', { class: 'hs-btn hs-btn--quiet hs-noprint', href: U.href('/sellers') }, S.fill(S.common.backTo, { label: S.admin.sellers })),
        el('div', { class: 'hs-figures' }, [
          U.figure({ tone: 'pay', label: S.figures.balance, value: Math.max(l.balance, 0), note: S.figures.balanceNote }),
          U.figure({ tone: 'due', label: S.figures.dues, value: l.outstanding, note: S.figures.duesNote }),
          U.figure({ tone: 'info', label: S.figures.paymentDue, value: c.hbPaymentDue, note: S.figures.paymentDueNote }),
          U.figure({ tone: 'hold', label: S.figures.recovered, value: c.recovered, note: S.figures.recoveredNote }),
        ]),
        U.card({
          title: s.name, note: s.address + ' · VAT ' + s.vatNumber, flush: true,
          actions: U.exportButtons(id + '-statement-' + period + '.csv', csvCols, grouped),
          body: U.table({
            wide: period === 'order', columns, rows: grouped,
            rowKey: (r) => r.id || null,
            rowLabel: (r) => (r.id ? S.fill(S.common.openOrder, { id: r.id }) : null),
            onRowClick: (r) => r.id && U.openOrder(r.id, { role: 'admin' }),
          }),
        }),
      ])
    }

    // ── Level 3 · buyers ──────────────────────────────────────────────────
    function buyerList() {
      const rows = HBS.BUYERS.map((b) => {
        const st = HBS.buyerStatement(b.id, 'order')
        return { id: b.id, name: b.name, orders: st.rows.length, paid: st.total }
      })
      return el('div', { class: 'hs-stack' }, [
        U.note('No commission, by construction',
          'Buyer rows are built by their own function rather than filtered from the seller ledger, so a commission figure cannot reach a buyer screen by being left in an object.'),
        U.card({
          title: S.admin.buyers, note: S.admin.buyersSub, flush: true,
          actions: U.exportButtons('buyer-statements.csv', [
            { label: 'Buyer', value: (r) => r.name },
            { label: 'Orders', value: (r) => r.orders },
            { label: 'Paid', value: (r) => HBS.money(r.paid) },
          ], rows),
          body: U.table({
            compact: true,
            columns: [
              { label: S.common.buyer, cell: (r) => el('strong', {}, r.name) },
              { label: S.common.order, num: true, cell: (r) => String(r.orders) },
              { label: S.buyer.paid, num: true, cell: (r) => U.money(r.paid) },
            ],
            rows,
            rowKey: (r) => r.id,
            rowLabel: (r) => 'Open ' + r.name,
            onRowClick: (r) => { location.hash = '/buyers/' + r.id },
          }),
        }),
      ])
    }

    function buyerStatement(id) {
      const b = HBS.buyer(id)
      if (!b) return U.empty(S.common.notFound, S.common.notFoundNote)
      const st = HBS.buyerStatement(id, U.period())
      return el('div', { class: 'hs-stack' }, [
        el('a', { class: 'hs-btn hs-btn--quiet hs-noprint', href: U.href('/buyers') }, S.fill(S.common.backTo, { label: S.admin.buyers })),
        U.banner('info', null, S.buyer.notCumulative),
        U.buyerTable(st, b, 'admin'),
      ])
    }

    // ── The cycle report Finance works from ───────────────────────────────
    function cycleView() {
      const cycles = HBS.cycleAll()
      return el('div', { class: 'hs-stack' }, [
        U.banner('warn', S.admin.cycleWarn, ' The BRD puts disbursement out of scope for Phase 1 (§4): there is no gateway, and Finance triggers every transfer by hand.'),
        el('div', { class: 'hs-figures' }, [
          U.figure({ tone: 'pay', label: 'To pay out', value: HBS.sum(cycles.map((c) => c.hbPaymentDue)), note: 'Total Finance transfers this cycle.' }),
          U.figure({ tone: 'due', label: 'To collect', value: HBS.sum(cycles.map((c) => c.sellerDue)), note: 'Total Finance invoices or collects.' }),
          U.figure({ tone: 'hold', label: S.figures.recovered, value: HBS.sum(cycles.map((c) => c.recovered)), note: 'Cleared by netting — no invoice needed.' }),
        ]),
        U.card({
          title: S.admin.cycle, note: S.admin.cycleSub, flush: true,
          actions: U.exportButtons('settlement-cycle.csv', [
            { label: 'Seller', value: (c) => HBS.seller(c.sellerId).name },
            { label: 'Cadence', value: (c) => c.cadence.label },
            { label: 'Fixed fee', value: (c) => HBS.money(c.fixedFee) },
            { label: 'HB payment due', value: (c) => HBS.money(c.hbPaymentDue) },
            { label: 'Seller due', value: (c) => HBS.money(c.sellerDue) },
            { label: 'Recovered by netting', value: (c) => HBS.money(c.recovered) },
          ], cycles),
          body: U.table({
            columns: [
              { label: S.common.seller, cell: (c) => el('strong', {}, HBS.seller(c.sellerId).name) },
              { label: 'Cadence', cell: (c) => U.pill(c.cadence.label, 'navy') },
              { label: S.columns.fixedFees, num: true, cell: (c) => U.money(c.fixedFee) },
              { label: S.figures.recovered, num: true, cell: (c) => U.money(c.recovered) },
              { label: S.columns.paymentDue, draft: 'paymentDue', num: true, cell: (c) => U.money(c.hbPaymentDue, { tone: c.hbPaymentDue ? 'pos' : null }) },
              { label: S.columns.sellerDue, draft: 'sellerDue', num: true, cell: (c) => U.money(c.sellerDue, { tone: c.sellerDue ? 'neg' : null }) },
              { label: 'Finance action', wrap: true, cell: (c) => {
                const acts = []
                if (c.hbPaymentDue) acts.push('Transfer ' + HBS.money(c.hbPaymentDue, { currency: true }))
                if (c.sellerDue) acts.push('Collect ' + HBS.money(c.sellerDue, { currency: true }))
                if (c.feeUnrecovered) acts.push('Fee unrecovered: ' + HBS.money(c.feeUnrecovered, { currency: true }))
                return acts.length ? acts.join(' · ') : el('span', { class: 'muted' }, 'Nothing to do')
              } },
            ],
            rows: cycles,
            rowKey: (c) => c.sellerId,
            rowLabel: (c) => 'Open ' + HBS.seller(c.sellerId).name,
            onRowClick: (c) => { location.hash = '/sellers/' + c.sellerId },
          }),
        }),
        cycles.some((c) => c.feeUnrecovered > 0) ? U.card({
          title: 'Fixed fees this cycle could not recover',
          note: 'A subscription fee is netted out of a payout. When the payout is zero, the fee has nowhere to come from — the BRD does not say what happens next.',
          flush: true,
          body: U.table({
            compact: true,
            columns: [
              { label: S.common.seller, cell: (c) => HBS.seller(c.sellerId).name },
              { label: S.columns.fixedFees, num: true, cell: (c) => U.money(c.fixedFee) },
              { label: 'Unrecovered', num: true, cell: (c) => U.money(c.feeUnrecovered, { tone: 'neg' }) },
            ],
            rows: cycles.filter((c) => c.feeUnrecovered > 0),
          }),
        }) : null,
      ])
    }

    // ── The register of what is not yet decided ───────────────────────────
    function questions() {
      const tone = { not_modelled: 'red', proposed: 'orange', toggle: 'blue', reading: 'orange' }
      const label = { not_modelled: 'Not modelled', proposed: 'Proposal', toggle: 'Built both ways', reading: 'A reading' }
      return el('div', { class: 'hs-stack' }, [
        U.banner('info', 'Every one of these is live in the prototype. ',
          'Where the BRD leaves a definition open, this build takes a position and marks it — on the screen, next to the number. Nothing here is settled by having been drawn.'),
        el('div', { class: 'hs-q' }, HBS.OPEN_QUESTIONS.map((q) => el('div', { class: 'hs-q-item' }, [
          el('div', { style: { display: 'flex', gap: '10px', alignItems: 'baseline', flexWrap: 'wrap' } }, [
            el('h3', {}, q.title),
            U.pill(label[q.status], tone[q.status]),
            el('span', { class: 'hs-q-ref' }, 'BRD ' + q.ref),
          ]),
          el('div', { class: 'hs-q-read' }, q.reading),
        ]))),
      ])
    }

  }

  // Registered as a named app so one bundled page can start whichever surface the URL
  // asks for; the multi-file build has no HBS_SINGLE and still starts itself.
  root.HBSApps = root.HBSApps || {}
  root.HBSApps.admin = start
  if (!root.HBS_SINGLE) {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start)
    else start()
  }
})(typeof globalThis !== 'undefined' ? globalThis : this)

</script>
<script>
;(function (root) {
  'use strict'

  /**
   * Buyer surface.
   *
   * Two rules from the BRD shape everything here (§7.2, §9): the statement is NOT
   * cumulative — there is no running balance and no carried figure — and no commission
   * appears anywhere. Both are enforced upstream: the rows come from
   * HBS.buyerStatement(), which builds its own objects rather than filtering the seller
   * ledger, and the shared order drawer is opened with role 'buyer', which never builds a
   * commission stage.
   */

  const HBS = root.HBS
  const S = root.HBSStrings
  const U = root.HBSUI
  const el = U.el

  function start() {
    const buyerId = U.getParam('buyer', 'C-02')
    const b = HBS.buyer(buyerId)

    const buyerPicker = el('select', {
      class: 'hs-select', 'aria-label': S.common.buyer,
      onchange: (e) => U.setParam('buyer', e.target.value),
    }, HBS.BUYERS.map((x) => el('option', { value: x.id, selected: x.id === buyerId ? '' : null }, x.name)))

    const nav = [{
      label: 'Orders',
      items: [{ href: U.href('/orders'), label: S.buyer.statement, icon: '≡' }],
    }]

    U.router({
      '/orders': { title: S.buyer.statement, sub: S.buyer.statementSub, nav: '/orders', view: orders },
      '/orders/:id': { title: 'Order', sub: '', nav: '/orders', view: (p) => orderDetail(p.id) },
    }, {
      home: '/orders',
      render(route, params) {
        U.clear(document.body)
        const r = route || { title: S.common.notFound, sub: '', nav: null, view: () => U.empty(S.common.notFound, S.common.notFoundNote) }
        const content = U.shell({
          role: 'buyer',
          personaRole: S.common.buyer, personaName: b.name,
          title: params.id ? S.fill(S.buyer.orderDetail, { id: params.id }) : r.title,
          subtitle: b.name,
          nav: nav.map((g) => ({ label: g.label, items: g.items.map((i) => Object.assign({}, i, { current: i.href === '#' + r.nav })) })),
          controls: [
            el('span', { class: 'hs-filter-label' }, S.common.buyer), buyerPicker,
            el('span', { class: 'hs-filter-label' }, S.common.period), U.periodSwitch(),
          ],
        })
        content.appendChild(r.view(params))
      },
    })

    function orders() {
      const st = HBS.buyerStatement(buyerId, U.period())
      if (!st.rows.length) return U.empty(S.common.empty, 'This account has no orders yet.')
      return el('div', { class: 'hs-stack' }, [
        U.note('Not a ledger',
          'The BRD names this as the structural difference from the seller statement (§7.2): each order’s payment stands on its own, with no running account balance.'),
        el('div', { class: 'hs-figures' }, [
          U.figure({ tone: 'info', label: S.buyer.paid, value: st.total, note: 'Across ' + st.rows.length + ' orders. Not a balance — a sum of what you paid.' }),
        ]),
        U.banner('info', null, S.buyer.notCumulative),
        U.buyerTable(st, b, 'buyer'),
      ])
    }

    function orderDetail(id) {
      const o = HBS.order(id)
      if (!o || o.buyerId !== buyerId) return U.empty(S.common.notFound, S.common.notFoundNote)
      return el('div', { class: 'hs-stack' }, [
        el('a', { class: 'hs-btn hs-btn--quiet hs-noprint', href: U.href('/orders') }, S.fill(S.common.backTo, { label: S.buyer.statement })),
        U.card({
          title: S.fill(S.buyer.orderDetail, { id }),
          note: HBS.seller(o.sellerId).name + ' · ' + o.date,
          actions: [el('button', { class: 'hs-btn hs-btn--sm', type: 'button', onclick: () => window.print() }, S.common.exportPdf)],
          body: U.orderBreakdown(id, { role: 'buyer' }),
        }),
      ])
    }
  }

  // Registered as a named app so one bundled page can start whichever surface the URL
  // asks for; the multi-file build has no HBS_SINGLE and still starts itself.
  root.HBSApps = root.HBSApps || {}
  root.HBSApps.buyer = start
  if (!root.HBS_SINGLE) {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start)
    else start()
  }
})(typeof globalThis !== 'undefined' ? globalThis : this)

</script>
<script>
/*
 * Start whichever surface the URL asks for, and be able to do it again.
 *
 * In the multi-file build the page decides which app runs; here the query does. Because
 * the bundle switches surface without navigating, starting has to be repeatable: close
 * any open drawer, tear down what is mounted, and start the next one.
 */
window.HBSBoot = function () {
  HBSUI.closeDrawer()
  var kids = Array.prototype.slice.call(document.body.children)
  for (var i = 0; i < kids.length; i++) if (kids[i].tagName !== 'SCRIPT' && kids[i].id !== 'hs-css-check') kids[i].remove()
  document.body.style.overflow = ''
  var role = new URLSearchParams(location.search).get('role')
  if (['buyer', 'seller', 'admin'].indexOf(role) < 0) role = null
  document.body.setAttribute('data-role', role || 'picker')
  HBSApps[role || 'picker']()
}
window.HBSBoot()
</script>
