            U.ratio({
              label: S.standing.discountRatio, value: st.inputs.discountRatio.value, threshold: RULES.watch.discountRatio,
              dir: 'above', display: st.inputs.discountRatio.value.toFixed(2),
              foot: U.moneyText(st.inputs.discountRatio.numerator, { currency: true }) + ' funded against ' + U.moneyText(st.inputs.discountRatio.denominator, { currency: true }) + ' earned',
              thresholdLabel: 'limit 1.00',
            }),
          ]),
        }),

        el('div', { class: 'hb-stack' }, [
          U.card({
            title: S.standing.title,
            body: [
              el('div', { style: { marginBottom: '14px' } }, U.standingBadge(st.grade)),
              el('h3', { class: 'hb-h3' }, S.standing.triggeredBy),
              st.triggers.length === 0
                ? el('p', { class: 'hb-sub', style: { margin: 0 } }, S.standing.noTrigger)
                : el('ul', { class: 'hb-sub', style: { margin: 0, paddingInlineStart: '18px' } },
                  st.triggers.map((t) => el('li', {}, S.fill(t.dir === 'below' ? S.standing.triggerBelow : S.standing.triggerAbove, {
                    label: S.standing[t.input],
                    value: t.input === 'onlineShare' ? HB.pct(t.value, 1) : t.value.toFixed(2),
                    threshold: t.input === 'onlineShare' ? HB.pct(t.threshold, 1) : t.threshold.toFixed(2),
                  })))),
            ],
            foot: el('div', {}, [
              el('h3', { class: 'hb-h3' }, S.standing.toImprove),
              advice.length === 0
                ? el('p', { class: 'hb-sub', style: { margin: 0 } }, S.standing.nothingToImprove)
                : el('ul', { class: 'hb-sub', style: { margin: 0, paddingInlineStart: '18px' } }, advice.map((a) => el('li', {}, a))),
            ]),
          }),
          U.card({
            title: 'The four grades',
            body: el('dl', { class: 'hb-kv' }, [
              el('dt', {}, U.standingBadge('good')), el('dd', { style: { fontWeight: '400', color: 'var(--ink-2)' } }, 'No ratio near its limit'),
              el('dt', {}, U.standingBadge('watch')), el('dd', { style: { fontWeight: '400', color: 'var(--ink-2)' } }, 'Collection floor, discount limit, or dues at half the ceiling'),
              el('dt', {}, U.standingBadge('late')), el('dd', { style: { fontWeight: '400', color: 'var(--ink-2)' } }, 'Dues at 80% of the ceiling'),
              el('dt', {}, U.standingBadge('suspended')), el('dd', { style: { fontWeight: '400', color: 'var(--ink-2)' } }, 'Dues at or over the ceiling'),
            ]),
          }),
        ]),
      ]),
    ])
  }

  // ── Settlement ledger ────────────────────────────────────────────────────
  const filters = { type: 'all', route: 'all' }

  function ledger() {
    const m = U.modes()
    const b = HB.balance(SELLER_ID, m)
    const rows = b.postings.filter((p) => {
      if (filters.type !== 'all' && p.type !== filters.type) return false
      if (filters.route !== 'all') {
        const o = p.orderId && HB.order(p.orderId)
        if (!o || o.paymentRoute !== filters.route) return false
      }
      return true
    })

    // The running total is computed over the rows in ledger order, so the last row of an
    // unfiltered ledger equals the book balance on the wallet. Two screens, one number.
    let running = 0
    const withRunning = rows.map((p) => ({ p, running: (running += p.amount) }))

    const body = rows.length === 0
      ? U.empty(S.ledger.empty, S.ledger.emptyNote,
        el('button', {
          class: 'hb-btn hb-btn--outline hb-btn--sm', style: { marginTop: '12px' },
          onclick: () => { filters.type = 'all'; filters.route = 'all'; render() },
        }, 'Clear filters'))
      : U.table({
        columns: [
          { label: S.ledger.colDate, cell: (r) => r.p.date },
          { label: S.ledger.colType, cell: (r) => U.frag([U.postingChip(r.p.type), ' ', el('span', { class: 'muted', style: { fontSize: '12px' } }, r.p.label)]) },
          { label: S.ledger.colOrder, cell: (r) => r.p.orderId || el('span', { class: 'muted' }, r.p.payoutId) },
          { label: S.ledger.colRoute, cell: (r) => (r.p.orderId ? U.routePill(HB.order(r.p.orderId).paymentRoute) : el('span', { class: 'muted' }, '—')) },
          { label: S.ledger.colTerms, cell: (r) => (r.p.orderId ? U.termsPill(HB.order(r.p.orderId).terms) : el('span', { class: 'muted' }, '—')) },
          { label: S.ledger.colRate, cell: (r) => (r.p.orderId ? U.pill(r.p.rateCardVersion, 'navy') : el('span', { class: 'muted' }, '—')) },
          { label: S.ledger.colAmount, num: true, cell: (r) => U.money(r.p.amount, { tone: 'auto', signed: r.p.amount > 0 }) },
          { label: S.ledger.runningTotal, num: true, cell: (r) => U.money(r.running, { class: 'muted' }) },
        ],
        rows: withRunning,
        rowKey: (r) => r.p.orderId,
        rowLabel: (r) => 'Open ' + r.p.orderId,
        onRowClick: (r) => r.p.orderId && openOrder(r.p.orderId),
        foot: [
          { cell: S.ledger.runningTotal, span: 6 },
          { cell: U.money(HB.sum(rows.map((r) => r.amount)), { currency: true, tone: 'auto' }), num: true },
          { cell: '' },
        ],
      })

    return U.frag([
      U.filingWarning(SELLER_ID),
      U.note('One ledger, six posting types',
        'Every row carries the code that says what kind of movement it is, the payment route, the terms, and the rate card that priced it. The running total is derived here — the last row equals the wallet’s book balance by construction.'),
      U.card({
        title: S.ledger.title, note: S.ledger.note, flush: true,
        body: U.frag([
          el('div', { class: 'hb-card-body', style: { paddingBottom: '12px' } },
            el('div', { class: 'hb-filters' }, [
              el('span', { class: 'hb-filter-label' }, S.ledger.filterType),
              U.segmented([{ value: 'all', label: S.ledger.all }].concat(Object.keys(HB.POSTING).map((c) => ({ value: c, label: c }))),
                filters.type, (v) => { filters.type = v; render() }),
              el('span', { class: 'hb-filter-label', style: { marginInlineStart: '10px' } }, S.ledger.filterRoute),
              U.segmented([
                { value: 'all', label: S.ledger.all },
                { value: 'highbase', label: S.ledger.highbase },
                { value: 'seller', label: S.ledger.direct },
              ], filters.route, (v) => { filters.route = v; render() }),
            ])),
          body,
        ]),
      }),
    ])
  }

  // ── Payout runs ──────────────────────────────────────────────────────────
  function runsList() {
    const m = U.modes()
    const s = HB.seller(SELLER_ID)
    const run = HB.settlementRun(SELLER_ID, m)
    const paid = HB.PAYOUTS.filter((p) => p.sellerId === SELLER_ID)
      .map((p) => ({ id: p.runId, cycle: s.cycle.label, status: 'paid', net: p.amount, date: p.date, href: null }))
      .reverse()
    const pending = {
      id: run.id, cycle: s.cycle.label, date: s.nextPayoutDate,
      status: run.refused ? 'refused' : run.unfunded > 0 ? 'capped' : 'pending',
      net: run.net, href: U.href('/runs/' + run.id),
    }

    return U.frag([
      U.filingWarning(SELLER_ID),
      U.note('The payout rule',
        'A run never releases more than the cash Highbase holds. The pending run is computed with MAX(cashBacked + MIN(accrued, 0), 0) — open it to see the arithmetic rather than the result.'),
      U.card({
        title: S.runs.title, note: S.runs.note, flush: true,
        body: U.table({
          columns: [
            { label: S.runs.colRun, cell: (r) => (r.href ? el('a', { href: r.href }, r.id) : r.id) },
            { label: S.runs.colCycle, cell: (r) => r.cycle },
            { label: S.ledger.colDate, cell: (r) => r.date },
            { label: S.runs.colStatus, cell: (r) => U.pill(S.runs[r.status], r.status === 'paid' ? 'navy' : r.status === 'refused' ? 'red' : r.status === 'capped' ? 'orange' : 'green') },
            { label: S.runs.colNet, num: true, cell: (r) => U.money(r.net, { currency: true }) },
          ],
          rows: [pending].concat(paid),
        }),
      }),
    ])
  }

  function runDetail(runId) {
    const m = U.modes()
    const s = HB.seller(SELLER_ID)
    if (runId !== s.cycle.id) {
      return U.card({
        title: S.runs.title,
        body: U.empty(S.common.notFound, S.common.notFoundNote,
          el('a', { class: 'hb-btn hb-btn--outline hb-btn--sm', href: U.href('/runs'), style: { marginTop: '12px' } }, '← ' + S.runs.title)),
      })
    }

    const run = HB.settlementRun(SELLER_ID, m)
    const b = HB.balance(SELLER_ID, m)
    const included = run.included.map(HB.order)

    return U.frag([
      U.filingWarning(SELLER_ID),
      U.riskBanner(),
      U.note('MAX(cashBacked + MIN(accrued, 0), 0)',
        'The net is shown as the computation, not as a result. MIN(accrued, 0) is the load-bearing half: a positive accrual — a discount Highbase owes but has not funded in cash — never increases what can be released.'),

      el('div', { style: { display: 'grid', gridTemplateColumns: 'minmax(0,1fr) minmax(0,.85fr)', gap: '18px', alignItems: 'start' } }, [
        U.card({
          title: S.fill(S.runs.detailTitle, { id: runId }),
          note: s.cycle.label + ' · ' + S.runs[run.refused ? 'refused' : 'pending'],
          body: [
            el('h3', { class: 'hb-h3' }, S.runs.computation),
            U.calc([
              { label: S.runs.grossCollected, value: run.cashCollected },
              { label: S.runs.alreadyPaid, value: -run.alreadyPaid },
              { label: S.runs.cashAvailable, value: run.cashBacked, rule: true },
              { label: S.runs.commissionNetted, value: -run.commissionNetted },
              { label: S.runs.discountsReimbursed, value: run.discountsReimbursed },
              { label: S.runs.negativeAccruals, value: Math.min(run.accrued, 0) },
              { label: S.runs.netRelease, value: run.net, rule: true },
            ], S.runs.formula + '  =  MAX(' + U.moneyText(run.cashBacked) + ' + MIN(' + U.moneyText(run.accrued) + ', 0), 0)  =  ' + U.moneyText(run.net)),
            run.refused
              ? el('div', { style: { marginTop: '14px' } }, U.banner('bad', S.runs.refusedNote, run.refusedReason))
              : b.unfunded > 0
                ? el('div', { style: { marginTop: '14px' } }, U.banner('warn', null, S.fill(S.runs.cappedBy, { gap: U.moneyText(b.unfunded, { currency: true }) })))
                : null,
          ],
        }),

        el('div', { class: 'hb-stack' }, [
          U.card({
            title: S.runs.included, note: included.length + ' of ' + HB.ordersFor(SELLER_ID).length + ' orders in this cycle', flush: true,
            body: included.length === 0
              ? U.empty('Nothing to settle', 'No order in this cycle is releasable under the current risk model.')
              : U.table({
                columns: [
                  { label: S.ledger.colOrder, cell: (o) => o.id },
                  { label: S.ledger.colRoute, cell: (o) => U.routePill(o.paymentRoute) },
                  { label: 'Value', num: true, cell: (o) => U.money(o.grossValue, { tone: 'negative' }) },
                ],
                compact: true,
                rows: included,
                rowKey: (o) => o.id,
                rowLabel: (o) => 'Open ' + o.id,
                onRowClick: (o) => openOrder(o.id),
              }),
          }),
          U.card({
            title: S.runs.carried,
            note: run.carried.length ? 'Each with the reason it did not settle.' : null,
            flush: run.carried.length > 0,
            body: run.carried.length === 0
              ? U.empty(S.runs.carriedNone, 'No order is waiting on a delivery confirmation, an open return window, or a buyer.')
              : U.table({
                columns: [
                  { label: S.ledger.colOrder, cell: (c) => c.orderId },
                  { label: 'Reason', cell: (c) => el('span', { class: 'hb-sub', style: { margin: 0 } }, c.reason) },
                  { label: 'Amount', num: true, cell: (c) => U.money(c.amount) },
                ],
                compact: true,
                rows: run.carried,
                rowKey: (c) => c.orderId,
                rowLabel: (c) => 'Open ' + c.orderId,
                onRowClick: (c) => c.orderId && openOrder(c.orderId),
              }),
          }),
        ]),
      ]),
    ])
  }

  // ── Rate card ────────────────────────────────────────────────────────────
  function rateCardView() {
    const m = U.modes()
    const s = HB.seller(SELLER_ID)
    const applied = HB.rateCard(s.rateCardId)
    const advertised = HB.advertisedCard()
    const orders = HB.ordersFor(SELLER_ID)
    const mix = HB.collectionMix(SELLER_ID, m)
    const commission = HB.reconcile(SELLER_ID, m).expectedTotal
    const gap = HB.advertisedGap(SELLER_ID, m)

    return U.frag([
      U.note('Versioned terms',
        'A rate card is versioned and dated because "3% today" is not an answer to "why was this order charged 15.000 in June". Every posting names the card that priced it.'),
      el('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(330px, 1fr))', gap: '18px', alignItems: 'start' } }, [
        U.card({
          title: S.rateCard.applied, note: S.rateCard.appliedNote,
          actions: [U.pill(applied.version, 'green')],
          body: [
            el('div', { style: { fontSize: '32px', fontWeight: '700', letterSpacing: '-.02em', marginBottom: '10px' } }, (applied.rate * 100) + '%'),
            el('dl', { class: 'hb-kv' }, [
              el('dt', {}, 'Model'), el('dd', {}, applied.label),
              el('dt', {}, 'Effective from'), el('dd', {}, applied.effectiveFrom),
              el('dt', {}, S.rateCard.commissionThisCycle), el('dd', {}, U.money(commission, { currency: true })),
              el('dt', {}, 'Applied to'), el('dd', {}, S.fill(S.rateCard.onOrders, { n: orders.length, value: U.moneyText(mix.net, { currency: true }) })),
            ]),
          ],
        }),
        U.card({
          title: S.rateCard.conflict,
          actions: [U.pill(S.rateCard.stale, 'red')],
          body: [
            U.banner('warn', advertised.label, S.fill(S.rateCard.conflictNote, {
              label: advertised.label, date: advertised.effectiveFrom, applied: applied.label,
            })),
            /*
             * The seller's own number, not the platform's. Telling a seller a screen was
             * wrong is a disclosure; telling them what it cost them is the disclosure
             * being useful — and it is the same figure the admin's claim table shows, so
             * neither side is working from a number the other cannot see.
             */
            gap ? el('div', { style: { marginTop: '14px' } }, U.calc([
              { label: S.fill('{label} would have charged', { label: advertised.label }), value: gap.wouldCharge, plain: true },
              { label: 'You were charged', value: gap.charged, plain: true },
              { label: 'Difference', value: gap.gap, rule: true },
            ])) : null,
            gap && gap.overcharged
              ? el('p', { class: 'hb-sub', style: { marginTop: '12px' } }, S.fill(S.rateCard.conflictGap, {
                would: U.moneyText(gap.wouldCharge, { currency: true }),
                charged: U.moneyText(gap.charged, { currency: true }),
                gap: U.moneyText(gap.gap, { currency: true }),
              }))
              : null,
          ],
        }),
      ]),
    ])
  }

  // ── Routing ──────────────────────────────────────────────────────────────
  const routes = {
    '/wallet': { title: S.wallet.title, nav: '/wallet', view: wallet },
    '/standing': { title: S.standing.title, nav: '/standing', view: standingView },
    '/ledger': { title: S.ledger.title, nav: '/ledger', view: ledger },
    '/runs': { title: S.runs.title, nav: '/runs', view: runsList },
    '/runs/:id': { title: S.runs.title, nav: '/runs', view: (p) => runDetail(p.id), titleOf: (p) => S.fill(S.runs.detailTitle, { id: p.id }) },
    '/rate-card': { title: S.rateCard.title, nav: '/rate-card', view: rateCardView },
  }

  let current = { pattern: '/wallet', params: {} }

  function render() {
    const r = routes[current.pattern]
    shell.content.textContent = ''
    if (!r) { shell.content.appendChild(U.empty(S.common.notFound, S.common.notFoundNote)); return }
    // The designed loading and error states, reachable from the sidebar. See ui.js.
    const demo = U.demoState()
    if (demo) {
      shell.content.appendChild(el('div', { class: 'hb-stack' }, [
        U.card({
          title: r.title,
          note: demo === 'loading' ? S.common.loadingNote : S.common.errorNote2,
          flush: true,
          body: demo === 'loading' ? U.loading(6) : U.errorState(),
          foot: el('a', { class: 'hb-btn hb-btn--quiet', href: U.stateHref(null) }, '← ' + S.common.backToLive),
        }),
      ]))
      return
    }
    const s = HB.seller(SELLER_ID)
    shell.setTitle(r.titleOf ? r.titleOf(current.params) : r.title, s.name + ' · #' + SELLER_ID + ' · ' + s.cycle.label)
    shell.setActive(r.nav)
    try {
      shell.content.appendChild(el('div', { class: 'hb-stack' }, [r.view(current.params)]))
    } catch (err) {
      shell.content.appendChild(U.errorState())
      if (typeof console !== 'undefined') console.error(err)
    }
    if (window.HBTest) window.HBTest.run({ quiet: true })
  }

  U.router(routes, {
    fallback: '/wallet',
    render: (pattern, params) => { current = { pattern: pattern, params: params }; render() },
  }).go()

  // The acceptance tests run on load, including the DOM half of test 18 now that a
  // surface exists to scan.
  if (window.HBTest) window.HBTest.run()
  }
})(typeof globalThis !== 'undefined' ? globalThis : this)

</script>
<script>
/**
 * Highbase admin — settlement runs, the reconciliation control, adjustments, rate cards
 * and exposure.
 *
 * Two roles share this surface. Ops issues and corrects; Finance approves and pays. The
 * actor switch is not a demo convenience — the approve action changes with it, because the
 * separation of duties is the control. Hiding the action from Ops would teach nobody why
 * it is hidden; refusing it, with the reason, teaches exactly that.
 */
;(function (root) {
  root.HBApps = root.HBApps || {}
  /*
   * A named app rather than an IIFE that runs itself, so the four surfaces can be bundled
   * into one file and the right one started on demand. The multi-file build calls this at
   * the foot of its own page; the single-file build picks by role.
   */
  root.HBApps.admin = function (HB, S, U) {
    'use strict'

  const el = U.el

  const NAV = [
    { label: S.nav.control, items: [
      { href: '/control', label: S.nav.reconciliation, icon: '⚖' },
      { href: '/adjustments', label: S.nav.adjustments, icon: '±' },
    ] },
    { label: S.nav.settlement, items: [
      { href: '/runs', label: S.nav.runs, icon: '↗' },
      { href: '/rate-cards', label: S.nav.rateCards, icon: '%' },
    ] },
    { label: S.nav.exposure, items: [
      { href: '/exposure', label: S.nav.sellerExposure, icon: '▤' },
      { href: '/buyers', label: S.nav.buyerExposure, icon: '◇' },
    ] },
  ]

  /** Ops or Finance, carried in the query string like the other two modes. */
  function actor() {
    return new URLSearchParams(location.search).get('actor') === 'finance' ? 'finance' : 'ops'
  }
  function actorToggle() {
    return el('div', { class: 'hb-risk' }, [
      el('span', { class: 'hb-filter-label' }, S.admin.actorShort),
      U.segmented([
        { value: 'ops', label: S.admin.ops },
        { value: 'finance', label: S.admin.finance },
      ], actor(), (v) => {
        const url = new URL(location.href)
        if (v === 'ops') url.searchParams.delete('actor')
        else url.searchParams.set('actor', v)
        location.href = url.toString()
      }),
    ])
  }

  const shell = U.shell({
    persona: S.personas.admin, personaName: S.admin[actor()],
    title: S.control.title, nav: NAV,
  })

  // The actor switch belongs beside the other two modes in the header.
  document.querySelector('.hb-top-right').prepend(actorToggle())

  const openOrder = (id) => U.lifecycle(id, { role: 'admin' })

  // ── Reconciliation control — the proof screen ────────────────────────────
  function control() {
    const m = U.modes()
    const all = HB.reconcileAll(m)
    const inScope = HB.sum(all.each.map((r) => r.rows.length))

    const offenderRows = all.offenders.map((o) => Object.assign({}, o, { seller: HB.seller(o.sellerId) }))
    const anatomy = offenderRows.length ? HB.errorAnatomy(offenderRows[0].sellerId, offenderRows[0].orderId) : null
    const over = offenderRows.length ? HB.overstatement(offenderRows[0].sellerId, m) : null

    return U.frag([
      U.note('One query, named rows',
        'The total says the book is wrong; the per-order rows say which row to open. That is the difference between a control that starts an investigation and one that starts an argument.'),

      el('div', { class: 'hb-banner hb-banner--' + (all.passes ? 'good' : 'bad'), style: { alignItems: 'center' } }, [
        el('div', { style: { flex: '1' } }, [
          el('strong', {}, all.passes ? S.control.passes : S.control.fails),
          el('div', {}, all.passes ? S.control.passesNote : S.control.failsNote),
          el('div', { class: 'hb-calc-expr', style: { marginTop: '10px', background: 'rgba(255,255,255,.6)' } }, S.control.query),
        ]),
      ]),

      el('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(210px, 1fr))', gap: '12px' } }, [
        statTile(S.control.expected, all.expectedTotal, null),
        statTile(S.control.actual, all.actualTotal, all.delta !== 0 ? 'bad' : null),
        statTile(S.control.delta, all.delta, all.delta !== 0 ? 'bad' : 'good', { signed: true }),
        statTile(S.control.inScope, null, null, null, inScope + ' orders'),
      ]),

      U.card({
        title: S.control.offenders,
        note: S.fill(S.control.inScopeNote, { n: inScope }),
        flush: offenderRows.length > 0,
        body: offenderRows.length === 0
          ? U.empty(S.control.offendersNone, S.control.offendersNoneNote)
          : U.table({
            columns: [
              { label: S.control.colSeller, cell: (r) => r.seller.name + ' · #' + r.sellerId },
              { label: S.control.colOrder, cell: (r) => el('strong', {}, r.orderId) },
              { label: S.control.colValue, num: true, cell: (r) => U.money(r.orderValue, { tone: 'negative' }) },
              { label: S.control.expected, num: true, cell: (r) => U.money(r.expected, { tone: 'auto', signed: r.expected > 0 }) },
              { label: S.control.actual, num: true, cell: (r) => U.money(r.actual, { tone: 'auto', signed: r.actual > 0 }) },
              { label: S.control.delta, num: true, cell: (r) => U.money(r.delta, { signed: true, tone: 'auto' }) },
            ],
            rows: offenderRows,
            rowKey: (r) => r.orderId,
            rowLabel: (r) => 'Open ' + r.orderId,
            onRowClick: (r) => openOrder(r.orderId),
          }),
      }),

      anatomy ? el('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(340px, 1fr))', gap: '18px', alignItems: 'start' } }, [
        U.card({
          title: S.control.anatomy + ' — ' + anatomy.orderId, note: S.control.anatomyNote,
          body: [
            U.calc([
              { label: S.control.cashLeg, value: anatomy.cashDelta },
              { label: S.control.commissionLeg, value: anatomy.commissionDelta },

    const m = U.modes()
    const s = HB.SELLERS.find((x) => x.cycle.id === runId)

      return U.card({
        title: S.runs.title,
        body: U.empty(S.common.notFound, S.common.notFoundNote,
          el('a', { class: 'hb-btn hb-btn--outline hb-btn--sm', href: U.href('/runs'), style: { marginTop: '12px' } }, '← ' + S.runs.title)),
      })
    }
    const run = HB.settlementRun(s.id, m)
    const b = HB.balance(s.id, m)
    const who = actor()
    const canPay = who === 'finance'

    return U.frag([
      U.filingWarning(s.id),
      U.note('The cash-backed test',
        'MAX(cashBacked + MIN(accrued, 0), 0). Seller #1067 is the worked example: the book owes 81.300, Highbase holds 81.000, and the 0.300 difference is a discount it has promised but not funded.'),

      el('div', { style: { display: 'grid', gridTemplateColumns: 'minmax(0,1fr) minmax(0,.8fr)', gap: '18px', alignItems: 'start' } }, [

          title: S.fill(S.runs.detailTitle, { id: run.id }),

          actions: [U.standingBadge(HB.standing(s.id, m).grade)],
          body: [
            U.calc([
              { label: S.runs.grossCollected, value: run.cashCollected },
              { label: S.runs.alreadyPaid, value: -run.alreadyPaid },

              { label: S.runs.discountsReimbursed, value: run.discountsReimbursed },
              { label: S.runs.negativeAccruals, value: Math.min(run.accrued, 0) },
              { label: S.runs.netRelease, value: run.net, rule: true },
            ], S.runs.formula + '  =  MAX(' + U.moneyText(run.cashBacked) + ' + MIN(' + U.moneyText(run.accrued) + ', 0), 0)  =  ' + U.moneyText(run.net)),

          el('dt', {}, S.adjustments.colFunder), el('dd', {}, a.funder ? (a.funder === 'highbase' ? 'Highbase' : 'Seller') : '—'),

  // ── Seller exposure ──────────────────────────────────────────────────────
  function exposure() {
    const m = U.modes()
    const ORDER = { suspended: 0, late: 1, watch: 2, good: 3 }
    const rows = HB.SELLERS.map((s) => {
      const b = HB.balance(s.id, m)
      const mix = HB.collectionMix(s.id, m)
      const st = HB.standing(s.id, m)
      const disc = HB.fundedDiscountRatio(s.id, m)
      return { s, b, mix, st, disc }
    }).sort((a, x) => ORDER[a.st.grade] - ORDER[x.st.grade])

    const worst = rows.find((r) => r.st.grade === 'suspended')
    const unsecured = HB.sum(rows.map((r) => r.b.dues))

    return U.frag([
      U.filingWarning(null),
      U.note('The row this model exists for',
        'A seller who collects every order himself generates commission Highbase cannot net against anything. Sorted worst first, because an exposure report ordered by seller id hides its own headline.'),

      worst ? U.banner('bad', S.exposure.alarm, S.fill(S.exposure.alarmNote, {
        dues: U.moneyText(worst.b.dues, { currency: true }), name: worst.s.name,
      })) : null,

      el('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(210px, 1fr))', gap: '12px' } }, [
        statTile(S.exposure.unsecuredTotal, unsecured, unsecured > 0 ? 'bad' : null),
        statTile('Sellers under watch or worse', null, null, null, String(rows.filter((r) => r.st.grade !== 'good').length) + ' of ' + rows.length),
        statTile('Cash held across the book', HB.sum(rows.map((r) => r.b.cashBacked))),
      ]),

      U.card({
        title: S.exposure.title, note: S.exposure.unsecuredNote, flush: true,
        body: U.table({
          columns: [
            { label: S.exposure.colSeller, cell: (r) => el('strong', {}, r.s.name) },
            { label: S.exposure.colStanding, cell: (r) => U.standingBadge(r.st.grade) },
            { label: S.exposure.colMix, num: true, cell: (r) => HB.pct(r.mix.onlineShare, 1) },
            { label: S.exposure.colCash, num: true, cell: (r) => U.money(r.b.cashBacked) },
            { label: S.exposure.colDues, num: true, cell: (r) => U.money(r.b.dues, { tone: r.b.dues > 0 ? 'neg' : null }) },
            { label: S.exposure.colArrears, num: true, cell: (r) => el('span', { class: r.st.inputs.arrearsRatio.value >= 1 ? 'neg' : null },
              r.st.inputs.arrearsRatio.value.toFixed(2) + ' / 1.00') },
            { label: S.exposure.colDiscount, num: true, cell: (r) => el('span', { class: r.disc.ratio >= 1 ? 'neg' : null }, r.disc.ratio.toFixed(2)) },
          ],
          rows,
          rowKey: (r) => r.s.id,
          rowLabel: (r) => 'Open the run for ' + r.s.name,
          onRowClick: (r) => { location.hash = '/runs/' + r.s.cycle.id },
        }),
      }),
    ])
  }

    '/rate-cards': { title: S.rateCards.title, nav: '/rate-cards', view: rateCardsView },
    '/exposure': { title: S.exposure.title, nav: '/exposure', view: exposure },
    '/buyers': { title: S.exposure.buyerTitle, nav: '/buyers', view: buyerExposure },
  }

  let current = { pattern: '/control', params: {} }

  function render() {
    const r = routes[current.pattern]
    shell.content.textContent = ''
    if (!r) { shell.content.appendChild(U.empty(S.common.notFound, S.common.notFoundNote)); return }
    // The designed loading and error states, reachable from the sidebar. See ui.js.
    const demo = U.demoState()
    if (demo) {
      shell.content.appendChild(el('div', { class: 'hb-stack' }, [
        U.card({
          title: r.title,
          note: demo === 'loading' ? S.common.loadingNote : S.common.errorNote2,
          flush: true,
          body: demo === 'loading' ? U.loading(6) : U.errorState(),
          foot: el('a', { class: 'hb-btn hb-btn--quiet', href: U.stateHref(null) }, '← ' + S.common.backToLive),
        }),
      ]))
      return
    }
    // The role's remit is explained where it bites — on the adjustments queue and the
    // run's pay button — not repeated as a header subtitle that pushes the toggles onto
    // a second line.
    shell.setTitle(r.titleOf ? r.titleOf(current.params) : r.title,
      S.personas.admin + ' · ' + S.admin[actor()])
    shell.setActive(r.nav)
    try {
      shell.content.appendChild(el('div', { class: 'hb-stack' }, [r.view(current.params)]))
    } catch (err) {
      shell.content.appendChild(U.errorState())
      if (typeof console !== 'undefined') console.error(err)
    }
  }

  U.router(routes, {
    fallback: '/control',
    render: (pattern, params) => { current = { pattern: pattern, params: params }; render() },
  }).go()

  if (window.HBTest) window.HBTest.run()
  }
})(typeof globalThis !== 'undefined' ? globalThis : this)

</script>
<script>
/**
 * Buyer dashboard — checkout, invoices, statement, credit account, price match.
 *
 * INVARIANT 2 governs this whole file: commission is a Highbase↔seller relationship and
 * nothing here may show it. That is enforced twice over — every figure comes from
 * `HB.invoices` / `HB.statement` / `HB.creditAccount` / `HB.buyerView`, none of which
 * carry a commission field, and the shared lifecycle drawer is opened with role 'buyer',
 * which withholds the commission and funding stages in the component rather than trusting
 * this file to leave them out.
 */
;(function (root) {
  root.HBApps = root.HBApps || {}
  /*
   * A named app rather than an IIFE that runs itself, so the four surfaces can be bundled
   * into one file and the right one started on demand. The multi-file build calls this at
   * the foot of its own page; the single-file build picks by role.
   */
  root.HBApps.buyer = function (HB, S, U) {
    'use strict'

  const el = U.el

  /* Which buyer's account this is, like the seller surface's switcher. */
  function buyerId() {
    const q = new URLSearchParams(location.search).get('buyer')
    return HB.BUYERS.some((b) => b.id === q) ? q : 'B-203'
  }
  const BUYER_ID = buyerId()

  function buyerSwitch() {
    return el('div', { class: 'hb-risk' }, [
      el('span', { class: 'hb-filter-label' }, S.personas.buyer),
      el('select', {
        class: 'hb-input hb-input--date', 'aria-label': S.personas.buyer,
        onchange: (e) => {
          const url = new URL(location.href)
          if (e.target.value === 'B-203') url.searchParams.delete('buyer')
          else url.searchParams.set('buyer', e.target.value)
          location.href = url.toString()
        },
      }, HB.BUYERS.map((b) => el('option', { value: b.id, selected: b.id === BUYER_ID || null },
        b.name + (b.exampleData ? ' · example' : '')))),
    ])
  }

  const NAV = [
    { label: 'Orders', items: [
      { href: '/checkout', label: S.nav.checkout, icon: '⊕' },
      { href: '/price-match', label: S.nav.priceMatch, icon: '⚑' },
    ] },
    { label: S.nav.money, items: [
      { href: '/invoices', label: S.nav.invoices, icon: '☰' },
      { href: '/statement', label: S.nav.statement, icon: '▤' },
      { href: '/credit', label: S.nav.credit, icon: '◑' },
    ] },
  ]

  const shell = U.shell({
    persona: S.personas.buyer, personaName: HB.buyer(BUYER_ID).name,
    title: S.invoices.title, nav: NAV,
  })

  // The reference date belongs beside the other modes: this surface is almost entirely
  // statements about now.
  document.querySelector('.hb-top-right').prepend(U.todayControl())
  document.querySelector('.hb-top-right').prepend(buyerSwitch())

  const openOrder = (id) => U.lifecycle(id, { role: 'buyer' })
  const invoiceOf = (number) => HB.invoices(BUYER_ID, U.modes()).find((i) => i.number === number)

  /** The status pill, with its timing sub-state where it has one. */
  function statusPill(inv) {
    const tone = inv.status === 'paid' ? 'green'
      : inv.status === 'draft' ? 'navy'
        : inv.subStatus === 'overdue' ? 'red'
          : inv.subStatus === 'due_soon' ? 'orange' : 'blue'
    return U.frag([
      U.pill(S.invoices[inv.status], tone),
      inv.subStatus ? U.frag([' ', el('span', { class: 'hb-sub', style: { margin: 0, fontSize: '12px' } }, S.invoices[inv.subStatus])]) : null,
    ])
  }

  // ── Checkout — the decision that drives everything ───────────────────────
  /*
   * The heaviest screen in the module, and today the choice it captures is not recorded as
   * a billing fact at all. Both options are shown with what they actually mean rather than
   * as a radio pair, because the buyer is choosing who holds their money and when — and
   * neither of those is obvious from the words "pay Highbase".
   */
  const draft = { route: 'highbase', terms: 'immediate', amount: HB.bhd(420) }

  function checkout() {
    const m = U.modes()
    const credit = HB.creditAccount(BUYER_ID, m)
    const vat = HB.round3(draft.amount * HB.VAT_RATE)
    const total = draft.amount + vat
    const creditEligible = draft.route === 'highbase'
    const wouldExceed = draft.terms === 'credit' && total > credit.available

    // Choosing to pay the supplier directly takes credit terms with it — Highbase cannot
    // extend credit on money it never touches.
    if (!creditEligible && draft.terms === 'credit') draft.terms = 'immediate'

    const choice = (group, value, label, note, disabled) => {
      const on = draft[group] === value
      return el('button', {
        type: 'button', class: 'hb-choice' + (on ? ' hb-choice--on' : ''),
        'aria-pressed': String(on), disabled: disabled || false,
        onclick: () => { draft[group] = value; render() },
      }, [
        el('span', { class: 'hb-choice-mark', 'aria-hidden': 'true' }, on ? '●' : '○'),
        el('span', {}, [el('strong', {}, label), el('span', { class: 'hb-choice-note' }, note)]),
      ])
    }

    return U.frag([
      U.note('Recorded, not inferred',
        'paymentRoute and terms become stored fields on the order. Today they are reconstructed afterwards from which column has a number in it, which is how an order collected by the seller ends up looking like cash Highbase is holding.'),

      el('div', { style: { display: 'grid', gridTemplateColumns: 'minmax(0,1.2fr) minmax(0,.8fr)', gap: '18px', alignItems: 'start' } }, [
        el('div', { class: 'hb-stack' }, [
          U.card({
            title: S.checkout.route, note: S.checkout.note,
            body: el('div', { class: 'hb-choices' }, [
              choice('route', 'highbase', S.checkout.routeHighbase, S.checkout.routeHighbaseNote),
              choice('route', 'seller', S.checkout.routeSeller, S.checkout.routeSellerNote),
            ]),
          }),
          U.card({
            title: S.checkout.terms,
            body: [
              el('div', { class: 'hb-choices' }, [
                choice('terms', 'immediate', S.checkout.termsImmediate, S.checkout.termsImmediateNote),
                choice('terms', 'credit', S.checkout.termsCredit,
                  creditEligible ? S.checkout.termsCreditNote : S.checkout.termsUnavailable + ' — ' + S.checkout.routeSellerNote,
                  !creditEligible),
              ]),
              wouldExceed
                ? el('div', { style: { marginTop: '14px' } }, U.banner('bad', S.checkout.exceedsTitle, S.fill(S.checkout.exceeds, {
                  available: U.moneyText(credit.available, { currency: true }), needed: U.moneyText(total, { currency: true }),
                }) + ' ' + credit.atLimit))
                : null,
            ],
          }),
        ]),

        el('div', { class: 'hb-stack' }, [
          U.card({
            title: S.checkout.summary,
            body: [
              U.calc([
                { label: S.checkout.subtotal, value: draft.amount, plain: true },
                { label: S.fill(S.checkout.vat, { rate: HB.pct(HB.VAT_RATE, 1, 0) }), value: vat, plain: true },
                { label: S.checkout.total, value: total, rule: true },
              ]),
              el('dl', { class: 'hb-kv', style: { marginTop: '14px' } }, [
                el('dt', {}, S.checkout.due),
                el('dd', {}, draft.terms === 'credit' ? S.fill(S.checkout.dueBy, { date: '30 days after delivery' }) : S.checkout.dueOnDelivery),
                el('dt', {}, S.checkout.creditImpact),
                el('dd', {}, draft.terms === 'credit' ? U.money(total, { currency: true }) : el('span', { class: 'muted' }, '—')),
              ]),
              el('p', { class: 'hb-sub' }, draft.terms === 'credit' ? '' : S.checkout.creditImpactNone),
            ],
            foot: el('button', { class: 'hb-btn hb-btn--primary hb-btn--block', disabled: wouldExceed }, S.checkout.place),
          }),
          U.card({
            title: S.checkout.recorded, note: S.checkout.recordedNote,
            body: el('div', { class: 'hb-calc-expr' },
              'paymentRoute: ' + JSON.stringify(draft.route) + '\n' +
              'terms:        ' + JSON.stringify(draft.terms) + '\n' +
              'dueDate:      ' + (draft.terms === 'credit' ? '"delivery + 30 days"' : 'null')),
          }),
        ]),
      ]),
    ])
  }

  // ── Invoices ─────────────────────────────────────────────────────────────
  function invoicesList() {
    const m = U.modes()
    const rows = HB.invoices(BUYER_ID, m).slice().reverse()

    return U.frag([
      U.note('Status, then timing',
        'draft → open → paid, and an open invoice carries one of four timing sub-states derived from its due date against today. Move the reference date in the header and the sub-state moves with it.'),
      U.card({
        title: S.invoices.title, note: S.invoices.note, flush: rows.length > 0,
        body: rows.length === 0
          ? U.empty(S.invoices.empty, S.invoices.emptyNote)
          : U.table({
            columns: [
              { label: S.invoices.colNumber, cell: (i) => el('a', { href: U.href('/invoices/' + i.number) }, i.number) },
              { label: S.invoices.colSupplier, cell: (i) => i.supplier.name },
              { label: S.ledger.colRoute, cell: (i) => U.routePill(i.paymentRoute) },
              { label: S.ledger.colTerms, cell: (i) => U.termsPill(i.terms) },
              { label: S.invoices.colIssued, cell: (i) => i.issueDate },
              { label: S.invoices.colDue, cell: (i) => i.dueDate },
              { label: S.invoices.colTotal, num: true, cell: (i) => U.money(i.totalPayable, { currency: true }) },
              /* Outstanding is its own column rather than a footnote on the total: on a
                 part-paid invoice the total is no longer the number anyone acts on. */
              { label: S.invoices.colOutstanding, num: true, cell: (i) =>
                i.amountPaid > 0 || i.status === 'open'
                  ? U.money(i.amountOutstanding, { currency: true, tone: i.amountOutstanding > 0 ? 'neg' : null })
                  : el('span', { class: 'muted' }, '—') },
              { label: S.invoices.colStatus, cell: (i) => statusPill(i) },
            ],
            rows,
            rowKey: (i) => i.number,
            rowLabel: (i) => 'Open ' + i.number,
            onRowClick: (i) => { location.hash = '/invoices/' + i.number },
          }),
      }),
    ])
  }

  function invoiceDetail(number) {
    const inv = invoiceOf(number)
    if (!inv) {
      return U.card({
        title: S.invoices.title,
        body: U.empty(S.common.notFound, S.common.notFoundNote,
          el('a', { class: 'hb-btn hb-btn--outline hb-btn--sm', href: U.href('/invoices'), style: { marginTop: '12px' } }, '← ' + S.invoices.title)),
      })
    }
    const rate = HB.pct(inv.vatRate, 1, 0)

    return U.frag([
      U.note('The mandatory fields',
        'A Bahrain tax invoice must carry the supplier’s name, address and VAT number, the customer’s details, a sequential number, the issue and supply dates, a description, the taxable amount, the VAT amount and the total payable. All eleven are below.'),

      el('div', { style: { display: 'grid', gridTemplateColumns: 'minmax(0,1.25fr) minmax(0,.75fr)', gap: '18px', alignItems: 'start' } }, [
        U.card({
          title: S.fill(S.invoices.detailTitle, { number: inv.number }),
          note: S.invoices.taxInvoice,
          actions: [statusPill(inv)],
          body: [
            el('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(230px, 1fr))', gap: '18px', marginBottom: '18px' } }, [
              party(S.invoices.supplier, inv.supplier),
              party(S.invoices.customer, inv.customer),
            ]),
            el('dl', { class: 'hb-kv', style: { marginBottom: '18px' } }, [
              el('dt', {}, S.invoices.number), el('dd', {}, inv.number),
              el('dt', {}, S.invoices.issueDate), el('dd', {}, inv.issueDate),
              el('dt', {}, S.invoices.supplyDate), el('dd', {}, inv.supplyDate),
              el('dt', {}, S.invoices.dueDate), el('dd', {}, inv.dueDate),
            ]),
            el('h3', { class: 'hb-h3' }, S.invoices.lineItems),
            U.table({
              compact: true,
              columns: [
                { label: S.invoices.description, cell: (r) => r.label },
                { label: '', num: true, cell: (r) => U.money(r.value, { tone: r.value < 0 ? 'neg' : null }) },
              ],
              rows: [{ label: inv.description + ' · ' + inv.orderId, value: inv.grossValue }]
                .concat(inv.discount > 0 ? [{ label: S.invoices.discountLine, value: -inv.discount }] : [])
                .concat(inv.creditNote > 0 ? [{ label: S.invoices.creditNote, value: -inv.creditNote }] : []),
            }),
            el('div', { style: { marginTop: '14px' } }, U.calc(
              [
                { label: S.invoices.taxable, value: inv.taxableAmount, plain: true },
                { label: S.fill(S.invoices.vatAmount, { rate }), value: inv.vatAmount, plain: true },
                { label: S.invoices.total, value: inv.totalPayable, rule: true },
              ].concat(inv.amountPaid > 0 ? [
                { label: S.invoices.paid, value: -inv.amountPaid },
                { label: S.invoices.outstanding, value: inv.amountOutstanding, rule: true },
              ] : []))),
          ],
          foot: el('div', { style: { display: 'flex', gap: '10px', alignItems: 'center', flexWrap: 'wrap' } }, [
            inv.status === 'open'
              ? el('button', { class: 'hb-btn hb-btn--primary' },
                inv.amountPaid > 0 ? S.fill(S.invoices.payBalance, { amount: U.moneyText(inv.amountOutstanding, { currency: true }) }) : S.invoices.payNow)
              : el('span', { class: 'hb-sub', style: { margin: 0 } },
                inv.paymentRoute === 'seller' ? S.invoices.directNote : S.invoices.paidNote),
            inv.status === 'open' ? el('span', { class: 'hb-sub', style: { margin: 0 } }, S.invoices.payNote) : null,
          ]),
        }),

        el('div', { class: 'hb-stack' }, [
          U.card({
            title: 'Simplified invoice',
            body: [
              U.banner(inv.simplifiedPermitted ? 'info' : 'warn', null,
                S.fill(inv.simplifiedPermitted ? S.invoices.simplified : S.invoices.notSimplified, {
                  taxable: U.moneyText(inv.taxableAmount, { currency: true }),
                  max: U.moneyText(HB.SIMPLIFIED_INVOICE_MAX, { currency: true }),
                })),
              /* Said plainly, because this invoice is the case where it matters: 500.000
                 taxable and 550.000 payable land on opposite sides of the threshold. */
              el('p', { class: 'hb-sub', style: { marginTop: '10px' } }, S.invoices.simplifiedBasis),
            ],
          }),
          U.card({
            title: S.lifecycle.title,
            body: [
              el('p', { class: 'hb-sub', style: { marginTop: 0 } },
                'The same drawer the supplier and Highbase see, with the stages that are not yours withheld.'),
              el('button', { class: 'hb-btn hb-btn--outline', onclick: () => openOrder(inv.orderId) }, 'Open ' + inv.orderId + ' →'),
            ],
          }),
        ]),
      ]),
    ])
  }

  const party = (label, p) =>
    el('div', {}, [
      el('div', { class: 'hb-filter-label' }, label),
      el('div', { style: { fontWeight: '700', marginTop: '4px' } }, p.name),
      el('div', { class: 'hb-sub', style: { marginTop: '2px' } }, p.address),
      el('div', { class: 'hb-sub' }, S.invoices.vatNumber + ' ' + p.vatNumber),
    ])

  // ── Statement ────────────────────────────────────────────────────────────
  function statement() {
    const m = U.modes()
    const st = HB.statement(BUYER_ID, m)

    const age = (inv) => {
      const over = HB.daysBetween(inv.dueDate, st.today)
      return over > 0 ? S.fill(S.statement.daysOverdue, { n: over })
        : over === 0 ? S.statement.dueToday
          : S.fill(S.statement.daysToDue, { n: -over })
    }

    return U.frag([
      U.note('Open-item, aged from the due date',
        'Every open invoice is listed on its own line and aged individually. A balance-forward statement would roll them into one carried figure, and the buyer could no longer tell which invoice is late.'),

      el('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(190px, 1fr))', gap: '12px' } },
        st.buckets.map((b) =>
          el('div', { class: 'hb-card', style: { padding: '14px 16px', opacity: b.rows.length ? '1' : '.6' } }, [
            el('div', { class: 'hb-filter-label' }, b.label),
            el('div', { style: { fontSize: '20px', fontWeight: '700', marginTop: '2px', color: b.rows.length ? (b.key === 'current' ? 'var(--ink)' : 'var(--red)') : 'var(--ink-3)' } },
              U.money(b.total, { currency: true })),
            el('div', { class: 'hb-sub', style: { marginTop: '2px' } }, b.rows.length ? b.rows.length + ' invoice' + (b.rows.length === 1 ? '' : 's') : S.statement.bucketEmpty),
          ]))),

      U.card({
        title: S.statement.title,
        note: S.statement.note + ' ' + S.fill(S.statement.asAt, { date: st.today }),
        actions: [U.pill(S.statement.totalOpen + ' ' + U.moneyText(st.total, { currency: true }), st.total > 0 ? 'orange' : 'green')],
        flush: st.open.length > 0,
        body: st.open.length === 0
          ? U.empty(S.statement.empty, S.statement.emptyNote)
          : U.table({
            columns: [
              { label: S.statement.colInvoice, cell: (i) => el('a', { href: U.href('/invoices/' + i.number) }, i.number) },
              { label: S.invoices.colSupplier, cell: (i) => i.supplier.name },
              { label: S.statement.colDue, cell: (i) => i.dueDate },
              { label: S.statement.colAge, cell: (i) => age(i) },
              { label: S.invoices.colStatus, cell: (i) => statusPill(i) },
              { label: S.statement.colAmount, num: true, cell: (i) => U.money(i.amountOutstanding, { currency: true }) },
            ],
            rows: st.open,
            rowKey: (i) => i.number,
            rowLabel: (i) => 'Open ' + i.number,
            onRowClick: (i) => { location.hash = '/invoices/' + i.number },
          }),
      }),
    ])
  }

  // ── Credit account ───────────────────────────────────────────────────────
  function credit() {
    const m = U.modes()
    const c = HB.creditAccount(BUYER_ID, m)
    const invs = HB.invoices(BUYER_ID, m).filter((i) => c.openInvoices.indexOf(i.number) >= 0)

    return U.frag([
      U.note('Four policies, escalating',
        'The screen has to answer "what happens if I go over", and the honest answer depends entirely on which policy is set — so the behaviour is derived from the account rather than written into the copy.'),

      el('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(210px, 1fr))', gap: '12px' } }, [
        tile(S.credit.limit, c.limit, null),
        tile(S.credit.exposure, c.exposure, c.overLimit ? 'bad' : 'warn'),
        tile(S.credit.available, c.available, c.available > 0 ? 'good' : 'bad'),
      ]),

      el('div', { style: { display: 'grid', gridTemplateColumns: 'minmax(0,1fr) minmax(0,1fr)', gap: '18px', alignItems: 'start' } }, [
        U.card({
          title: S.credit.title, note: S.credit.note,
          body: [
            U.ratio({
              label: S.fill(S.credit.utilisation, { pct: HB.pct(c.utilisation, 1) }),
              value: c.utilisation, threshold: 1, dir: 'above',
              display: HB.pct(c.utilisation, 1),
              foot: U.moneyText(c.exposure, { currency: true }) + ' of ' + U.moneyText(c.limit, { currency: true }),
              thresholdLabel: 'limit',
            }),
            el('p', { class: 'hb-sub', style: { marginTop: '14px' } },
              c.available > 0 ? S.fill(S.credit.headroom, { amount: U.moneyText(c.available, { currency: true }) }) : S.credit.noHeadroom),
            c.overLimit ? el('div', { style: { marginTop: '12px' } }, U.banner('bad', S.credit.overLimit, c.atLimit)) : null,
          ],
        }),
        U.card({
          title: S.credit.policyTitle,
          actions: [U.pill(S.credit.policies[c.policy], c.policy === 'enforce_hold' ? 'red' : c.policy === 'require_approval' ? 'orange' : 'navy')],
          body: [
            el('p', { class: 'hb-sub', style: { marginTop: 0 } }, S.fill(S.credit.policyNote, { policy: S.credit.policies[c.policy] })),
            U.banner(c.policy === 'enforce_hold' ? 'warn' : 'info', null, c.atLimit),
            el('div', { style: { marginTop: '16px' } }, [
              el('h3', { class: 'hb-h3' }, S.credit.openInvoices),
              invs.length === 0
                ? el('p', { class: 'hb-sub', style: { margin: 0 } }, S.statement.empty)
                : el('ul', { class: 'hb-sub', style: { margin: 0, paddingInlineStart: '18px' } },
                  invs.map((i) => el('li', {}, [
                    el('a', { href: U.href('/invoices/' + i.number) }, i.number), ' · ',
                    U.money(i.amountOutstanding, { currency: true }),
                    i.amountPaid > 0 ? ' outstanding of ' : ' · due ',
                    i.amountPaid > 0 ? U.moneyText(i.totalPayable, { currency: true }) + ' · due ' + i.dueDate : i.dueDate,
                  ]))),
            ]),
          ],
        }),
      ]),
    ])
  }

  function tile(label, value, tone) {
    return el('div', { class: 'hb-card', style: { padding: '14px 16px' } }, [
      el('div', { class: 'hb-filter-label' }, label),
      el('div', {
        style: { fontSize: '24px', fontWeight: '700', letterSpacing: '-.02em', marginTop: '2px',
          color: tone === 'bad' ? 'var(--red)' : tone === 'good' ? 'var(--green)' : tone === 'warn' ? 'var(--orange-t)' : 'var(--ink)' },
      }, U.money(value, { currency: true })),
    ])
  }

  // ── Price match ──────────────────────────────────────────────────────────
  /*
   * The copy here is the design. A price match is a request, not a discount, and the
   * buyer has to know that before they act on it — so the conditional sits above the form
   * rather than in small print beneath the submit button.
   */
  function priceMatch() {
    const rows = HB.priceMatches(BUYER_ID)
    const orders = HB.buyerView(BUYER_ID).orders.filter((o) => o.kind !== 'return')

    const stateTone = { credit_issued: 'green', accepted: 'green', declined: 'red', under_review: 'orange', submitted: 'blue' }

    return U.frag([
      U.note('Conditional, and said so',
        'The discount is not the buyer’s until the supplier accepts. Copy that promises a saving and then withdraws it costs more trust than the saving was worth.'),

      el('div', { style: { display: 'grid', gridTemplateColumns: 'minmax(0,.9fr) minmax(0,1.1fr)', gap: '18px', alignItems: 'start' } }, [
        U.card({
          title: S.priceMatch.formTitle, note: S.priceMatch.note,
          body: [
            U.banner('warn', S.priceMatch.conditional, S.priceMatch.conditionalNote),
            el('div', { style: { marginTop: '18px', display: 'grid', gap: '14px' } }, [
              field(S.priceMatch.order, el('select', { class: 'hb-input' },
                orders.map((o) => el('option', { value: o.id }, o.id + ' · ' + o.sellerName + ' · ' + HB.money(o.amountDue, { currency: true }))))),
              field(S.priceMatch.claimed, el('input', { class: 'hb-input', inputmode: 'decimal', placeholder: '0.000' })),
              field(S.priceMatch.evidence, el('label', { class: 'hb-drop' }, [
                el('span', { class: 'hb-drop-cta' }, S.priceMatch.upload),
                el('span', { class: 'hb-sub', style: { margin: 0 } }, S.priceMatch.uploadHint),
                el('input', { type: 'file', accept: '.pdf,image/*', style: { display: 'none' } }),
              ]), S.priceMatch.evidenceNote),
            ]),
          ],
          foot: el('button', { class: 'hb-btn hb-btn--primary' }, S.priceMatch.submit),
        }),

        el('div', { class: 'hb-stack' }, [
          U.card({
            title: S.priceMatch.requests, flush: rows.length > 0,
            body: rows.length === 0
              ? U.empty(S.priceMatch.empty, S.priceMatch.emptyNote)
              : U.table({
                compact: true,
                columns: [
                  { label: S.priceMatch.colId, cell: (r) => el('strong', {}, r.id) },
                  { label: S.priceMatch.colOrder, cell: (r) => r.orderId },
                  { label: S.priceMatch.colDate, cell: (r) => r.date },
                  { label: S.priceMatch.colClaimed, num: true, cell: (r) => U.money(r.claimedPrice, { currency: true }) },
                  { label: S.priceMatch.colState, cell: (r) => U.pill(S.priceMatch[r.state], stateTone[r.state]) },
                ],
                rows,
                rowKey: (r) => r.id,
                rowLabel: (r) => 'Open ' + r.id,
                onRowClick: (r) => openRequest(r),
              }),
          }),
          U.card({
            title: S.priceMatch.trackTitle,
            body: el('div', { class: 'hb-life' }, HB.PRICE_MATCH_STATES.map((st, i) =>
              el('div', { class: 'hb-stage hb-stage--' + (st === 'declined' ? 'bad' : st === 'credit_issued' ? 'done' : 'skip') }, [
                el('div', { class: 'hb-stage-rail' }, [
                  el('div', { class: 'hb-stage-dot', 'aria-hidden': 'true' }, st === 'declined' ? '✕' : st === 'credit_issued' ? '✓' : String(i + 1)),
                  el('div', { class: 'hb-stage-line' }),
                ]),
                el('div', { class: 'hb-stage-body' }, [
                  el('div', { class: 'hb-stage-title' }, S.priceMatch[st]),
                  el('div', { class: 'hb-stage-note' }, {
                    submitted: 'Your evidence reaches Highbase.',
                    under_review: 'Highbase checks the evidence and puts it to the supplier.',
                    accepted: 'The supplier agrees to the price.',
                    declined: 'The supplier does not agree. Your original price stands and your order is unchanged.',
                    credit_issued: 'Highbase funds the difference and credits it to your order.',
                  }[st]),
                ]),
              ]))),
          }),
        ]),
      ]),
    ])
  }

  const field = (label, control, note) =>
    el('label', { class: 'hb-field' }, [
      el('span', { class: 'hb-filter-label' }, label),
      control,
      note ? el('span', { class: 'hb-sub', style: { margin: '2px 0 0' } }, note) : null,
    ])

  function openRequest(r) {
    U.drawer({
      title: r.id,
      subtitle: S.priceMatch[r.state] + ' · ' + r.orderId,
      body: [
        r.state === 'declined' ? U.banner('bad', S.priceMatch.declinedReason, r.declineReason) : null,
        r.state === 'credit_issued'
          ? U.banner('good', null, S.fill(S.priceMatch.creditIssued, { amount: U.moneyText(r.creditAmount, { currency: true }) }))
          : null,
        el('dl', { class: 'hb-kv', style: { marginTop: '14px' } }, [
          el('dt', {}, S.priceMatch.colOrder), el('dd', {}, r.orderId),
          el('dt', {}, S.priceMatch.colDate), el('dd', {}, r.date),
          el('dt', {}, S.priceMatch.colClaimed), el('dd', {}, U.money(r.claimedPrice, { currency: true })),
          el('dt', {}, S.priceMatch.evidence), el('dd', {}, r.evidence || '—'),
        ]),
        r.exampleData ? el('p', { class: 'hb-sub', style: { marginTop: '14px' } }, S.common.exampleData) : null,
        el('div', { style: { marginTop: '18px' } },
          el('button', { class: 'hb-btn hb-btn--outline', onclick: () => { U.closeDrawer(); openOrder(r.orderId) } }, 'Open ' + r.orderId + ' →')),
      ],
    })
  }

  // ── Routing ──────────────────────────────────────────────────────────────
  const routes = {
    '/checkout': { title: S.checkout.title, nav: '/checkout', view: checkout },
    '/invoices': { title: S.invoices.title, nav: '/invoices', view: invoicesList },
    '/invoices/:number': { title: S.invoices.title, nav: '/invoices', view: (p) => invoiceDetail(p.number), titleOf: (p) => S.fill(S.invoices.detailTitle, { number: p.number }) },
    '/statement': { title: S.statement.title, nav: '/statement', view: statement },
    '/credit': { title: S.credit.title, nav: '/credit', view: credit },
    '/price-match': { title: S.priceMatch.title, nav: '/price-match', view: priceMatch },
  }

  let current = { pattern: '/invoices', params: {} }

  function render() {
    const r = routes[current.pattern]
    shell.content.textContent = ''
    if (!r) { shell.content.appendChild(U.empty(S.common.notFound, S.common.notFoundNote)); return }
    // The designed loading and error states, reachable from the sidebar. See ui.js.
    const demo = U.demoState()
    if (demo) {
      shell.content.appendChild(el('div', { class: 'hb-stack' }, [
        U.card({
          title: r.title,
          note: demo === 'loading' ? S.common.loadingNote : S.common.errorNote2,
          flush: true,
          body: demo === 'loading' ? U.loading(6) : U.errorState(),
          foot: el('a', { class: 'hb-btn hb-btn--quiet', href: U.stateHref(null) }, '← ' + S.common.backToLive),
        }),
      ]))
      return
    }
    shell.setTitle(r.titleOf ? r.titleOf(current.params) : r.title,
      HB.buyer(BUYER_ID).name + ' · as at ' + U.modes().today)
    shell.setActive(r.nav)
    try {
      shell.content.appendChild(el('div', { class: 'hb-stack' }, [r.view(current.params)]))
    } catch (err) {
      shell.content.appendChild(U.errorState())
      if (typeof console !== 'undefined') console.error(err)
    }
  }

  U.router(routes, {
    fallback: '/invoices',
    render: (pattern, params) => { current = { pattern: pattern, params: params }; render() },
  }).go()

  // Invariant 2 gets its DOM half here: the test scans the rendered buyer page.
  if (window.HBTest) window.HBTest.run()
  }
})(typeof globalThis !== 'undefined' ? globalThis : this)

</script>
<script>
/*
 * Start whichever surface the URL asks for, and be able to do it again.
 *
 * In the multi-file build the page decides which app runs. Here the query does, and
 * because the bundle switches surface without navigating, starting has to be repeatable:
 * tear down whatever is mounted, drop any open drawer, and start the next one. The role is
 * stamped on <body> first because the buyer's invariant-2 check reads it.
 */
window.HBBoot = function () {
  HBUI.closeDrawer()
  var kids = Array.prototype.slice.call(document.body.children)
  for (var i = 0; i < kids.length; i++) if (kids[i].tagName !== 'SCRIPT') kids[i].remove()
  document.body.style.overflow = ''
  var role = new URLSearchParams(location.search).get('role')
  if (['buyer', 'seller', 'admin'].indexOf(role) < 0) role = null
  document.body.setAttribute('data-role', role || 'picker')
  HBApps[role || 'picker'](HB, HBStrings, HBUI)
}
window.HBBoot()
</script>
  </body>
</html>
