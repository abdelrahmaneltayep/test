<script>
/**
 * Acceptance tests — §8 of the brief, as runnable assertions.
 *
 * These run on load in every surface and headless in Node. They are the reason the model
 * was built before any screen: a prototype whose numbers are wrong is worse than no
 * prototype, because it gets believed.
 *
 * Each test derives the figure it is defending. Nothing here compares a literal to the
 * same literal — where a test names 227.500, the left-hand side came out of the postings.
 *
 * The three invariants are enforced here as assertions over the model rather than as
 * copy, and two of them are checked at the data boundary rather than on a rendered page:
 * a rule that only holds if every future screen remembers it is not an invariant.
 */
;(function (root, factory) {
  const HB = root.HB || (typeof require !== 'undefined' ? require('./data.js') : null)
  const S = root.HBStrings || (typeof require !== 'undefined' ? require('./strings.js') : null)
  const api = factory(HB, S)
  root.HBTest = api
  if (typeof module !== 'undefined' && module.exports) module.exports = api
})(typeof globalThis !== 'undefined' ? globalThis : this, function (HB, S) {
  'use strict'

  const M = (f) => HB.money(f)

  function run(opts) {
    const o = opts || {}
    const R = []
    const check = (n, name, got, want, note) =>
      R.push({ n: String(n), name, pass: got === want, got, want, note })

    // ══ Reconciliation ══════════════════════════════════════════════════════
    const b1042 = HB.balance('1042')
    check(1, 'Seller #1042 payable is exactly 227.500', M(b1042.payable), '227.500')

    const mix = HB.collectionMix('1042')
    const commission = HB.reconcile('1042').expectedTotal
    check(2, 'Identity 375.000 − 31.200 − 116.300 = 227.500 holds',
      M(mix.online - commission - b1042.paidOut), M(b1042.payable),
      M(mix.online) + ' − ' + M(commission) + ' − ' + M(b1042.paidOut))

    check(3.1, 'Seller-collected share is 63.9%', HB.pct(mix.direct, mix.net), '63.9%')
    check(3.2, 'Unsecured commission is 19.950', M(b1042.dues), '19.950')

    const filed = HB.balance('1042', { filing: 'as_filed' })
    const over = HB.overstatement('1042')
    check(4.1, 'As filed, the stated balance is 518.500', M(filed.statedBalance), '518.500')
    check(4.2, 'The overstatement is 291.000', M(over.amount), '291.000',
      HB.pct(over.shareOfBook, 1) + ' of the book · ' + over.timesCommission.toFixed(2) + '× commission earned')

    const recFiled = HB.reconcile('1042', { filing: 'as_filed' })
    const recRight = HB.reconcile('1042')
    check(5.1, 'Control FAILS as filed', recFiled.passes, false,
      'expected ' + M(recFiled.expectedTotal) + ' · actual ' + M(recFiled.actualTotal) + ' · delta ' + HB.money(recFiled.delta, { signed: true }))
    check(5.2, 'Control PASSES corrected', recRight.passes, true,
      'expected ' + M(recRight.expectedTotal) + ' · actual ' + M(recRight.actualTotal))

    const allFiled = HB.reconcileAll({ filing: 'as_filed' })
    check(6.1, 'Across the whole book, exactly one offender', allFiled.offenders.length, 1)
    check(6.2, 'The offender is RET-1007 by name', allFiled.offenders[0] && allFiled.offenders[0].orderId, 'RET-1007',
      allFiled.offenders[0] ? 'expected ' + M(allFiled.offenders[0].expected) + ' · actual ' + M(allFiled.offenders[0].actual) : '')

    // ══ Payout rule ═════════════════════════════════════════════════════════
    const b1067 = HB.balance('1067')
    check(7.1, 'Seller #1067 payable caps at 81.000', M(b1067.payable), '81.000',
      'book owes ' + M(b1067.bookOwed) + ' · cash held ' + M(b1067.cashBacked))
    check(7.2, 'Seller #1067 reports 0.300 unfunded', M(b1067.unfunded), '0.300')

    const m2001 = HB.highbaseMargin('ORD-2001')
    check(8, "Highbase's net on ORD-2001 is −6.300", M(m2001.net), '−6.300',
      'earned ' + M(m2001.earned) + ' · funded ' + M(m2001.funded))

    const b1103 = HB.balance('1103')
    check(9.1, 'Seller #1103 payable is 0.000', M(b1103.payable), '0.000')
    check(9.2, 'Seller #1103 dues are 159.000', M(b1103.dues), '159.000',
      'cash held ' + M(b1103.cashBacked) + ' — none of it recoverable by netting')

    // ══ Fourth state ════════════════════════════════════════════════════════
    const b1088 = HB.balance('1088')
    check(10.1, 'Seller #1088 awaiting is 300.000 gross', M(b1088.awaitingGross), '300.000')
    check(10.2, 'Seller #1088 awaiting is 291.000 net', M(b1088.awaitingNet), '291.000')
    /*
     * 54.600, not the 56.400 the brief first stated. The brief derived it as
     * "60.00 − 3.60 netted dues", which nets the dues on ORD-3002 but omits ORD-3003's
     * own commission — and ORD-3003 is Highbase-collected and immediate, so it accrues
     * like any other:
     *
     *     60.000 cash − 3.600 (ORD-3002 dues) − 1.800 (ORD-3003 commission) = 54.600
     *
     * The brief has been corrected to match its own formula, which is the one #1042's
     * anchor case depends on. See BRIEF-CORRECTIONS.md.
     */
    check(10.3, 'Seller #1088 payable is 54.600', M(b1088.payable), '54.600',
      M(b1088.cashBacked) + ' cash − 3.600 dues − 1.800 commission')

    const agentRun = HB.settlementRun('1088', { risk: 'agent' })
    const guarantorRun = HB.settlementRun('1088', { risk: 'guarantor' })
    check(11.1, 'Agent mode excludes ORD-3001 from the run', agentRun.included.indexOf('ORD-3001'), -1,
      'carried with reason: ' + (agentRun.carried.find((c) => c.orderId === 'ORD-3001') || {}).reason)
    check(11.2, 'Guarantor mode includes ORD-3001 at delivery', guarantorRun.included.indexOf('ORD-3001') >= 0, true,
      'net release ' + M(guarantorRun.net) + ' vs ' + M(agentRun.net) + ' in agent mode')

    check(12.1, 'Agent label is "Awaiting buyer"', S.stateLabel('awaiting', 'agent'), 'Awaiting buyer')
    check(12.2, 'Guarantor label is "Guaranteed — due"', S.stateLabel('awaiting', 'guarantor'), 'Guaranteed — due')

    // ══ Standing ════════════════════════════════════════════════════════════
    const grades = {}
    for (const s of HB.SELLERS) grades[s.id] = HB.standing(s.id)
    check(13.1, '#1042 stands good', grades['1042'].grade, 'good')
    check(13.2, '#1067 stands watch', grades['1067'].grade, 'watch')
    check(13.3, '#1088 stands watch', grades['1088'].grade, 'watch')
    check(13.4, '#1103 stands suspended', grades['1103'].grade, 'suspended')

    const trigger = (id) => (grades[id].triggers[0] || {}).input
    check(14.1, '#1067 is triggered by discount ratio', trigger('1067'), 'discountRatio',
      grades['1067'].inputs.discountRatio.value.toFixed(3) + ' ≥ 1.000')
    check(14.2, '#1088 is triggered by online share', trigger('1088'), 'onlineShare',
      HB.pct(grades['1088'].inputs.onlineShare.value, 1) + ' < 30.0%')
    check(14.3, '#1103 is triggered by arrears ratio', trigger('1103'), 'arrearsRatio',
      grades['1103'].inputs.arrearsRatio.value.toFixed(3) + ' ≥ 1.000')
    check(14.4, 'Every non-good standing names a cause',
      HB.SELLERS.every((s) => grades[s.id].grade === 'good' || grades[s.id].triggers.length > 0), true)

    // ══ Invariants ══════════════════════════════════════════════════════════
    /*
     * 1 — a seller is never charged commission on a discount Highbase funded. Checked over
     * every order in the book, in both risk modes, rather than over the one seeded example.
     */
    const funded = HB.ORDERS.filter((o) => o.discount && o.discount.funder === 'highbase')
    const badBase = funded.filter((o) => HB.commissionBase(o) !== o.grossValue)
    check(15, 'Invariant 1 — funded discounts never reduce the commission base', badBase.length, 0,
      funded.length + ' funded order(s) checked')

    /*
     * 2 — a buyer never sees commission. Enforced at the boundary: `buyerView` is the only
     * shape a buyer screen may read, and the check walks it for the concept rather than
     * trusting a template. The DOM half runs once a buyer surface exists.
     */
    const leaked = []
    const walk = (v, path) => {
      if (v === null || v === undefined) return
      if (typeof v === 'object') {
        for (const key of Object.keys(v)) {
          if (/commission|rate_?card|rateCard|margin|payable|dues/i.test(key)) leaked.push(path + '.' + key)
          walk(v[key], path + '.' + key)
        }
      }
    }
    for (const b of HB.BUYERS) walk(HB.buyerView(b.id), b.id)
    check(16.1, 'Invariant 2 — the buyer projection carries no commission', leaked.length, 0, leaked.join(' '))
    if (typeof document !== 'undefined' && document.body && document.body.dataset.role === 'buyer') {
      const text = document.body.innerText || ''
      check(16.2, 'Invariant 2 — no buyer screen renders commission', /commission/i.test(text), false)
    } else {
      R.push({ n: '16.2', name: 'Invariant 2 — no buyer screen renders commission', skip: true, note: 'runs on the buyer surface' })
    }

    /*
     * 3 — Finance never pays out more than the cash held. Checked for every seller in
     * every combination of the two modes, because a rule that holds in the demo path and
     * not in the other three is not a rule.
     */
    const breaches = []
    for (const s of HB.SELLERS) {
      for (const filing of HB.FILINGS) {
        for (const risk of HB.RISK_MODES) {
          const run = HB.settlementRun(s.id, { filing, risk })
          if (run.net > run.cashBacked) breaches.push(s.id + '/' + filing + '/' + risk + ' ' + M(run.net) + ' > ' + M(run.cashBacked))
        }
      }
    }
    check(17, 'Invariant 3 — no run releases more than the cash held', breaches.length, 0,
      HB.SELLERS.length * 4 + ' seller/mode combinations checked')

    /*
     * Separation of duties (§6 screen 15). Not one of the eighteen, but the same kind of
     * rule and checked the same way: over every adjustment in every mode, an approval by
     * the issuer must be impossible. Ops issues; Finance approves; nobody does both.
     */
    const dutyBreaches = []
    for (const filing of HB.FILINGS) {
      for (const risk of HB.RISK_MODES) {
        for (const adj of HB.adjustments({ filing, risk })) {
          for (const who of HB.ADMIN_ROLES) {
            const v = HB.canApprove(adj, who)
            if (v.allowed && who === adj.issuedBy) dutyBreaches.push(adj.id + ' approved by its issuer ' + who)
            if (v.allowed && who !== 'finance') dutyBreaches.push(adj.id + ' approved by ' + who)
          }
        }
      }
    }
    check(17.2, 'Separation of duties — the issuer can never approve', dutyBreaches.length, 0,
      HB.adjustments().length + ' adjustment(s) × ' + (HB.FILINGS.length * HB.RISK_MODES.length) + ' modes × ' + HB.ADMIN_ROLES.length + ' roles')

    /*
     * The RET-1007 error decomposes into two legs, and the leverage between them is not a
     * coincidence — it is 1/rate. Pinning it means the claim on the control screen stays
     * true if the rate card ever changes.
     */
    const anat = HB.errorAnatomy('1042', 'RET-1007')
    check(17.3, 'The cash leg outweighs the commission leg by exactly 1/rate',
      anat.leverage.toFixed(4), anat.impliedByRate.toFixed(4),
      'cash ' + HB.money(anat.cashDelta, { signed: true }) + ' · commission ' + HB.money(anat.commissionDelta, { signed: true }) + ' · total ' + HB.money(anat.total, { signed: true }))

    /*
     * Invoicing. The threshold is measured on the taxable amount, before VAT — and
     * ORD-1006 is the case that proves it rather than merely illustrating it: priced at
     * exactly 500.000, it lands at 550.000 with VAT, so the two readings put it on
     * opposite sides. Pinned here because a boundary this close is one someone will
     * "correct" back on a fast read.
     */
    const inv1006 = HB.invoices('B-203').find((i) => i.orderId === 'ORD-1006')
    check(19.1, 'The simplified threshold is measured on the taxable amount', inv1006.simplifiedPermitted, true,
      'taxable ' + M(inv1006.taxableAmount) + ' at the limit · total ' + M(inv1006.totalPayable) + ' over it')
    const inv4002 = HB.invoices('B-203').find((i) => i.orderId === 'ORD-4002')
    check(19.2, 'Above the threshold the full invoice is mandatory', inv4002.simplifiedPermitted, false,
      'taxable ' + M(inv4002.taxableAmount))
    check(19.3, 'VAT is charged at 10% of the taxable amount',
      M(inv4002.vatAmount), M(HB.round3(inv4002.taxableAmount * 0.10)),
      M(inv4002.taxableAmount) + ' + ' + M(inv4002.vatAmount) + ' = ' + M(inv4002.totalPayable))

    /*
     * A part-payment has to be consistent in three places at once, or the prototype tells
     * three different stories about the same 165.000: the buyer's invoice, the seller's
     * accrued commission, and what is still awaiting the buyer.
     */
    const partial = HB.invoices('B-204').find((i) => i.orderId === 'ORD-6001')
    check(20.1, 'A part-paid invoice reads partially_paid', partial.subStatus, 'partially_paid',
      M(partial.amountPaid) + ' of ' + M(partial.totalPayable))
    check(20.2, 'Its outstanding balance is the remainder', M(partial.amountOutstanding), '165.000')
    const b1134 = HB.balance('1134')
    check(20.3, 'Half collected accrues half the commission', M(HB.accruedCommission(HB.order('ORD-6001'), HB.rateCard('rc-v1'), {})), '4.500',
      'full commission would be 9.000')
    check(20.4, 'The paid half becomes cash, the rest stays awaiting',
      M(b1134.cashBacked) + ' / ' + M(b1134.awaitingGross), '250.000 / 150.000',
      'payable ' + M(b1134.payable))
    check(20.5, 'The buyer’s exposure is the outstanding amount, not the invoice total',
      M(HB.creditAccount('B-204').exposure), '165.000')

    /*
     * Two fixes worth pinning, both the same mistake at different depths: reading
     * `collected()` — which is risk-mode aware because it describes the seller's position
     * — to answer a question about what the buyer owes.
     */
    check(20.6, 'An invoice’s status does not change with the risk model',
      HB.invoices('B-204', { risk: 'guarantor' }).map((i) => i.status).join(','),
      HB.invoices('B-204', { risk: 'agent' }).map((i) => i.status).join(','),
      'a guarantee is between Highbase and the seller; the buyer still owes what they owe')
    const gEx = HB.buyerExposure({ risk: 'guarantor' })
    check(20.7, 'Buyer exposure counts what the buyer has actually paid',
      M((gEx.rows.find((r) => r.buyerId === 'B-204') || {}).outstanding), '165.000',
      'the full order is 330.000; 165.000 of it is paid')
    check(20.8, 'Agent mode carries no buyer exposure at all', HB.buyerExposure({ risk: 'agent' }).applicable, false)

    /*
     * The rate-card question is settled: flat 3% is contractual. What the assertions pin
     * is that settling it did not quietly delete the consequence — two sellers were
     * charged more than the withdrawn card promised them, and the claim is sized.
     */
    check(21.1, 'Flat 3% is the contractual card', HB.contractualCard().version, 'v1',
      HB.contractualCard().label)
    check(21.2, 'The advertised card is marked not contractual', HB.advertisedCard().contractual, false,
      HB.advertisedCard().resolution)
    const advEx = HB.advertisedExposure()
    check(21.3, 'Two sellers were charged more than they were shown', advEx.over.length, 2,
      advEx.over.map((r) => HB.seller(r.sellerId).name + ' ' + HB.money(r.gap, { signed: true })).join(' · '))
    check(21.4, 'The claim if all of them asked is 26.600', M(advEx.total), '26.600')
    check(21.5, 'Settling it changed no commission actually charged',
      M(HB.reconcile('1042').expectedTotal), '31.200', 'the counterfactual posts nothing')

    // ── 18 — three decimals, always ────────────────────────────────────────
    const shapes = [0, 1, 999, 1000, -1000, 45500, 1190000, -4500, 81000, 227500, 5300000]
    const badFormat = shapes.map((f) => HB.money(f)).filter((s) => !/^−?[\d,]+\.\d{3}$/.test(s))
    check(18.1, 'The formatter always emits exactly 3 decimals', badFormat.length, 0, badFormat.join(' '))

    if (typeof document !== 'undefined') {
      const nodes = Array.from(document.querySelectorAll('[data-money]'))
      const bad = nodes.map((n) => n.textContent.trim())
        .filter((t) => t && !/^[−+]?[\d,]+\.\d{3}(\s?BHD)?$/.test(t))
      check(18.2, 'Every money value on the page renders 3 decimals', bad.length, 0,
        nodes.length + ' checked' + (bad.length ? ' · ' + bad.slice(0, 5).join(' | ') : ''))
    } else {
      R.push({ n: '18.2', name: 'Every money value on the page renders 3 decimals', skip: true, note: 'no DOM — runs in the browser' })
    }

    const failed = R.filter((r) => !r.skip && !r.pass)
    if (!o.quiet) print(R, failed)
    return { results: R, failed, ok: failed.length === 0 }
  }

  function print(R, failed) {
    const line = (r) => {
      const tag = r.skip ? 'skip' : r.pass ? 'pass' : 'FAIL'
      const got = r.skip ? '' : r.pass ? String(r.got) : 'got ' + JSON.stringify(r.got) + ', expected ' + JSON.stringify(r.want)
      return ['  ' + tag, r.n.padEnd(5), r.name.padEnd(56), got, r.note ? '· ' + r.note : ''].join(' ')
    }
    const out = ['', 'Highbase Billing — acceptance tests', ''].concat(R.map(line))
    out.push('',
      R.filter((r) => r.pass).length + ' passed · ' + failed.length + ' failed · ' +
      R.filter((r) => r.skip).length + ' skipped', '')
    if (typeof console !== 'undefined') console.log(out.join('\n'))
  }

  return { run, print }
})

</script>
<script>
/**
 * Shared components. One drawer, one table, one money renderer, for all three surfaces.
 *
 * The money renderer matters more than it looks. Every amount on every screen goes through
 * `money()`, which stamps `data-money` on the element it returns — which is what lets
 * acceptance test 18 walk the rendered page and prove nothing shows two decimals or four.
 * A formatter you can bypass is a formatter that gets bypassed.
 */
;(function (root, factory) {
  const api = factory(root.HB, root.HBStrings, root)
  root.HBUI = api
  if (typeof module !== 'undefined' && module.exports) module.exports = api
})(typeof globalThis !== 'undefined' ? globalThis : this, function (HB, S, root) {
  'use strict'

  // ── DOM helper ───────────────────────────────────────────────────────────
  function el(tag, props, children) {
    const node = document.createElement(tag)
    for (const k in props || {}) {
      const v = props[k]
      if (v === null || v === undefined || v === false) continue
      if (k === 'class') node.className = v
      else if (k === 'text') node.textContent = v
      else if (k === 'style' && typeof v === 'object') Object.assign(node.style, v)
      else if (k.startsWith('on')) node.addEventListener(k.slice(2).toLowerCase(), v)
      else node.setAttribute(k, v === true ? '' : v)
    }
    for (const c of [].concat(children || [])) {
      if (c === null || c === undefined || c === false) continue
      node.appendChild(typeof c === 'object' ? c : document.createTextNode(String(c)))
    }
    return node
  }
  const frag = (children) => {
    const f = document.createDocumentFragment()
    for (const c of [].concat(children || [])) if (c !== null && c !== undefined && c !== false) f.appendChild(typeof c === 'object' ? c : document.createTextNode(String(c)))
    return f
  }

  // ── Money ────────────────────────────────────────────────────────────────
  function money(fils, opts) {
    const o = opts || {}
    const node = el('span', { 'data-money': '', class: o.class || null })
    node.textContent = HB.money(fils, { currency: o.currency, signed: o.signed })
    // 'auto' colours both directions — right for a ledger movement, wrong for an order
    // value, where a positive number is not a credit and green would imply one.
    if (o.tone === 'auto') node.classList.add(fils < 0 ? 'neg' : fils > 0 ? 'pos' : 'muted')
    else if (o.tone === 'negative') { if (fils < 0) node.classList.add('neg') }
    else if (o.tone) node.classList.add(o.tone)
    return node
  }
  const moneyText = (fils, opts) => HB.money(fils, opts || {})

  // ── Chips ────────────────────────────────────────────────────────────────
  const postingChip = (code) => el('span', { class: 'hb-code hb-code--' + code, title: HB.POSTING[code].label }, code)
  const pill = (text, tone) => el('span', { class: 'hb-pill' + (tone ? ' hb-pill--' + tone : '') }, text)
  const routePill = (route) => route === 'highbase' ? pill(S.ledger.highbase, 'blue') : pill(S.ledger.direct, 'orange')
  const termsPill = (terms) => terms === 'credit' ? pill(S.ledger.credit, 'navy') : pill(S.ledger.immediate)

  /** The standing grade, wherever it appears — wallet, admin exposure, run detail. */
  const standingBadge = (grade) =>
    el('span', { class: 'hb-standing hb-standing--' + grade },
      [el('span', { class: 'hb-standing-dot', 'aria-hidden': 'true' }), S.standing[grade]])

  // ── Tables ───────────────────────────────────────────────────────────────
  /**
   * Columns declare their own alignment and rendering, so no caller writes a `<td>`. Rows
   * that represent an order are keyboard-reachable and open the drawer on Enter as well as
   * on click — a row only a mouse can reach is a row half the reviewers cannot open.
   */
  function table(spec) {
    const wrap = el('div', { class: 'hb-tablewrap' })
    const t = el('table', { class: 'hb-table' + (spec.compact ? ' hb-table--compact' : '') })
    t.appendChild(el('thead', {}, el('tr', {}, spec.columns.map((c) =>
      el('th', { class: c.num ? 'num' : null, scope: 'col' }, c.label)))))

    const body = el('tbody')
    for (const row of spec.rows) {
      const clickable = spec.onRowClick && spec.rowKey && spec.rowKey(row)
      const tr = el('tr', clickable ? {
        'data-click': '', tabindex: '0', role: 'button',
        'aria-label': spec.rowLabel ? spec.rowLabel(row) : undefined,
        onclick: () => spec.onRowClick(row),
        onkeydown: (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); spec.onRowClick(row) } },
      } : {})
      for (const c of spec.columns) tr.appendChild(el('td', { class: c.num ? 'num' : null }, c.cell(row)))
      body.appendChild(tr)
    }
    t.appendChild(body)

    if (spec.foot) {
      t.appendChild(el('tfoot', {}, el('tr', {}, spec.foot.map((f) =>
        el('td', { class: f.num ? 'num' : null, colspan: f.span || null }, f.cell)))))
    }
    wrap.appendChild(t)
    return wrap
  }

  // ── Empty, loading, error ────────────────────────────────────────────────
  const empty = (title, note, action) =>
    el('div', { class: 'hb-empty' }, [
      el('div', { class: 'hb-empty-mark', 'aria-hidden': 'true' }, '—'),
      el('h3', {}, title), el('p', {}, note), action || null,
    ])
  const loading = (rows) =>
    el('div', { class: 'hb-card-body', 'aria-busy': 'true', 'aria-label': S.common.loading },
      Array.from({ length: rows || 4 }, (_, i) =>
        el('div', { class: 'hb-skeleton', style: { width: [92, 78, 85, 64, 71][i % 5] + '%' } })))
  const errorState = () => empty(S.common.errorTitle, S.common.errorNote)

  // ── Cards ────────────────────────────────────────────────────────────────
  function card(opts) {
    return el('section', { class: 'hb-card' }, [
      opts.title ? el('div', { class: 'hb-card-head' }, [
        el('div', {}, [el('h2', {}, opts.title), opts.note ? el('p', { class: 'hb-sub' }, opts.note) : null]),
        opts.actions ? el('div', { style: { marginInlineStart: 'auto', display: 'flex', gap: '8px', flexWrap: 'wrap', alignItems: 'center' } }, opts.actions) : null,
      ]) : null,
      opts.flush ? opts.body : el('div', { class: 'hb-card-body' }, opts.body),
      opts.foot ? el('div', { class: 'hb-card-foot' }, opts.foot) : null,
    ])
  }

  const note = (label, body) => el('div', { class: 'hb-note' }, [el('b', {}, label + ' — '), body])
  const banner = (tone, strongText, body) =>
    el('div', { class: 'hb-banner hb-banner--' + tone }, [
      el('div', {}, [strongText ? el('strong', {}, strongText) : null, body ? el('div', {}, body) : null]),
    ])

  /** A computation shown as a computation, not as a result. */
  function calc(rows, expr) {
    return el('div', { class: 'hb-calc' }, [
      /*
       * A movement is coloured and signed; a balance is neither. Showing "+518.500" in
       * green for a stated balance reads as money arriving, when the number is the whole
       * position — and on this screen it is the wrong position.
       */
      ...rows.map((r) => el('div', { class: 'hb-calc-row' + (r.rule ? ' hb-calc-row--rule' : '') }, [
        el('span', {}, r.label),
        money(r.value, {
          currency: true,
          tone: r.rule || r.plain ? null : 'auto',
          signed: !r.rule && !r.plain && r.value > 0,
        }),
      ])),
      expr ? el('div', { class: 'hb-calc-expr' }, expr) : null,
    ])
  }

  /** A ratio against its threshold — the shape every standing input is shown in. */
  function ratio(opts) {
    const tripped = opts.dir === 'below' ? opts.value < opts.threshold : opts.value >= opts.threshold
    const scale = Math.max(opts.value, opts.threshold) * 1.25 || 1
    return el('div', { class: 'hb-ratio' + (tripped ? ' hb-ratio--trip' : '') }, [
      el('div', { class: 'hb-ratio-head' }, [
        el('b', {}, opts.display), el('span', { class: 'hb-ratio-name' }, opts.label),
        tripped ? el('span', { style: { marginInlineStart: 'auto' } }, pill(opts.dir === 'below' ? 'Below floor' : 'Over limit', 'red')) : null,
      ]),
      el('div', { class: 'hb-ratio-bar' }, [
        el('div', { class: 'hb-ratio-fill', style: { width: Math.min(100, (opts.value / scale) * 100) + '%' } }),
        el('div', { class: 'hb-ratio-mark', style: { left: Math.min(100, (opts.threshold / scale) * 100) + '%' }, title: 'Threshold' }),
      ]),
      el('div', { class: 'hb-ratio-foot' }, [el('span', {}, opts.foot), el('span', {}, opts.thresholdLabel)]),
    ])
  }

  // ── Drawer ───────────────────────────────────────────────────────────────
  /*
   * One drawer for all three surfaces. Esc closes it, focus moves in on open and returns
   * to whatever opened it on close, and the scrim ignores a click that began inside — a
   * drawer that closes because you dragged a selection past its edge loses the thing the
   * reviewer was reading.
   */
  let live = null

  function drawer(opts) {
    closeDrawer()
    const opener = document.activeElement
    const panel = el('div', {
      class: 'hb-drawer', role: 'dialog', 'aria-modal': 'true', 'aria-label': opts.title, tabindex: '-1',
    }, [
      el('div', { class: 'hb-drawer-head' }, [
        el('div', {}, [el('h2', {}, opts.title), opts.subtitle ? el('p', { class: 'hb-sub' }, opts.subtitle) : null]),
        el('button', { class: 'hb-drawer-close', 'aria-label': S.common.close, onclick: () => closeDrawer() }, '✕'),
      ]),
      el('div', { class: 'hb-drawer-body' }, opts.body),
    ])

    let downInside = false
    const scrim = el('div', {
      class: 'hb-scrim',
      onmousedown: (e) => { downInside = panel.contains(e.target) },
      onclick: (e) => { if (e.target === scrim && !downInside) closeDrawer() },
    }, panel)

    const onKey = (e) => { if (e.key === 'Escape') { e.stopPropagation(); closeDrawer() } }
    document.addEventListener('keydown', onKey)
    document.body.appendChild(scrim)
    document.body.style.overflow = 'hidden'
    panel.focus()
    live = { scrim, onKey, opener }
    return live
  }

  function closeDrawer() {
    if (!live) return
    document.removeEventListener('keydown', live.onKey)
    live.scrim.remove()
    document.body.style.overflow = ''
    if (live.opener && live.opener.focus) live.opener.focus()
    live = null
  }

  // ── Modes ────────────────────────────────────────────────────────────────
  /*
   * Both unresolved decisions live in the URL query rather than in a variable, so a link
   * to a screen carries the assumptions it was taken under. "Look at the wallet" and "look
   * at the wallet as a guarantor" are different claims and need different links.
   */
  function modes() {
    const q = new URLSearchParams(location.search)
    const filing = q.get('filing') === 'as_filed' ? 'as_filed' : 'corrected'
    const risk = q.get('risk') === 'guarantor' ? 'guarantor' : 'agent'
    // Every invoice sub-state and aging bucket is a statement about now, so "now" is a
    // parameter too — otherwise the same screen tells a different story every week.
    const today = /^\d{4}-\d{2}-\d{2}$/.test(q.get('today') || '') ? q.get('today') : HB.TODAY
    return { filing, risk, today }
  }
  /**
   * Go somewhere. Two builds, two mechanisms, one call site.
   *
   * The multi-file build navigates: four pages, and the browser does the work. The single
   * file cannot rely on that — a link whose path is unchanged is treated as a
   * same-document navigation and the scripts never re-run, and inside an artifact iframe a
   * full navigation is riskier still. So the bundle rewrites the URL and restarts itself
   * in place. The URL is identical either way, which is what keeps a link shareable
   * between the two builds.
   */
  function navigate(url) {
    if (root.HB_SINGLE && typeof root.HBBoot === 'function') {
      history.replaceState(null, '', url)
      root.HBBoot()
      return
    }
    location.href = url
  }

  function setMode(key, value) {
    const url = new URL(location.href)
    const dflt = key === 'filing' ? 'corrected' : key === 'risk' ? 'agent' : HB.TODAY
    if (value === dflt) url.searchParams.delete(key)
    else url.searchParams.set(key, value)
    navigate(url.toString())
  }
  /** Carry the current modes onto an outbound link, so they survive navigation. */
  function href(hash) {
    const qs = new URLSearchParams(location.search).toString()
    return (qs ? '?' + qs : '') + (hash ? '#' + hash : '')
  }

  /**
   * A link to another surface, carrying the current modes.
   *
   * One function because there are two builds. The multi-file version navigates to a
   * sibling page; the single file carries all four surfaces and selects one with `role`.
   * Every cross-surface link goes through here so neither build has to know about the
   * other's shape.
   */
  function pageHref(role, hash) {
    const q = new URLSearchParams(location.search)
    if (root.HB_SINGLE) {
      /*
       * An absolute URL, and an explicit role on every link including the picker's.
       *
       * Two problems, one fix. A relative `?query` link to the same path navigated — the
       * address bar changed — without re-executing the page's scripts, so the surface
       * never started; and dropping the role for the picker produced a link to the bare
       * path, which is the current document minus its query and does not reload at all.
       * Building the whole URL is what `setMode` already does, and it is the form that
       * demonstrably reloads.
       */
      const url = new URL(location.href)
      url.search = ''
      for (const [k2, v2] of q) url.searchParams.set(k2, v2)
      url.searchParams.set('role', role === 'index' ? 'picker' : role)
      url.hash = hash ? '#' + hash : ''
      return url.toString()
    }
    q.delete('role')
    const qs = q.toString()
    const page = { index: 'index.html', buyer: 'buyer.html', seller: 'seller.html', admin: 'admin.html' }[role]
    return page + (qs ? '?' + qs : '') + (hash ? '#' + hash : '')
  }

  function segmented(options, current, onChange) {
    return el('div', { class: 'hb-seg' }, options.map((o) =>
      el('button', {
        type: 'button', 'aria-pressed': String(o.value === current), 'data-tone': o.tone || null,
        onclick: () => onChange(o.value),
      }, o.label)))
  }

  const filingToggle = () => {
    const m = modes()
    return segmented([
      { value: 'corrected', label: S.common.corrected },
      { value: 'as_filed', label: S.common.asFiled, tone: 'bad' },
    ], m.filing, (v) => setMode('filing', v))
  }

  const riskToggle = () => {
    const m = modes()
    return el('div', { class: 'hb-risk' }, [
      el('span', { class: 'hb-filter-label' }, S.risk.label),
      segmented([
        { value: 'agent', label: S.risk.agent },
        { value: 'guarantor', label: S.risk.guarantor },
      ], m.risk, (v) => setMode('risk', v)),
    ])
  }

  /**
   * The reference date, as a control.
   *
   * Every invoice sub-state and every aging bucket on the buyer surface is a statement
   * about now, and the seed contains one credit invoice. Rather than inventing five more
   * invoices to show five states, the reviewer moves the date and watches the one real
   * invoice pass through them — which is also how the states actually occur.
   */
  function todayControl() {
    const m = modes()
    return el('div', { class: 'hb-risk' }, [
      el('span', { class: 'hb-filter-label' }, S.common.asAt),
      el('input', {
        type: 'date', class: 'hb-input hb-input--date', value: m.today,
        'aria-label': S.common.asAt,
        onchange: (e) => { if (e.target.value) setMode('today', e.target.value) },
      }),
    ])
  }

  /**
   * The as-filed warning, scoped to whoever is being looked at.
   *
   * Saying "figures on this screen are overstated" on a seller whose book contains no
   * mis-filed row is itself a false statement, and a warning that cries wolf on four
   * screens out of five is a warning nobody reads on the fifth.
   */
  function filingWarning(sellerId) {
    if (modes().filing !== 'as_filed') return null
    const rec = sellerId ? HB.reconcile(sellerId, modes()) : HB.reconcileAll(modes())
    return rec.passes
      ? banner('warn', null, S.common.asFiledClean)
      : banner('bad', null, S.common.asFiledWarn)
  }

  /**
   * Which assumptions are not the default, named across the top of every screen.
   *
   * The toggles already show the state, but a toggle is something you look at when you go
   * looking. This is for the screenshot that ends up in a deck: a reader who was not the
   * one who set the mode should not have to notice a highlighted segment to know they are
   * looking at the mis-filed book, or at the guarantor product.
   */
  function modeStrip() {
    const m = modes()
    const off = []
    if (m.filing === 'as_filed') off.push({ label: S.common.asFiled, tone: 'bad', key: 'filing', back: 'corrected' })
    if (m.risk === 'guarantor') off.push({ label: S.risk.guarantor, tone: 'warn', key: 'risk', back: 'agent' })
    if (m.today !== HB.TODAY) off.push({ label: S.common.asAt + ' ' + m.today, tone: 'info', key: 'today', back: HB.TODAY })
    if (off.length === 0) return null
    return el('div', { class: 'hb-modestrip hb-modestrip--' + off[0].tone },
      [el('span', { class: 'hb-modestrip-mark', 'aria-hidden': 'true' }, '●')]
        .concat(off.map((o) => el('strong', {}, o.label)))
        .concat([
          el('span', {}, S.common.nonDefault),
          el('button', {
            class: 'hb-btn hb-btn--quiet hb-btn--sm', style: { marginInlineStart: 'auto' },
            onclick: () => { for (const o of off) setMode(o.key, o.back) },
          }, S.common.resetModes),
        ]))
  }

  /**
   * Loading and error, on demand.
   *
   * A static prototype has nothing to wait for, so these states would never appear — and a
   * state nobody can see is a state nobody reviews. They are reachable by flag instead,
   * from the sidebar, so the design for "this did not load" gets looked at before it is
   * needed rather than after.
   */
  const demoState = () => {
    const v = new URLSearchParams(location.search).get('state')
    return v === 'loading' || v === 'error' ? v : null
  }

  /** The risk model is undecided, and every surface says so rather than implying a choice. */
  const riskBanner = () => {
    const m = modes()
    return el('div', { class: 'hb-riskbanner' }, [
      el('b', {}, S.risk.label + ': ' + S.risk[m.risk] + ' · ' + S.risk.unresolved),
      el('span', {}, m.risk === 'agent' ? S.risk.agentNote : S.risk.guarantorNote),
    ])
  }

  // ── Chrome ───────────────────────────────────────────────────────────────
  function shell(opts) {
    const app = el('div', { class: 'hb-app' })
    const nav = el('nav', { class: 'hb-nav', 'aria-label': opts.persona + ' navigation' })
    for (const group of opts.nav) {
      if (group.label) nav.appendChild(el('div', { class: 'hb-nav-label' }, group.label))
      for (const item of group.items) {
        nav.appendChild(el('a', { href: href(item.href), 'data-nav': item.href }, [
          el('span', { class: 'hb-nav-ico', 'aria-hidden': 'true' }, item.icon), item.label,
        ]))
      }
    }

    app.appendChild(el('aside', { class: 'hb-side' }, [
      el('a', { class: 'hb-brand', href: pageHref('index') }, [
        el('span', { class: 'hb-brand-mark', 'aria-hidden': 'true' }, 'H'), S.brand,
      ]),
      el('div', { class: 'hb-persona' }, [opts.persona, el('strong', {}, opts.personaName)]),
      nav,
      el('div', { class: 'hb-side-foot' }, [
        el('button', {
          class: 'hb-toggle', 'aria-pressed': 'false', 'data-notes': '',
          onclick: (e) => {
            const on = document.body.classList.toggle('hb-notes-on')
            e.currentTarget.setAttribute('aria-pressed', String(on))
            try { sessionStorage.setItem('hb-notes', on ? '1' : '0') } catch (_) {}
          },
        }, S.common.designNotes),
        el('div', { class: 'hb-statelinks' }, [
          el('span', {}, S.common.showState),
          el('a', { href: stateHref('loading') }, S.common.loading),
          el('a', { href: stateHref('error') }, S.common.errorShort),
        ]),
      ]),
    ]))

    const title = el('h1', {}, opts.title)
    const sub = el('p', { class: 'hb-top-sub', style: { margin: 0 } }, '')
    const content = el('main', { class: 'hb-content', id: 'main' })

    app.appendChild(el('div', { class: 'hb-main' }, [
      modeStrip(),
      el('header', { class: 'hb-top' }, [
        el('div', {}, [title, sub]),
        el('div', { class: 'hb-top-right' }, [
          riskToggle(),
          el('span', { class: 'hb-filter-label', style: { marginInlineStart: '6px' } }, S.common.filing),
          filingToggle(),
        ]),
      ]),
      content,
    ]))

    // A skip link, because the navy sidebar is a lot of links to tab through before the
    // first figure on the page.
    document.body.insertBefore(
      el('a', { class: 'hb-skip', href: '#main' }, S.common.skipToContent), document.body.firstChild)
    document.body.appendChild(app)
    try {
      if (sessionStorage.getItem('hb-notes') === '1') {
        document.body.classList.add('hb-notes-on')
        document.querySelector('[data-notes]').setAttribute('aria-pressed', 'true')
      }
    } catch (_) {}

    return {
      content,
      setTitle(t, s) { title.textContent = t; sub.textContent = s || '' },
      setActive(h) {
        for (const a of nav.querySelectorAll('a')) {
          if (a.getAttribute('data-nav') === h) a.setAttribute('aria-current', 'page')
          else a.removeAttribute('aria-current')
        }
      },
    }
  }

  // ── Router ───────────────────────────────────────────────────────────────
  function router(routes, opts) {
    const fallback = (opts && opts.fallback) || Object.keys(routes)[0]
    function parse() {
      const raw = (location.hash || '').replace(/^#/, '')
      const parts = (raw.startsWith('/') ? raw : '/' + raw).split('/').filter(Boolean)
      for (const pattern in routes) {
        const pp = pattern.split('/').filter(Boolean)
        if (pp.length !== parts.length) continue
        const params = {}
        let ok = true
        for (let i = 0; i < pp.length; i++) {
          if (pp[i].startsWith(':')) params[pp[i].slice(1)] = decodeURIComponent(parts[i])
          else if (pp[i] !== parts[i]) { ok = false; break }
        }
        if (ok) return { pattern, params }
      }
      return null
    }
    function go() {
      closeDrawer()
      const match = parse()
      if (!match) {
        if (!location.hash) { location.replace(href(fallback.replace(/^\//, ''))); return }
        opts.render(null, {})
        return
      }
      opts.render(match.pattern, match.params)
      window.scrollTo({ top: 0, behavior: 'instant' })
    }
    /*
     * One hashchange listener at a time. The bundle restarts an app in place when the role
     * changes, and without this each restart would leave the previous surface's router
     * still listening — every hash change then rendering two screens into one body.
     */
    if (root.__hbRoute) window.removeEventListener('hashchange', root.__hbRoute)
    root.__hbRoute = go
    window.addEventListener('hashchange', go)
    return { go, parse }
  }

  // ── Lifecycle drawer ─────────────────────────────────────────────────────
  /**
   * Six stages, in the order the money actually moves.
   *
   * Stage 2 is the one the whole module turns on, so it is drawn as the key stage rather
   * than as another tick: the payment route decides whether the commission on this order
   * is a deduction or a debt, and every number downstream follows from it. Today that
   * decision is not recorded as a billing fact at all — here it is recorded first.
   *
   * `role` controls what the reader is allowed to see. The buyer gets the same six stages
   * with the commission and discount-funding stages withheld, because commission is a
   * Highbase↔seller relationship (invariant 2) and the drawer is shared code.
   */
  function lifecycle(orderId, ctx) {
    const L = S.lifecycle
    const c = ctx || {}
    const m = modes()
    const role = c.role || 'seller'
    const o = HB.order(orderId)
    const s = HB.seller(o.sellerId)
    const b = HB.buyer(o.buyerId)
    const cardRate = HB.rateCard(s.rateCardId)
    const ps = HB.postingsFor(o.sellerId, m).filter((p) => p.orderId === o.id)

    const trueComm = HB.commissionOn(o, cardRate)
    const filedComm = HB.sum(ps.filter((p) => p.commissionCharge !== undefined).map((p) => p.commissionCharge))
    const accrued = HB.commissionAccrues(o, m)
    const misfiled = accrued && filedComm !== trueComm

    const stage = (x) => el('div', { class: 'hb-stage hb-stage--' + (x.tone || 'done') }, [
      el('div', { class: 'hb-stage-rail' }, [
        el('div', { class: 'hb-stage-dot', 'aria-hidden': 'true' }, x.mark || '✓'),
        el('div', { class: 'hb-stage-line' }),
      ]),
      el('div', { class: 'hb-stage-body' }, [
        el('div', { class: 'hb-stage-title' }, [x.title, x.pill || null, x.amount ? el('span', { class: 'hb-stage-amount' }, x.amount) : null]),
        x.meta ? el('div', { class: 'hb-stage-meta' }, x.meta) : null,
        x.note ? el('div', { class: 'hb-stage-note' }, x.note) : null,
      ]),
    ])

    const stages = []

    stages.push(stage({
      title: o.kind === 'return' ? S.common.return : L.placed,
      meta: o.date + ' · ' + o.id + ' · ' + (role === 'buyer' ? s.name : b.name),
      amount: money(o.grossValue, { currency: true, tone: 'auto' }),
      note: o.note || null,
    }))

    stages.push(stage({
      tone: 'key', mark: '!',
      title: L.route,
      pill: frag([routePill(o.paymentRoute), ' ', termsPill(o.terms)]),
      amount: money(HB.buyerPays(o), { currency: true }),
      meta: L.routeKey,
      note: o.terms === 'credit'
        ? S.fill(L.routeCredit, { due: o.dueDate })
        : (o.paymentRoute === 'highbase' ? L.routeHighbase : L.routeSeller),
    }))

    // Invariant 2 — the commission and funding stages are withheld from the buyer, in the
    // shared component, so no buyer screen can render them by forgetting to.
    if (role !== 'buyer') {
      stages.push(stage({
        tone: misfiled ? 'bad' : accrued ? 'done' : 'skip',
        mark: misfiled ? '!' : accrued ? '✓' : '·',
        title: L.commission,
        amount: accrued ? money(-filedComm, { currency: true, tone: 'auto' }) : null,
        meta: accrued ? S.fill(L.commissionOn, { base: moneyText(HB.commissionBase(o), { currency: true }), rate: (cardRate.rate * 100) + '%' }) : null,
        note: misfiled
          ? 'Filed as ' + moneyText(filedComm, { signed: true }) + ' where the order value calls for ' + moneyText(trueComm, { signed: true }) + '. This is the RET-1007 sign error.'
          : !accrued ? L.commissionDeferred
            : (o.discount.funder === 'highbase'
              ? S.fill(L.commissionFunded, { gross: moneyText(o.grossValue, { currency: true }), net: moneyText(HB.buyerPays(o), { currency: true }) })
              : null),
      }))

      stages.push(o.discount.amount > 0
        ? stage({
          title: L.discount,
          pill: pill(o.discount.funder === 'highbase' ? 'Highbase-funded' : 'Seller-funded', o.discount.funder === 'highbase' ? 'blue' : 'orange'),
          amount: money(o.discount.amount, { currency: true, signed: true, tone: 'pos' }),
          note: o.discount.funder === 'highbase' ? S.fill(L.discountFunded, { amount: moneyText(o.discount.amount, { currency: true }) }) : o.discount.reason,
        })
        : stage({ tone: 'skip', mark: '·', title: L.discountNone }))
    } else if (o.discount.amount > 0) {
      stages.push(stage({
        title: L.discount,
        amount: money(o.discount.amount, { currency: true, signed: true, tone: 'pos' }),
        note: o.discount.reason,
      }))
    }

    stages.push(o.deliveryConfirmedAt
      ? stage({ title: L.delivery, meta: o.deliveryConfirmedAt })
      : stage({ tone: 'warn', mark: '·', title: L.deliveryPending, note: 'Cash on this order is held until delivery is confirmed.' }))

    /*
     * The last stage has four outcomes, not two. A seller-collected order was never in
     * Highbase's hands, so nothing about it is "released" — the seller already holds the
     * money and owes the commission on it. Calling that a release told the reader the
     * opposite of what the dues figure on their wallet says.
     */
    const reversal = HB.ORDERS.find((x) => x.reverses === o.id)
    const awaiting = o.terms === 'credit' && !HB.isCollected(o, m)
    const direct = o.paymentRoute === 'seller'
    stages.push(stage({
      tone: reversal ? 'warn' : awaiting ? 'key' : direct ? 'warn' : 'done',
      mark: reversal ? '↩' : awaiting ? '…' : direct ? '→' : '✓',
      title: reversal ? L.reversed : awaiting ? S.stateLabel('awaiting', m.risk) : direct ? L.settledDirect : L.released,
      note: reversal ? L.reversedNote
        : awaiting ? L.awaitingNote
          : direct ? L.settledDirectNote
            : (o.terms === 'credit' ? L.guaranteedNote : L.releasedNote),
    }))

    return drawer({
      title: o.id,
      subtitle: (role === 'buyer' ? s.name : b.name) + ' · ' + (o.kind === 'return' ? S.common.return : S.common.order),
      body: [
        misfiled && role !== 'buyer'
          ? banner('bad', 'Sign error on this row', 'The commission on this return was charged instead of credited, and the cash leg was booked as a receipt. See the admin reconciliation control.')
          : null,
        el('div', { class: 'hb-life', style: { marginTop: misfiled ? '14px' : 0 } }, stages),
      ],
    })
  }

  /*
   * Cross-surface links are ordinary anchors — right-clickable, copyable, correct — and in
   * the bundle a delegated listener turns the click into an in-place restart. One listener
   * rather than a handler on every link, so `pageHref` stays a pure function.
   */
  if (root.HB_SINGLE && typeof document !== 'undefined') {
    document.addEventListener('click', (e) => {
      if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey) return
      const a = e.target.closest && e.target.closest('a[href]')
      if (!a) return
      const href = a.getAttribute('href') || ''
      if (!/[?&]role=/.test(href)) return
      e.preventDefault()
      navigate(href)
    })
  }

  /** A link to the current screen with a demo state applied, or cleared. */
  function stateHref(state) {
    const url = new URL(location.href)
    if (state) url.searchParams.set('state', state)
    else url.searchParams.delete('state')
    return url.toString()
  }

  return {
    el, frag, money, moneyText, postingChip, pill, routePill, termsPill, standingBadge,
    modeStrip, demoState, stateHref,
    table, card, note, banner, calc, ratio, empty, loading, errorState,
    drawer, closeDrawer, router, shell, segmented,
    modes, setMode, navigate, href, pageHref, filingToggle, riskToggle, todayControl, filingWarning, riskBanner, lifecycle,
  }
})

<script>
/**
 * Seller dashboard — wallet, standing, settlement ledger, payout runs, rate card.
 *
 * Every figure comes out of HB.balance / HB.standing / HB.settlementRun / HB.reconcile.
 * Nothing is stored and nothing is written down, so the wallet and the ledger cannot drift
 * apart: they are two renderings of one computation.
 */
;(function (root) {
  root.HBApps = root.HBApps || {}
  /*
   * A named app rather than an IIFE that runs itself, so the four surfaces can be bundled
   * into one file and the right one started on demand. The multi-file build calls this at
   * the foot of its own page; the single-file build picks by role.
   */
  root.HBApps.seller = function (HB, S, U) {
    'use strict'

  const el = U.el

  /*
   * Which seller's dashboard this is. The four seed sellers are four different shapes of
   * the same model — good standing, a capped payout, credit orders, and one who collects
   * everything himself — and the wallet is where the difference is legible. Hard-coding
   * one of them would leave the other three visible only from the admin side.
   */
  function sellerId() {
    const q = new URLSearchParams(location.search).get('seller')
    return HB.SELLERS.some((s) => s.id === q) ? q : '1042'
  }
  const SELLER_ID = sellerId()

  function sellerSwitch() {
    return el('div', { class: 'hb-risk' }, [
      el('span', { class: 'hb-filter-label' }, S.personas.seller),
      el('select', {
        class: 'hb-input hb-input--date', 'aria-label': S.personas.seller,
        onchange: (e) => {
          const url = new URL(location.href)
          if (e.target.value === '1042') url.searchParams.delete('seller')
          else url.searchParams.set('seller', e.target.value)
          location.href = url.toString()
        },
      }, HB.SELLERS.map((s) => el('option', { value: s.id, selected: s.id === SELLER_ID || null },
        s.name + (s.exampleData ? ' · example' : '')))),
    ])
  }

  const NAV = [
    { label: S.nav.money, items: [
      { href: '/wallet', label: S.nav.wallet, icon: '◆' },
      { href: '/ledger', label: S.nav.ledger, icon: '☰' },
      { href: '/runs', label: S.nav.runs, icon: '↗' },
    ] },
    { label: S.nav.account, items: [
      { href: '/standing', label: S.nav.standing, icon: '◑' },
      { href: '/rate-card', label: S.nav.rateCard, icon: '%' },
    ] },
  ]

  const shell = U.shell({
    persona: S.personas.seller, personaName: HB.seller(SELLER_ID).name,
    title: S.wallet.title, nav: NAV,
  })

  document.querySelector('.hb-top-right').prepend(sellerSwitch())

  const openOrder = (id) => U.lifecycle(id, { role: 'seller' })

  // ── Wallet ───────────────────────────────────────────────────────────────
  /**
   * Four states, one question. They are read across as a single sentence — where is the
   * money? — which is why a state at zero stays on screen greyed rather than disappearing.
   * A state that only appears when it is a problem teaches the reader it is an exception.
   */
  function wallet() {
    const m = U.modes()
    const b = HB.balance(SELLER_ID, m)
    const s = HB.seller(SELLER_ID)
    const st = HB.standing(SELLER_ID, m)
    const mix = HB.collectionMix(SELLER_ID, m)

    const state = (key, value, sub) =>
      el('div', { class: 'hb-state hb-state--' + key + (value === 0 ? ' hb-state-zero' : '') }, [
        el('div', { class: 'hb-state-label' }, S.stateLabel(key, m.risk)),
        el('div', { class: 'hb-state-value' }, U.money(value, { currency: true })),
        sub ? el('div', { class: 'hb-state-sub' }, sub) : null,
        el('div', { class: 'hb-state-note' },
          key === 'held' && value === 0 ? S.states.heldEmpty
            : key === 'awaiting' && value === 0 ? S.states.awaitingEmpty
              : S.stateNote(key, m.risk)),
      ])

    return U.frag([
      U.filingWarning(SELLER_ID),
      U.riskBanner(),
      U.note('Where is the money?',
        'One balance answers "what does the book say" and hides three other questions: may we release it, can we actually pay it, and has anyone even been paid. Four states answer all four. Zero is still an answer, so an empty state stays on screen.'),

      el('div', { class: 'hb-states' }, [
        state('payable', b.payable),
        state('held', b.held),
        state('dues', b.dues),
        state('awaiting', b.awaitingGross, b.awaitingGross > 0 ? S.common.net + ' ' + U.moneyText(b.awaitingNet, { currency: true }) : null),
      ]),

      b.dues > 0 ? U.banner('warn', null, S.fill(S.wallet.duesExplain, { amount: U.moneyText(b.dues, { currency: true }) })) : null,
      b.awaitingGross > 0 ? U.banner('info', null, S.fill(S.wallet.awaitingExplain, {
        gross: U.moneyText(b.awaitingGross, { currency: true }), net: U.moneyText(b.awaitingNet, { currency: true }),
      })) : null,
      b.unfunded > 0 ? U.banner('bad', null, S.fill(S.wallet.unfundedWarn, {
        book: U.moneyText(b.bookOwed, { currency: true }), cash: U.moneyText(b.cashBacked, { currency: true }),
        gap: U.moneyText(b.unfunded, { currency: true }),
      })) : null,

      el('div', { style: { display: 'grid', gridTemplateColumns: 'minmax(0,1.1fr) minmax(0,1fr)', gap: '18px', alignItems: 'start' } }, [
        U.card({
          title: S.wallet.cashPosition,
          note: (function () {
            /*
             * Orders that contributed cash, not orders that are fully settled. A
             * part-paid credit order put 150.000 into the total above; leaving it out of
             * the count made the sentence describe a different number from the one
             * beside it.
             */
            const n = HB.ordersFor(SELLER_ID).filter((o) => o.paymentRoute === 'highbase' && HB.collected(o, m) !== 0).length
            return S.fill(n === 1 ? S.wallet.collectedLineOne : S.wallet.collectedLine, {
              collected: U.moneyText(b.collected, { currency: true }), n,
            })
          })(),
          actions: [U.standingBadge(st.grade), el('a', { class: 'hb-btn hb-btn--quiet hb-btn--sm', href: U.href('/standing') }, 'Why? →')],
          body: [
            U.note('Cash position', 'The sentence a flat balance cannot say: what Highbase holds, what it kept, and what it already paid — three numbers that produce the fourth.'),
            /*
             * Held cash is a line here, not an omission. Without it the block reads
             * 280.000 − 8.400 = 71.600 and simply does not add up — which on a screen
             * whose whole job is to explain a number is worse than showing no working.

            U.calc([{ label: S.runs.grossCollected, value: b.collected }]
              .concat(b.held > 0 ? [{ label: S.wallet.heldBack, value: -b.held }] : [])
              .concat([

              paid: U.moneyText(b.paidOut, { currency: true }),

            el('span', { class: 'hb-filter-label' }, S.wallet.nextPayout),
            U.pill(S.fill(S.wallet.nextPayoutOn, { date: s.nextPayoutDate }), 'green'),
            el('a', { class: 'hb-btn hb-btn--quiet', href: U.href('/runs/' + s.cycle.id), style: { marginInlineStart: 'auto' } }, 'Open the pending run →'),
          ]),
        }),

        U.card({
          title: S.wallet.recent, note: S.wallet.recentNote, flush: true,
          body: U.table({
            columns: [
              { label: S.ledger.colDate, cell: (p) => p.date },

              { label: S.ledger.colOrder, cell: (p) => p.orderId || el('span', { class: 'muted' }, p.payoutId) },
              { label: S.ledger.colAmount, num: true, cell: (p) => U.money(p.amount, { tone: 'auto', signed: p.amount > 0 }) },
            ],
            compact: true,
            rows: b.postings.slice().reverse().slice(0, 6),
            rowKey: (p) => p.orderId,
            rowLabel: (p) => 'Open ' + p.orderId,
            onRowClick: (p) => p.orderId && openOrder(p.orderId),
          }),
          foot: el('a', { class: 'hb-btn hb-btn--quiet', href: U.href('/ledger') }, S.wallet.viewLedger + ' →'),
        }),
      ]),
    ])
  }

  // ── Standing ─────────────────────────────────────────────────────────────
  /**
   * The grade, the three ratios that produced it, and what would move it.
   *
   * A grade with no named cause is a credit score, and a credit score is something a
   * seller argues with rather than fixes. So every input is shown against its threshold,
   * the ones that tripped are marked, and the advice is in the seller's own units —
   * settle this much, route this much — not in ratios they would have to invert.
   */
  function standingView() {
    const m = U.modes()
    const st = HB.standing(SELLER_ID, m)
    const s = HB.seller(SELLER_ID)
    const RULES = HB.STANDING_RULES

    const tripped = (input) => st.triggers.some((t) => t.input === input)

    const advice = st.toImprove.map((a) =>
      a.action === 'settle' ? S.fill(S.standing.settle, { amount: U.moneyText(a.amount, { currency: true }) })
        : a.action === 'route' ? S.fill(S.standing.route, { amount: U.moneyText(a.amount, { currency: true }) })
          : S.fill(S.standing.reduce, { ratio: a.ratio.toFixed(2) }))

    return U.frag([
      U.filingWarning(SELLER_ID),
      U.note('Derived, not assigned',
        'Three ratios, recomputed every time the ledger moves. The bar shows the value; the tick shows the threshold. Nothing here is a score somebody set, which is why the seller can be told exactly what moves it.'),

      el('div', { style: { display: 'grid', gridTemplateColumns: 'minmax(0,1.2fr) minmax(0,1fr)', gap: '18px', alignItems: 'start' } }, [
        U.card({
          title: S.standing.detailTitle, note: S.standing.note,
          body: el('div', { style: { display: 'grid', gap: '20px' } }, [
            U.ratio({
              label: S.standing.arrearsRatio, value: st.inputs.arrearsRatio.value, threshold: RULES.watch.arrearsRatio,
              dir: 'above', display: st.inputs.arrearsRatio.value.toFixed(2),
              foot: U.moneyText(st.inputs.arrearsRatio.numerator, { currency: true }) + ' of ' + U.moneyText(st.inputs.arrearsRatio.denominator, { currency: true }) + ' ceiling',
              thresholdLabel: 'watch 0.50 · late 0.80 · suspended 1.00',
            }),
            U.ratio({
              label: S.standing.onlineShare, value: st.inputs.onlineShare.value, threshold: RULES.watch.onlineShare,
              dir: 'below', display: HB.pct(st.inputs.onlineShare.value, 1),
              foot: U.moneyText(st.inputs.onlineShare.numerator, { currency: true }) + ' of ' + U.moneyText(st.inputs.onlineShare.denominator, { currency: true }) + ' GMV',
              thresholdLabel: 'floor 30.0%',
